القاهرة الخديوية، أما التدخل الأوروبي (صندوق الدين والمراقبة الثنائية والوزارة المختلطة) فجاء نتيجة للديون ثم عمّق الأزمة."},{"q":"أفكّر وأفسّر: هل يمكن اعتبار الاقتصاد التابع تقدمًا اقتصاديًّا أم قيدًا على التنمية الوطنية؟ برّر رأيك مستندًا إلى شواهد تاريخية.","a":"كان قيدًا على التنمية الوطنية؛ فقد اعتمد على تصدير المواد الخام واستيراد السلع المصنعة، وسيطر رأس المال الأجنبي على البنوك والخدمات الكبرى، ووُجّه الإنتاج لخدمة الأسواق العالمية بدلًا من المجتمع المحلي، فصار الاقتصاد تابعًا للرأسمالية الأوروبية بعد أن تراجعت الصناعة المحلية."},{"q":"سؤال التفسير المدعوم بالأدلة (فسّر – حلّل – برّر – استدل): هل كانت ثورة 1919م حتمية الحدوث؟","a":"تشير أدلة الدرس إلى أنها كانت شبه حتمية: فمنذ 1882م صارت السيادة الفعلية لبريطانيا، وأصبح الاقتصاد تابعًا يخدم الأسواق العالمية، واتسع التفاوت بين قمة الهرم الاجتماعي والفلاحين المعدمين، وفي المقابل نما الوعي عبر التيارات الفكرية، ورفعت الحركة الوطنية بقيادة مصطفى كامل ومحمد فريد شعارات الاستقلال وإنهاء الاحتلال، فتبلور حلم الحرية والاستقلال."},{"q":"تدريبات الدرس: حلِّل العلاقة بين التحديث، والتبعية والاستقلال في تاريخ مصر الحديث.","a":"كان التحديث طريقًا إلى الاستقلال في عهد محمد علي، إذ نقل مصر تدريجيًّا من ولاية عثمانية إلى كيان أكثر استقلالًا. لكنه في عهد إسماعيل اقترن بالتبعية؛ فمشروعات التحديث والديون وافتتاح القناة زادت النفوذ الأوروبي حتى فقدت مصر استقلالها المالي والسياسي ثم احتُلت عام 1882م، وهي «مفارقة التحديث والتبعية»."},{"q":"تدريبات الدرس: «مشروعات التحديث كانت سببًا في فقدان الاستقلال». ناقش.","a":"صحيحة جزئيًّا: فمشروعات التحديث وزيادة الإنفاق الحكومي أدت إلى تصاعد الديون الخارجية، فأُنشئ صندوق الدين وفُرضت المراقبة الثنائية وشُكّلت الوزارة المختلطة، وفقدت مصر جزءًا كبيرًا من استقلالها. لكن التحديث في عهد محمد علي قرّب مصر من الاستقلال، فالمشكلة كانت في تمويله بالديون وفي الأطماع الاستعمارية التي استغلت ذلك."},{"q":"تدريبات الدرس: قارن بين مشروع محمد علي ومشروع الخديو إسماعيل؛ من حيث النتائج والسيادة.","a":"مشروع محمد علي: جيش نظامي وإدارة مركزية وزراعة وصناعة وبعثات، ونتيجته تحول مصر إلى كيان أكثر استقلالًا وقوة إقليمية حتى ضربة 1840م. مشروع إسماعيل: لقب الخديو 1867م وفرمان الوراثة والقاهرة الخديوية وافتتاح القناة 1869م، لكنه اقترن بالديون وتزايد النفوذ الأوروبي، فانتهى بفقدان جزء كبير من السيادة المالية والسياسية."},{"q":"تدريبات الدرس: ماذا لو لم تُفتح قناة السويس؟","a":"إجابة تخيلية من محتوى الدرس: ربما لم تتحول مصر إلى ممر عالمي للتجارة يربط البحرين، ولم يرتبط اقتصادها بالسوق العالمية بالقدر نفسه، لكنها في المقابل ربما لم تصبح محورًا للصراع الدولي، ولم تجد بريطانيا ذريعة «تأمين طرق التجارة عبر قناة السويس» لاحتلالها."},{"q":"تدريبات الدرس: ماذا لو لم تتراكم الديون على مصر في عهد الخديو إسماعيل؟","a":"لما أُنشئ صندوق الدين ولا فُرضت المراقبة الثنائية ولا شُكّلت الوزارة المختلطة، ولاحتفظت مصر باستقلالها المالي والسياسي، ولفقدت بريطانيا ذريعة «حماية مصالح الدائنين»، فربما استمر الاقتراب من الاستقلال الذي بدأ بلقب الخديو."},{"q":"تدريبات الدرس: فسِّر العلاقة بين: الاقتصاد التصديري، والديون، والاحتلال.","a":"تحولت مصر إلى اقتصاد تصديري مرتبط بالسوق العالمية، وهو تحول مهّد لأزمة الديون والتدخل الأوروبي؛ فمع مشروعات التحديث والإنفاق الحكومي تراكمت الديون، ففقدت مصر استقلالها المالي والسياسي، واتخذت بريطانيا ذلك ذريعة للاحتلال عام 1882م، ثم صار الاقتصاد في عهدها تابعًا يصدّر المواد الخام."},{"q":"تدريبات الدرس: كيف أدت زراعة القطن بمصر في العصر الحديث إلى ظهور طبقات جديدة؟ وإلى تفاوت اجتماعي؟","a":"حوّلت الأرض إلى سلعة وجعلت القطن «الذهب الأبيض»، فكوّن كبار الملاك ثروات هائلة في قمة الهرم، بينما بقي الفلاحون المعدمون والعمال الموسميون في القاعدة وهم أغلب المجتمع، وهاجر كثير منهم إلى المدن فتكونت العشوائيات، فظهر هرم اجتماعي واضح المعالم وتفاوت كبير."},{"q":"تدريبات الدرس: اختر وبرِّر العامل الأهم في فقدان الاستقلال خلال العصر الحديث: التدخل الأوروبي – السياسات الاقتصادية – ضعف الإرادة.","a":"يمكن اختيار التدخل الأوروبي؛ لأنه تجسد في صندوق الدين والمراقبة الثنائية والوزارة المختلطة، ثم التدخل البريطاني الذي أدى إلى احتلال مصر عام 1882م، وقبله ضربة 1840م التي أعادت مصر إلى داخل حدودها، مع أن السياسات الاقتصادية القائمة على الديون فتحت له الباب. ويُقبل أي اختيار مبرر بأدلة من الدرس."},{"q":"تدريبات الدرس: اكتب تفسيرًا: كيف تطور مفهوم الانتماء في مصر الحديثة؟","a":"تحول الانتماء من التوجه العثماني إلى التوجه الوطني: فقد تحولت مصر من ولاية عثمانية إلى كيان أكثر استقلالًا في عهد محمد علي، ثم رفعت الثورة العرابية شعار «مصر للمصريين»، وأكد مصطفى كامل أن «الأمة المصرية هي صاحبة الحق في هذا الوطن»، ونادت الحركة الوطنية بالاستقلال والسيادة."},{"q":"اختر: تُمثِّل المفارقة التي اتسمت بها مشروعات الخديو إسماعيل بمصر في: (أ) قلتها مع وفرة الموارد المالية (ب) نتائجها الإيجابية مع زيادة الديون (ج) نجاحها مع تحقيق استقرار مالي (د) فشلها مع إرهاق ميزانية الدولة","a":"(ب) نتائجها الإيجابية مع زيادة الديون؛ إذ اقتربت مصر من الاستقلال السياسي وأنجزت مشروعات تحديث، لكن ذلك تزامن مع الديون الخارجية وتزايد النفوذ الأوروبي."},{"q":"اختر: يمكن وصف مشروع محمد علي في بناء الدولة الحديثة بأنه: (أ) تحديث عسكري (ب) مشروع انعزالي (ج) مشروع فكري (د) تحديث شامل","a":"(د) تحديث شامل؛ لأنه شمل الجيش النظامي والإدارة المركزية والزراعة والصناعة والبعثات العلمية إلى أوروبا."},{"q":"اختر: يُمثِّل أثر افتتاح قناة السويس على السيادة المصرية في أنه: (أ) عزَّز الاستقلال المالي لمصر (ب) قطع العلاقات مع أوروبا (ج) أنهى التدخل البريطاني (د) حوَّل مصر لمركز صراع دولي","a":"(د) حوَّل مصر لمركز صراع دولي؛ لأنه زاد من أهمية موقعها الجغرافي، واستغله الاحتلال ذريعة للتدخل في شئونها."},{"q":"اختر: تحوَّل مفهوم الانتماء لدى المصريين في العصر الحديث من التوجه: (أ) المصري إلى العثماني (ب) العثماني إلى الوطني (ج) من الأوروبي إلى المصري (د) من الإسلامي إلى العلماني","a":"(ب) العثماني إلى الوطني؛ فقد تحولت مصر من ولاية عثمانية إلى كيان أكثر استقلالًا، ورُفع شعار «مصر للمصريين»، ونادت الحركة الوطنية بالاستقلال والسيادة."},{"q":"اختر: يُميِّز تيار الإصلاح الديني عن غيره من التيارات التي انتشرت في مصر في العصر الحديث: (أ) رفض الغرب كليًّا (ب) التقليد المباشر للغرب (ج) الانعزال عن العالم (د) الوسطية والاعتدال","a":"(د) الوسطية والاعتدال؛ لأنه دعا إلى الاستفادة من علوم الغرب وتقدمه العلمي دون التخلي عن الهوية الإسلامية."},{"q":"ضع (√) أو (×) مع التفسير: ركَّز مشروع محمد علي بشكل واضح على الجانب العسكري دون الأبعاد النهضوية الأخرى.","a":"(×) لأن مشروعه شمل أيضًا إقامة إدارة مركزية قوية، وتطوير الزراعة والصناعة، وإرسال البعثات العلمية إلى أوروبا."},{"q":"ضع (√) أو (×) مع التفسير: كان استقلال مصر عام 1922 استقلالًا كاملًا من دون قيود.","a":"(×) لأن ثورة 1919م لم تحقق الاستقلال الكامل وإن كان من نتائجها تصريح 28 فبراير 1922 (كما يرد في درس لاحق من الكتاب)، واستمر نضال المصريين لتحقيق حلم الحرية والاستقلال في النصف الأول من القرن العشرين."},{"q":"ضع (√) أو (×) مع التفسير: كان التحول الزراعي نحو القطن في القرن التاسع عشر مفيدًا بالكامل من دون آثار سلبية.","a":"(×) لأنه رغم ربط مصر بالسوق العالمية وإتاحة فرص للنمو، زاد ثراء كبار الملاك بينما هاجر الفلاحون إلى المدن وتكونت العشوائيات، وجعل الاقتصاد تصديريًّا مهّد لأزمة الديون والتدخل الأوروبي."},{"q":"ضع (√) أو (×) مع التفسير: أثَّرت زيادة الديون الخارجية في القرن التاسع عشر على زيادة التدخل الأجنبي في مصر.","a":"(√) لأنها أدت إلى إنشاء صندوق الدين وفرض المراقبة الثنائية الأوروبية وتشكيل وزارة مختلطة، ثم اتخذتها بريطانيا ذريعة لاحتلال مصر."},{"q":"ضع (√) أو (×) مع التفسير: عكس تنوُّع التيارات الفكرية في مصر في القرن التاسع عشر ضعف الوعي القومي.","a":"(×) بل عكس يقظة الوعي؛ فقد نشأت التيارات نتيجة انتشار التعليم وعودة المبتعثين والاحتكاك بأوروبا، ورفض المصريون استمرار تراجع بلدهم وحاولوا اللحاق بركب الحضارة الحديثة."}],"era":"العصر الحديث"}],"keys":[{"d":"3200 ق.م","e":"توحيد القُطرين على يد الملك مينا (نعارمر) وبداية عصر الدولة القديمة","sid":"l1s5"},{"d":"332 ق.م","e":"دخول الإسكندر الأكبر مصر","sid":"l2s4"},{"d":"30 ق.م","e":"دخول مصر تحت الحكم الروماني","sid":"l2s5"},{"d":"641م","e":"الفتح الإسلامي لمصر","sid":"l3s1"},{"d":"1517م","e":"دخول مصر تحت الحكم العثماني","sid":"l3s1"},{"d":"1798م","e":"الحملة الفرنسية على مصر","sid":"l4s1"},{"d":"1805م","e":"تولي محمد علي حكم مصر وبداية بناء الدولة الحديثة","sid":"l4s1"},{"d":"1882م","e":"الاحتلال البريطاني لمصر","sid":"l4s5"},{"d":"1919م","e":"ثورة الشعب المصري ضد الاحتلال البريطاني","sid":"l1s1"},{"d":"1952م","e":"ثورة يوليو وبناء الجمهورية","sid":"l1s6"},{"d":"1973م","e":"حرب أكتوبر واستعادة الكرامة الوطنية","sid":"boss"}]}</script>
<script>
document.documentElement.lang = 'ar';
document.documentElement.dir = 'rtl';
const D = JSON.parse(document.getElementById('data').textContent);
const L = D.lessons;
const KEYS = D.keys;
const app = document.getElementById('app');
const SEC = {};
L.forEach((l, li) => l.sections.forEach((s, si) => { SEC[s.id] = { l, li, s, si }; }));
const LC = ['var(--l1)', 'var(--l2)', 'var(--l3)', 'var(--l4)'];
const ORD = ['الأول', 'الثاني', 'الثالث', 'الرابع'];
const KIND = { concept: 'مفهوم', date: 'تاريخ', person: 'شخصية', place: 'مكان', cause: 'أسباب', result: 'نتائج', fact: 'معلومة', quote: 'من الوثائق' };
const TYPE = { mcq: 'اختيار من متعدد', tf: 'صواب أم خطأ؟', order: 'رتّب', match: 'صِل', sort: 'صنّف', who: 'لغز', fill: 'أكمل الفراغ' };
const LET = ['أ', 'ب', 'ج', 'د', 'هـ'];
const YAY = ['أحسنت!', 'إجابة ذهبية!', 'ممتاز!', 'رائع!', 'مؤرخ حقيقي!'];
const NAY = ['ليست صحيحة', 'اقتربت!', 'لا بأس، تعلّمها الآن'];
const STAR = on => `<svg class="star${on ? ' on' : ''}" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></svg>`;
const ANKH = on => `<svg class="ankh${on ? ' on' : ''}" viewBox="0 0 24 32" aria-hidden="true"><path fill-rule="evenodd" d="M12 2c-3.6 0-6 2.9-6 6.4 0 2.8 1.6 5.2 3.6 6.6H3v4h7v11h4V19h7v-4h-6.6c2-1.4 3.6-3.8 3.6-6.6C18 4.9 15.6 2 12 2zm0 4c1.3 0 2 1.2 2 2.6 0 2-1 3.8-2 5-1-1.2-2-3-2-5C10 7.2 10.7 6 12 6z"/></svg>`;
const ICON = {
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  on: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
  off: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 5 6M21 9l-5 6"/></svg>'
};

const digits = s => String(s).replace(/[0-9]/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const num = n => Number(n).toLocaleString('ar-EG');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const fmt = s => digits(esc(s ?? '').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pickOne = a => a[Math.random() * a.length | 0];

const KEY = 'miftah-altawarikh-v1';
const fresh = () => ({ sec: {}, boss: 0, sound: true });
let store = (() => { try { return { ...fresh(), ...JSON.parse(localStorage.getItem(KEY) || '{}') }; } catch (e) { return fresh(); } })();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };
const done = sid => store.sec[sid];
const ids = Object.keys(SEC);
const MAXXP = ids.reduce((n, id) => n + SEC[id].s.quiz.length, 0) * 180;
const RANKS = [[0, 'تلميذ في مدرسة الكتبة'], [.05, 'كاتب مبتدئ'], [.15, 'كاتب ماهر'], [.3, 'مؤرخ شاب'], [.5, 'كبير المؤرخين'], [.72, 'حارس ذاكرة مصر']].map(([f, n]) => [Math.round(f * MAXXP / 100) * 100, n]);
const keyOn = k => k.sid === 'boss' ? store.boss > 0 : !!done(k.sid);
const totalXP = () => ids.reduce((n, id) => n + (done(id)?.xp || 0), 0) + store.boss;
const totalStars = () => ids.reduce((n, id) => n + (done(id)?.stars || 0), 0);
const isOpen = sid => { const { l, si } = SEC[sid]; return si === 0 || !!done(l.sections[si - 1].id); };
const allDone = () => ids.every(done);
const rankOf = xp => RANKS.reduce((r, x, i) => xp >= x[0] ? i : r, 0);

let ac;
const tone = (fs, dur = .14, type = 'triangle', gap = .09, vol = .07) => {
  if (!store.sound) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = ac.currentTime + .01;
    fs.forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain(), t = t0 + i * gap;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + .015);
      g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + dur + .03);
    });
  } catch (e) {}
};
const sfx = {
  ok: () => tone([659, 988]),
  bad: () => tone([196, 147], .2, 'square', .12, .03),
  tap: () => tone([587], .05, 'sine', 0, .03),
  win: () => tone([523, 659, 784, 1047, 1319], .22, 'triangle', .1),
  lose: () => tone([392, 330, 262, 196], .26, 'triangle', .15)
};

function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.getElementById('fx'), x = c.getContext('2d');
  const W = c.width = innerWidth, H = c.height = innerHeight;
  const col = ['#e9b949', '#f6da8c', '#3fc4b4', '#ec7b52', '#ab98ff', '#4fc68c'];
  const ps = Array.from({ length: 140 }, () => ({ x: W / 2 + (Math.random() - .5) * 80, y: H * .35, vx: (Math.random() - .5) * 14, vy: -Math.random() * 13 - 4, r: Math.random() * 7 + 5, c: pickOne(col), a: Math.random() * 6, va: (Math.random() - .5) * .35 }));
  let t = 0;
  (function f() {
    x.clearRect(0, 0, W, H);
    ps.forEach(p => { p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); x.restore(); });
    if (++t < 160) requestAnimationFrame(f); else x.clearRect(0, 0, W, H);
  })();
}

let tt;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(tt); tt = setTimeout(() => { t.hidden = true; }, 2800);
}

let view = { name: 'home' };
let tick = 0;
let paint = false;
const cur = () => view.qs[view.i];
const go = v => { view = v; render(true); };
const ro = new ResizeObserver(drawNile);

function render(top) {
  clearInterval(tick);
  const k = document.activeElement?.dataset?.k;
  paint = !!top;
  app.innerHTML = V[view.name]();
  ro.disconnect();
  const m = app.querySelector('.map');
  if (m) ro.observe(m);
  if (top) { window.scrollTo(0, 0); app.querySelector('[data-focus]')?.focus({ preventScroll: true }); }
  else if (k) app.querySelector(`[data-k="${k}"]`)?.focus({ preventScroll: true });
  if (view.name === 'quiz') {
    if (cur().st.done && !view.quitAsk) app.querySelector('[data-k="next"]')?.focus({ preventScroll: true });
    armTimer();
  }
}

function drawNile() {
  const m = app.querySelector('.map'); if (!m) return;
  const W = m.clientWidth, H = m.clientHeight;
  let px = W / 2, py = 0, d = `M${px} 0`;
  m.querySelectorAll('.st').forEach(s => {
    const y = s.offsetTop + s.offsetHeight / 2, x = s.classList.contains('a') ? W * .14 : W * .86, h = (y - py) / 2;
    d += ` C${px} ${py + h} ${x} ${y - h} ${x} ${y}`; px = x; py = y;
  });
  d += ` C${px} ${py + (H - py) / 2} ${W / 2} ${H - (H - py) / 2} ${W / 2} ${H}`;
  const svg = m.querySelector('.nile');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.querySelectorAll('path').forEach(p => p.setAttribute('d', d));
}

const bar = (act, arg, label, xp = true) => `
<div class="bar">
  ${act ? `<button class="back" data-act="${act}" data-arg="${arg ?? ''}" data-k="back">${ICON.back}${label}</button>` : ''}
  <span class="sp"></span>
  ${xp ? `<span class="xpchip">${num(totalXP())} <small>نقطة</small></span>` : ''}
  <button class="iconbtn" data-act="sound" data-k="sound" aria-label="${store.sound ? 'إيقاف الصوت' : 'تشغيل الصوت'}" aria-pressed="${store.sound}">${store.sound ? ICON.on : ICON.off}</button>

const keyCard = k => {

};

function answerText(q) {
  switch (q.type) {
    case 'tf': return `العبارة <b>${q.answer ? 'صحيحة' : 'خاطئة'}</b>`;
    case 'order': return 'الترتيب الصحيح: ' + q.items.map((t, i) => `<b>${digits(i + 1)}</b> ${fmt(t)}`).join(' ← ');
    case 'match': return q.pairs.map(p => `<b>${fmt(p[0])}</b> ← ${fmt(p[1])}`).join('<br>');
    case 'sort': return q.buckets.map((b, bi) => `<b>${fmt(b)}:</b> ${q.items.filter(it => it[1] === bi).map(it => fmt(it[0])).join('، ')}`).join('<br>');
    default: return `الإجابة الصحيحة: <b>${fmt(q.options[q.answer])}</b>`;
  }
}

const qTitle = q => q.type === 'who' ? `${fmt(q.q || 'من أنا؟')} ${fmt(q.clues[q.clues.length - 1])}` : q.type === 'fill' ? fmt(q.q.replace('____', '…')) : fmt(q.q);

const cls = (q, val) => !q.st.done ? '' : val === q.answer ? 'ok' : val === q.st.pick ? 'bad' : 'dim';

const opts = q => `<div class="opts">${q.perm.map((k, i) => `<button class="opt ${cls(q, k)}" data-act="pick" data-arg="${k}" data-k="o${i}"${q.st.done ? ' disabled' : ''}><span class="L">${LET[i]}</span><span>${fmt(q.options[k])}</span></button>`).join('')}</div>`;

const BODY = {
  mcq: opts,
  fill: opts,
  who: q => {
    const n = q.st.done ? q.clues.length : q.shown;
    return `<ol class="clues">${q.clues.slice(0, n).map((c, i) => `<li><span class="cn">تلميح ${digits(i + 1)}</span>${fmt(c)}</li>`).join('')}</ol>
    ${!q.st.done && q.shown < q.clues.length ? `<button class="link" data-act="clue" data-k="clue">اكشف تلميحًا آخر (تقل نقاط السؤال ٤٠ نقطة)</button>` : ''}
    ${opts(q)}`;
  },
  tf: q => `<div class="tf">${[true, false].map((b, i) => `<button class="opt ${cls(q, b)}" data-act="tf" data-arg="${b ? 1 : 0}" data-k="tf${i}"${q.st.done ? ' disabled' : ''}>${b ? 'صواب' : 'خطأ'}</button>`).join('')}</div>`,
  order: q => {
    const d = q.st.done;
    const slots = q.items.map((_, p) => {
      const k = q.seq[p];
      if (k == null) return '<li class="slot"></li>';
      return `<li class="slot filled ${d ? (k === p ? 'ok' : 'bad') : ''}"><button data-act="unplace" data-arg="${p}" data-k="s${p}"${d ? ' disabled' : ''}>${fmt(q.items[k])}</button></li>`;
    }).join('');
    const pool = q.pool.filter(k => !q.seq.includes(k));
    return `${d ? '' : '<p class="hintline">اضغط على العناصر بالترتيب الصحيح لتضعها في الخانات. للتراجع اضغط على العنصر داخل الخانة.</p>'}
    <ol class="seq">${slots}</ol>
    ${pool.length ? `<div class="pool">${pool.map(k => `<button class="chip" data-act="place" data-arg="${k}" data-k="p${k}">${fmt(q.items[k])}</button>`).join('')}</div>` : ''}
    ${d ? '' : `<button class="btn check" data-act="check" data-k="check"${pool.length ? ' disabled' : ''}>تحقق</button>`}`;
  },
  match: q => {
    const d = q.st.done, no = {}, by = {};
    q.left.forEach((i, p) => { no[i] = p + 1; });
    Object.keys(q.link).forEach(i => { by[q.link[i]] = +i; });
    const isSel = (s, i) => q.sel && q.sel.s === s && q.sel.i === i;
    const lc = q.left.map(i => {
      const on = q.link[i] != null;
      return `<button class="m${on ? ' on' : ''}${isSel('l', i) ? ' sel' : ''}${d ? (q.link[i] === i ? ' ok' : ' bad') : ''}" data-act="ml" data-arg="${i}" data-k="ml${i}" aria-pressed="${isSel('l', i)}"${d ? ' disabled' : ''}>${on ? `<span class="tag">${digits(no[i])}</span>` : ''}${fmt(q.pairs[i][0])}</button>`;
    }).join('');
    const rc = q.right.map(j => {
      const on = by[j] != null;
      return `<button class="m${on ? ' on' : ''}${isSel('r', j) ? ' sel' : ''}${d ? (by[j] === j ? ' ok' : ' bad') : ''}" data-act="mr" data-arg="${j}" data-k="mr${j}" aria-pressed="${isSel('r', j)}"${d ? ' disabled' : ''}>${on ? `<span class="tag">${digits(no[by[j]])}</span>` : ''}${fmt(q.pairs[j][1])}</button>`;
    }).join('');
    const full = Object.keys(q.link).length === q.pairs.length;
    return `${d ? '' : '<p class="hintline">اختر عنصرًا من أحد العمودين ثم ما يقابله من العمود الآخر. العنصران المترابطان يحملان الرقم نفسه، واضغط على أي عنصر مرتبط لفكّه.</p>'}
    <div class="match"><div class="mcol">${lc}</div><div class="mcol">${rc}</div></div>
    ${d ? '' : `<button class="btn check" data-act="check" data-k="check"${full ? '' : ' disabled'}>تحقق</button>`}`;
  },
  sort: q => {
    const d = q.st.done;
    const chip = k => `<button class="chip${q.sel === k ? ' sel' : ''}${d ? (q.put[k] === q.items[k][1] ? ' ok' : ' bad') : ''}" data-act="ssel" data-arg="${k}" data-k="c${k}" aria-pressed="${q.sel === k}"${d ? ' disabled' : ''}>${fmt(q.items[k][0])}</button>`;
    const pool = q.pool.filter(k => q.put[k] == null);
    return `${d ? '' : '<p class="hintline">البطاقة المضيئة جاهزة، اضغط على الخانة المناسبة لها. ويمكنك اختيار بطاقة أخرى، أو إعادة بطاقة من الخانة بالضغط عليها.</p>'}
    ${pool.length ? `<div class="pool">${pool.map(chip).join('')}</div>` : ''}
    <div class="buckets${q.sel != null ? ' armed' : ''}">${q.buckets.map((b, bi) => `
      <div class="bucket">
        <button class="bhead" data-act="drop" data-arg="${bi}" data-k="b${bi}"${d || q.sel == null ? ' disabled' : ''}>${fmt(b)}</button>
        <div class="bitems">${q.pool.filter(k => q.put[k] === bi).map(chip).join('')}</div>
      </div>`).join('')}</div>
    ${d ? '' : `<button class="btn check" data-act="check" data-k="check"${pool.length ? ' disabled' : ''}>تحقق</button>`}`;
  }
};

const stem = q => {
  if (q.type === 'fill') {
    const [a, ...b] = q.q.split('____');
    return `<h2 class="qtext" tabindex="-1" data-focus>${fmt(a)}<span class="blank${q.st.done ? ' ok' : ''}">${q.st.done ? fmt(q.options[q.answer]) : '؟'}</span>${fmt(b.join('____'))}</h2>`;
  }
  return `<h2 class="qtext" tabindex="-1" data-focus>${fmt(q.q || 'من أنا؟')}</h2>`;

V.quiz = () => {

  </div>
  <main class="wrap quiz${q.st.done ? ' pad' : ''}${paint ? ' enter' : ''}${fx ? ' fx' : ''}" style="--c:${v.boss ? 'var(--bad)' : LC[sec.li]}">
    ${v.quitAsk ? '<div class="confirm"><span>هل تريد الخروج؟ لن يُحفظ تقدمك في هذا التحدي.</span><button class="btn bad" data-act="quitYes" data-k="qy">خروج</button><button class="btn ghost" data-act="quitNo" data-k="qn">أكمل التحدي</button></div>' : ''}
    <div class="qmeta">
      <span>${v.boss ? 'التحدي الختامي · حُرّاس الاستمرارية' : fmt(sec.s.title)}</span>
      <span class="sp"></span>
      ${v.combo >= 2 ? `<span class="combo">سلسلة ×${digits(v.combo)}</span>` : ''}
      <span class="gold">${num(v.xp)} نقطة</span>
    </div>
    ${v.boss ? `<div class="hud">
      <div class="row"><span>الأطماع الخارجية</span><div class="hpbar"><i style="--p:${v.hp / n}"></i></div></div>
      <div class="row"><span>الوقت</span><div class="tbar" id="tbar" style="--p:${q.st.done ? 0 : (q.st.left ?? 1)}"><i></i></div></div>
    </div>` : ''}
    <section class="qcard${q.st.done ? (q.st.ok ? ' is-ok' : ' is-bad') : ''}">
      <div class="qhead"><span class="qtype">${TYPE[q.type]}</span><span class="qn">سؤال ${digits(v.i + 1)} من ${digits(n)}</span></div>
      ${stem(q)}
      ${BODY[q.type](q)}
    </section>
    ${q.st.done ? sheet(q) : ''}
  </main>`;
};

V.result = () => {
  const r = view, sec = r.boss ? null : SEC[r.sid];
  const title = r.boss ? 'صمدت الدولة المصرية!' : r.stars === 3 ? 'أداء ذهبي!' : r.stars === 2 ? 'أحسنت!' : 'اجتزت القسم!';
  const sub = r.boss ? 'واجهت أسئلة الوحدة كلها وحافظت على الاستمرارية.' : `أنهيت قسم «${sec.s.title}»`;
  let next = '';
  if (r.boss) next = '<button class="btn" data-act="home" data-k="nx">إلى الخريطة</button>';
  else if (r.nextSid) next = `<button class="btn" data-act="learn" data-arg="${r.nextSid}" data-k="nx">القسم التالي</button>`;
  else if (sec.li + 1 < L.length) next = `<button class="btn" data-act="lesson" data-arg="${sec.li + 1}" data-k="nx">إلى الدرس ${ORD[sec.li + 1]}</button>`;
  else next = `<button class="btn" data-act="${allDone() ? 'boss' : 'home'}" data-k="nx">${allDone() ? 'إلى التحدي الختامي' : 'إلى الخريطة'}</button>`;
  return `${bar(r.boss ? 'home' : 'lesson', r.boss ? '' : sec.li, r.boss ? 'الخريطة' : 'الدرس')}
  <main class="wrap result" style="--c:${r.boss ? 'var(--bad)' : LC[sec.li]}">
    <div class="bigstars" role="img" aria-label="${digits(r.stars)} من ٣ نجوم">${[0, 1, 2].map(i => `<span style="--d:${i * .18}s">${STAR(i < r.stars)}</span>`).join('')}</div>
    <h1 class="h1" tabindex="-1" data-focus>${title}</h1>
    <p class="muted">${fmt(sub)}</p>
    <div class="tiles">
      <div class="tile"><b>${num(r.xp)}</b><span>نقطة${r.record ? ' · رقم قياسي' : ''}</span></div>
      <div class="tile"><b>${digits(r.total - r.wrongQs.length)}/${digits(r.total)}</b><span>إجابة صحيحة</span></div>
      <div class="tile"><b>×${digits(r.best)}</b><span>أطول سلسلة</span></div>
    </div>
    ${r.newKeys.length ? `<div class="unlock"><p class="eyebrow">فتحت ${r.newKeys.length > 1 ? 'مفاتيح جديدة' : 'مفتاحًا جديدًا'} من مفتاح التواريخ</p><ol class="keylist">${r.newKeys.map(i => keyCard(KEYS[i])).join('')}</ol></div>` : ''}
    <div class="actions">
      ${next}
      <button class="btn ghost" data-act="${r.boss ? 'boss' : 'quiz'}" data-arg="${r.boss ? '' : r.sid}" data-k="again">أعد التحدي</button>
    </div>
    ${review(r.wrongQs)}
  </main>`;
};

V.over = () => {
  const r = view, sec = r.boss ? null : SEC[r.sid];
  return `${bar(r.boss ? 'home' : 'lesson', r.boss ? '' : sec.li, r.boss ? 'الخريطة' : 'الدرس')}
  <main class="wrap result" style="--c:var(--bad)">
    <div class="lost" aria-hidden="true">${ANKH(false)}${ANKH(false)}${ANKH(false)}</div>
    <h1 class="h1" tabindex="-1" data-focus>نفدت علامات الحياة</h1>
    <p class="muted">${r.boss ? 'تقدمت الأطماع الخارجية هذه المرة. راجع الدروس ثم عد أقوى.' : 'لا بأس، كل مؤرخ عظيم راجع أوراقه أكثر من مرة. راجع ما فاتك ثم حاول من جديد.'}</p>
    <div class="actions">
      <button class="btn" data-act="${r.boss ? 'boss' : 'quiz'}" data-arg="${r.boss ? '' : r.sid}" data-k="again">أعد المحاولة</button>
      ${r.boss ? '' : `<button class="btn ghost" data-act="learn" data-arg="${r.sid}" data-k="cards">راجع البطاقات</button>`}
    </div>
    ${review(r.wrongQs)}
  </main>`;
};

V.deck = () => {
  const l = L[view.li];
  return `${bar('lesson', view.li, 'الدرس')}
  <main class="wrap" style="--c:${LC[view.li]}">
    <header class="lhead">
      <p class="eyebrow">الدرس ${ORD[view.li]} · ${fmt(l.title)}</p>
      <h1 class="h1" tabindex="-1" data-focus>تدريبات الكتاب</h1>
      <p class="hook">فكّر في الإجابة أولًا، ثم اضغط على السؤال لتكشف الإجابة النموذجية.</p>
    </header>
    <ol class="deck">${l.bookExercises.map((e, i) => `<li><details class="ex"><summary><span class="num">${digits(i + 1)}</span><span>${fmt(e.q)}</span></summary><div class="papyrus"><span class="kind">إجابة نموذجية</span><p>${fmt(e.a)}</p></div></details></li>`).join('')}</ol>
  </main>`;
};

function prep(q) {
  const o = { ...q, st: {} };
  if (q.options) o.perm = shuffle(q.options.map((_, k) => k));
  if (q.type === 'who') o.shown = 1;
  if (q.type === 'order') { let p; do { p = shuffle(q.items.map((_, k) => k)); } while (p.every((x, k) => x === k)); o.pool = p; o.seq = []; }
  if (q.type === 'match') { o.left = shuffle(q.pairs.map((_, k) => k)); o.right = shuffle(q.pairs.map((_, k) => k)); o.link = {}; o.sel = null; }
  if (q.type === 'sort') { o.pool = shuffle(q.items.map((_, k) => k)); o.put = {}; o.sel = o.pool[0]; }
  return o;
}

const dateQ = ix => ({
  type: 'order',
  q: 'رتّب هذه الأحداث من «مفتاح التواريخ» من الأقدم إلى الأحدث',
  items: ix.map(i => KEYS[i].e),
  explain: ix.map(i => `**${KEYS[i].d}**: ${KEYS[i].e}`).join('، ثم ')
});

function settle(ok) {
  const v = view, q = cur();
  if (q.st.done) return;
  clearInterval(tick);
  q.st.done = true; q.st.ok = ok; q.st.fx = true;
  if (ok) {
    v.combo++; v.best = Math.max(v.best, v.combo);
    const base = q.type === 'who' ? 150 - 40 * (q.shown - 1) : ['order', 'match', 'sort'].includes(q.type) ? 120 : 100;
    q.st.pts = Math.round(base * (1 + .25 * Math.min(v.combo - 1, 4))) + (v.boss ? Math.round(50 * (q.st.left ?? 0)) : 0);
    v.xp += q.st.pts;
    if (v.boss) v.hp--;
    q.st.msg = pickOne(YAY);
    sfx.ok();
  } else {
    v.combo = 0; v.lives--; v.wrong.push(v.i);
    q.st.msg = q.st.timeout ? 'انتهى الوقت!' : pickOne(NAY);
    sfx.bad();
  }
  render();
}

function armTimer() {
  const v = view;
  if (v.name !== 'quiz' || !v.boss) return;
  const q = cur();
  if (q.st.done) return;
  const lim = { order: 55, match: 55, sort: 55, who: 40 }[q.type] || 30;
  if (!q.st.t0) q.st.t0 = Date.now();
  const step = () => {
    const left = 1 - (Date.now() - q.st.t0) / 1000 / lim;
    document.getElementById('tbar')?.style.setProperty('--p', Math.max(0, left));
    if (left <= 0) { q.st.left = 0; q.st.timeout = true; settle(false); } else q.st.left = left;
  };
  step();
  if (!q.st.done) tick = setInterval(step, 250);
}

function finish() {
  const v = view, stars = Math.max(1, 3 - v.wrong.length);
  let nextSid = null, newKeys = [], record = false;
  if (v.boss) {
    record = store.boss > 0 && v.xp > store.boss;
    if (!store.boss) newKeys = KEYS.map((k, i) => k.sid === 'boss' ? i : -1).filter(i => i >= 0);
    store.boss = Math.max(store.boss, v.xp, 1);
  } else {
    const old = store.sec[v.sid] || { stars: 0, xp: 0 };
    record = !!old.stars && v.xp > old.xp;
    store.sec[v.sid] = { stars: Math.max(old.stars, stars), xp: Math.max(old.xp, v.xp) };
    if (!old.stars) newKeys = KEYS.map((k, i) => k.sid === v.sid ? i : -1).filter(i => i >= 0);
    const { l, si } = SEC[v.sid];
    nextSid = l.sections[si + 1]?.id || null;
  }
  save();
  view = { name: 'result', sid: v.sid, boss: v.boss, stars, xp: v.xp, best: v.best, total: v.qs.length, wrongQs: v.wrong.map(i => v.qs[i]), nextSid, newKeys, record };
  render(true);
  sfx.win();
  if (stars === 3) confetti();
}

function mtap(side, idx) {
  const q = cur();
  if (q.st.done) return;
  const holder = side === 'l' ? (q.link[idx] != null ? idx : null) : Object.keys(q.link).map(Number).find(i => q.link[i] === idx) ?? null;
  if (q.sel && q.sel.s !== side) {
    const li = side === 'l' ? idx : q.sel.i, rj = side === 'l' ? q.sel.i : idx;
    delete q.link[li];
    Object.keys(q.link).forEach(i => { if (q.link[i] === rj) delete q.link[i]; });
    q.link[li] = rj; q.sel = null; sfx.tap();
  } else if (q.sel && q.sel.i === idx) {
    q.sel = null;
  } else {
    if (holder != null) delete q.link[holder];
    q.sel = { s: side, i: idx };
  }
  render();
}

const A = {
  home: () => go({ name: 'home' }),
  lesson: li => go({ name: 'lesson', li: +li }),
  learn: sid => go({ name: 'learn', sid, ci: 0 }),
  deck: li => go({ name: 'deck', li: +li }),
  cnext: () => { if (view.ci < SEC[view.sid].s.cards.length - 1) { view.ci++; render(); } },
  cprev: () => { if (view.ci > 0) { view.ci--; render(); } },
  locked: () => toast('أكمل القسم السابق أولًا لفتح هذا القسم'),
  bosslock: () => toast('أكمل كل أقسام الدروس الأربعة لفتح التحدي الختامي'),
  quiz: sid => go({ name: 'quiz', sid, qs: shuffle(SEC[sid].s.quiz).map(prep), i: 0, lives: 3, xp: 0, combo: 0, best: 0, wrong: [] }),
  boss: () => {
    const pools = L.map(l => shuffle(l.sections.flatMap(s => s.quiz.filter(q => ['mcq', 'tf', 'fill', 'who'].includes(q.type)))));
    const picked = pools.flatMap(p => p.splice(0, 3));
    const qs = shuffle(picked.concat(shuffle(pools.flat()).slice(0, 1))).map(prep);
    const ix = shuffle(KEYS.map((_, i) => i));
    qs.splice(4, 0, prep(dateQ(ix.slice(0, 4).sort((a, b) => a - b))));
    qs.splice(10, 0, prep(dateQ(ix.slice(4, 8).sort((a, b) => a - b))));
    go({ name: 'quiz', boss: true, sid: 'boss', qs, i: 0, lives: 3, xp: 0, combo: 0, best: 0, wrong: [], hp: qs.length });
  },
  pick: k => { const q = cur(); if (q.st.done) return; q.st.pick = +k; settle(+k === q.answer); },
  tf: x => { const q = cur(); if (q.st.done) return; q.st.pick = x === '1'; settle((x === '1') === q.answer); },
  clue: () => { const q = cur(); if (q.shown < q.clues.length) { q.shown++; sfx.tap(); render(); } },
  place: k => { const q = cur(); if (!q.seq.includes(+k)) { q.seq.push(+k); sfx.tap(); render(); } },
  unplace: p => { cur().seq.splice(+p, 1); render(); },
  ml: i => mtap('l', +i),
  mr: j => mtap('r', +j),
  ssel: k => {
    const q = cur(); k = +k;
    if (q.put[k] != null) { delete q.put[k]; q.sel = k; } else q.sel = q.sel === k ? null : k;
    render();
  },
  drop: b => {
    const q = cur();
    if (q.sel == null) return;
    q.put[q.sel] = +b;
    q.sel = q.pool.find(k => q.put[k] == null) ?? null;
    sfx.tap(); render();
  },
  check: () => {
    const q = cur();
    settle(q.type === 'order' ? q.seq.every((k, p) => k === p) : q.type === 'match' ? q.pairs.every((_, i) => q.link[i] === i) : q.items.every((it, k) => q.put[k] === it[1]));
  },
  next: () => {
    const v = view;
    if (v.lives <= 0) {
      view = { name: 'over', sid: v.sid, boss: v.boss, wrongQs: v.wrong.map(i => v.qs[i]) };
      render(true); sfx.lose(); return;
    }
    if (v.i + 1 >= v.qs.length) return finish();
    v.i++; v.quitAsk = false; render(true);
  },
  quit: () => { view.quitAsk = true; render(); app.querySelector('[data-k="qn"]')?.focus(); },
  quitNo: () => { view.quitAsk = false; render(); },
  quitYes: () => view.boss ? A.home() : A.lesson(SEC[view.sid].li),
  sound: () => { store.sound = !store.sound; save(); render(); },
  reset: () => { view.resetAsk = true; render(); app.querySelector('[data-k="rn"]')?.focus(); },
  resetNo: () => { view.resetAsk = false; render(); },
  resetYes: () => { store = { ...fresh(), sound: store.sound }; save(); go({ name: 'home' }); toast('بدأت رحلة جديدة. بالتوفيق!'); }
};

app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  A[b.dataset.act]?.(b.dataset.arg);
});

let sx = null;
app.addEventListener('pointerdown', e => { sx = e.target.closest('[data-swipe]') ? e.clientX : null; });
app.addEventListener('pointerup', e => {
  if (sx == null || view.name !== 'learn') return;
  const dx = e.clientX - sx; sx = null;
  if (Math.abs(dx) > 60) dx > 0 ? A.cnext() : A.cprev();
});

document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (view.name === 'learn') {
    if (e.key === 'ArrowLeft') A.cnext();
    else if (e.key === 'ArrowRight') A.cprev();
  } else if (view.name === 'quiz' && !view.quitAsk && /^[1-4]$/.test(e.key)) {
    const q = cur(), i = +e.key - 1;
    if (q.st.done) return;
    if (q.type === 'tf') { if (i < 2) A.tf(i === 0 ? '1' : '0'); }
    else if (q.perm && q.perm[i] != null) A.pick(q.perm[i]);
  }
});

function start(data) {
  const v = data && data.view;
  if (v && V[v.name] && (!v.sid || v.sid === 'boss' || SEC[v.sid]) && (v.li == null || L[v.li])) view = v;
  render(true);
}
window.claude?.hot?.snapshot?.(() => ({ view }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
