لقاهرة خلال العصر المملوكي قوة الدولة واستقرارها.","answer":true,"explain":"ازدهار المساجد والمدارس والأسواق والقصور، واجتماع **السلطات السياسية والاقتصادية والثقافية** في القاهرة، أسهما في **تنشيط الاقتصاد ودعم الاستقرار الحضاري**."},{"type":"tf","q":"أسس الفاطميون مدينة الفسطاط لتكون عاصمة لدولتهم.","answer":false,"explain":"الصواب: أسس الفاطميون **القاهرة** عاصمة لدولتهم، أما **الفسطاط** فأسسها **عمرو بن العاص**."},{"type":"sort","q":"صنّف ما يلي إلى ملامح عمران المدن الإسلامية وآثار تأسيس الفسطاط والقطائع","buckets":["ملامح العمران","آثار تأسيس العواصم"],"items":[["وجود مسجد وسط المدينة",0],["بناء قلاع وحصون",0],["إنشاء أسواق وخانات",0],["تنظيم الإدارة والحكم",1],["دمج السكان المحليين مع العرب",1],["تشكيل مجتمع حضري جديد",1]],"explain":"**ملامح العمران** هي ما يُبنى في المدينة من مسجد ومساكن للجند وأسواق ومؤسسات علمية وقلاع، أما **الآثار** فهي ما نتج عن تأسيس العواصم من تنظيم للحكم ودمج للسكان ومجتمع حضري جديد."},{"type":"fill","q":"يقول المقريزي: «كانت القاهرة مَجمَع التجار و____ والناس من سائر الأقطار».","options":["الجنود","الأمراء","الفلاحين","العلماء"],"answer":3,"explain":"يكشف قول **المقريزي** أن القاهرة كانت **مَجمَع التجار والعلماء** من كل البلاد، أي مركزًا للتجارة والعلم معًا."},{"type":"who","q":"ما أنا؟","clues":["مدينة صرت نموذجًا للمدينة الإسلامية الكبرى","اجتمعت فيّ السلطات السياسية والاقتصادية والثقافية، وازدهرت في العصر المملوكي","أسسني الفاطميون عاصمة لدولتهم"],"options":["الفسطاط","القطائع","القاهرة","الإسكندرية"],"answer":2,"explain":"هي **القاهرة** التي أسسها **الفاطميون**، وازدهرت في **العصر المملوكي** حتى صارت نموذجًا للمدينة الإسلامية الكبرى."},{"type":"mcq","q":"كيف يمكن اعتبار العمارة المدنية مؤشرًا على تطور المجتمع الحضري؟","options":["لأنها تقتصر على القصور فتعكس ثراء الحكام وحدهم","لأن تنوع المنشآت يعكس نشاط الحياة الاقتصادية والاجتماعية والثقافية","لأن كثرة المباني تدل على ضعف السلطة المركزية","لأنها تعكس الطابع العسكري للمدن دون غيره"],"answer":1,"explain":"تنوع منشآت القاهرة من مساجد ومدارس وأسواق وخانات وقصور ومبانٍ حكومية أدى إلى **تنشيط الحياة الاقتصادية والاجتماعية والثقافية**، فصار العمران مرآة لتطور المجتمع الحضري."}]},{"id":"l3s5","title":"التحول الاقتصادي في مصر خلال العصر الوسيط","pages":"36-37","intro":"أرضٌ تُنبت، وأيدٍ تصنع، وأسواق تنبض بالحركة... تعرّف على محركات ثروة مصر.","cards":[{"kind":"concept","title":"الزراعة: أساس الاقتصاد","body":"تطورت **الحياة الاقتصادية** في مصر بشكل ملحوظ خلال الدولة الإسلامية من خلال **الزراعة** و**الصناعات التقليدية** و**التجارة**. وكانت الزراعة **أساس الاقتصاد**؛ إذ لعبت دورًا مهمًّا في **استقرار الدولة اقتصاديًّا وسياسيًّا**، لأنها **وفّرت الموارد اللازمة لتمويل الإدارة والجيش**، فشكّلت **الركيزة الأساسية للاقتصاد المصري**."},{"kind":"cause","title":"سر قوة الزراعة المصرية","body":"قامت قوة الزراعة على **تنظيم حركة الري**، مثل **إنشاء مقياس النيل**، و**استخدام القنوات والسواقي والمصارف**؛ ما ساعد على **زيادة الإنتاج الزراعي**. كما تميزت **بتنوع المحاصيل** مثل **القمح والشعير والكتان والقطن**، مما أسهم في **دعم الأمن الغذائي** و**توفير فائض للتجارة والتصدير**.","points":["تنظيم الري: مقياس النيل","القنوات والسواقي والمصارف","تنوع المحاصيل"]},{"kind":"fact","title":"الصناعات التقليدية","body":"شهدت مصر **ازدهارًا في الصناعات التقليدية** التي شكّلت **جزءًا مهمًّا من الاقتصاد**، ومن أبرزها: **صناعة النسيج** لإنتاج الملابس والأقمشة **من الكتان**، و**صناعة السكر** اعتمادًا على **زراعة قصب السكر**، و**صناعة الزجاج** لإنتاج **الأواني والزخارف الزجاجية**.","points":["النسيج: ملابس وأقمشة من الكتان","السكر: من قصب السكر","الزجاج: أوانٍ وزخارف زجاجية"]},{"kind":"result","title":"أثر الصناعات التقليدية","body":"ساعدت الصناعات التقليدية على **دعم التجارة الداخلية والخارجية**، و**توفير فرص عمل**، و**تعزيز النشاط الاقتصادي في المدن**. ويُلاحظ ارتباطها الوثيق بالزراعة؛ فصناعة النسيج تعتمد على **الكتان**، وصناعة السكر تعتمد على **قصب السكر**، فتكاملت الزراعة والصناعة والتجارة."},{"kind":"cause","title":"القاهرة مركز تجاري عالمي","body":"مع تطور المدن الإسلامية، خاصةً **القاهرة**، أصبحت مصر **مركزًا تجاريًّا مهمًّا يربط بين الشرق والغرب**، ويرجع ذلك إلى **موقع مصر على طرق التجارة بين آسيا وإفريقيا وأوروبا**، و**وجود موانٍ نهرية وبحرية مهمة**، و**ازدهار الأسواق التجارية** التي جذبت التجار من مختلف البلاد."},{"kind":"result","title":"ثمار التجارة","body":"أسهم **النشاط التجاري** في **تنشيط الاقتصاد**، و**تمويل الدولة**، و**تعزيز مكانة مصر في العالم الإسلامي**. وهكذا تكاملت حلقات الاقتصاد المصري: **زراعة** توفّر فائضًا للتجارة والتصدير، و**صناعات تقليدية** تدعم التجارة الداخلية والخارجية، و**تجارة** تربط الشرق بالغرب."},{"kind":"quote","title":"المقريزي وأسواق القاهرة","body":"يقول **المقريزي**: «إن **حركة الأسواق في القاهرة اعتمدت على تداول الذهب والفضة بين التجار**». ويكشف النص عن **نشاط تجاري واسع** في أسواق القاهرة قائم على التعامل **بالذهب والفضة**، ويدعونا الكتاب إلى **الربط بين ازدهار التجارة ونمو المدن الإسلامية** في مصر."}],"quiz":[{"type":"mcq","q":"لماذا عُدّت الزراعة أساس الاقتصاد في مصر الإسلامية؟","options":["لأنها اعتمدت على المعونات الخارجية","لأنها حلّت محل التجارة بين الشرق والغرب","لأنها وفّرت الموارد اللازمة لتمويل الإدارة والجيش","لأنها ارتبطت بتداول الذهب والفضة بين التجار"],"answer":2,"explain":"لعبت الزراعة دورًا مهمًّا في **استقرار الدولة اقتصاديًّا وسياسيًّا** لأنها **وفّرت الموارد اللازمة لتمويل الإدارة والجيش**."},{"type":"sort","q":"صنّف ما يلي إلى عوامل ازدهار الزراعة وعوامل ازدهار التجارة","buckets":["الزراعة","التجارة"],"items":[["إنشاء مقياس النيل",0],["القنوات والسواقي والمصارف",0],["تنوع المحاصيل",0],["الموقع بين آسيا وإفريقيا وأوروبا",1],["موانٍ نهرية وبحرية مهمة",1],["أسواق جذبت التجار من مختلف البلاد",1]],"explain":"ازدهرت **الزراعة** بتنظيم الري وتنوع المحاصيل، وازدهرت **التجارة** بفضل **الموقع** و**الموانئ** و**الأسواق** التي جذبت التجار."},{"type":"match","q":"صِل كل صناعة تقليدية بما اعتمدت عليه أو أنتجته","pairs":[["صناعة النسيج","ملابس وأقمشة من الكتان"],["صناعة السكر","زراعة قصب السكر"],["صناعة الزجاج","الأواني والزخارف الزجاجية"]],"explain":"اعتمد **النسيج** على الكتان، و**السكر** على قصب السكر، وأنتجت **صناعة الزجاج** الأواني والزخارف؛ وهي صناعات دعمت التجارة الداخلية والخارجية."},{"type":"tf","q":"أسهم تنوع المحاصيل مثل القمح والشعير والكتان والقطن في دعم الأمن الغذائي وتوفير فائض للتجارة والتصدير.","answer":true,"explain":"يذكر الكتاب أن **تنوع المحاصيل** دعم **الأمن الغذائي** ووفّر **فائضًا للتجارة والتصدير**."},{"type":"tf","q":"اقتصر أثر الصناعات التقليدية على تلبية حاجات السكان دون أثر في التجارة أو فرص العمل.","answer":false,"explain":"الصواب: ساعدت الصناعات التقليدية على **دعم التجارة الداخلية والخارجية** و**توفير فرص عمل** و**تعزيز النشاط الاقتصادي في المدن**."},{"type":"mcq","q":"ازدهرت التجارة في مصر خلال العصر الوسيط بسبب:","options":["موقعها الجغرافي وكثرة مواردها","انعزالها السياسي عن الصراعات","كثرة حروبها العسكرية خارجيًّا","اعتمادها على المعونات الخارجية"],"answer":0,"explain":"**موقع مصر** على طرق التجارة بين آسيا وإفريقيا وأوروبا، و**وفرة مواردها** الزراعية والصناعية، جعلاها مركزًا تجاريًّا يربط الشرق بالغرب."},{"type":"fill","q":"يقول المقريزي: «إن حركة الأسواق في القاهرة اعتمدت على تداول ____ بين التجار».","options":["القمح والشعير","الكتان والقطن","الذهب والفضة","السكر والزجاج"],"answer":2,"explain":"يكشف قول **المقريزي** أن أسواق القاهرة قامت على **تداول الذهب والفضة**، ما يدل على نشاط تجاري واسع."},{"type":"who","q":"ما أنا؟","clues":["منشأة ارتبطت بالزراعة أساس الاقتصاد المصري","يذكرني الكتاب مثالًا على تنظيم حركة الري","اسمي مكوَّن من كلمتين: أداة للقياس، واسم نهر مصر"],"options":["السواقي","مقياس النيل","المصارف","الخانات"],"answer":1,"explain":"**مقياس النيل** مثال يذكره الكتاب على **تنظيم حركة الري**، وهو من أسباب ازدهار الزراعة أساس الاقتصاد المصري."},{"type":"mcq","q":"اربط السبب بالنتيجة: كيف أسهمت الصناعات التقليدية في ازدهار التجارة في مصر؟","options":["جعلت مصر تعتمد على استيراد الملابس والأواني","حلّت محل الزراعة فقلّ الإنتاج الزراعي","حصرت النشاط الاقتصادي في الريف بعيدًا عن المدن","وفّرت منتجات كالمنسوجات والسكر والزجاج دعمت التجارة الداخلية والخارجية"],"answer":3,"explain":"أنتجت الصناعات التقليدية سلعًا من **النسيج والسكر والزجاج**، فدعمت **التجارة الداخلية والخارجية** ووفّرت فرص عمل ونشّطت اقتصاد المدن."}]},{"id":"l3s6","title":"مكانة مصر الإقليمية والدولية في العصر الوسيط","pages":"38-39","intro":"حين اهتزّ المشرق وسقطت عاصمة الخلافة، اتجهت الأنظار إلى القاهرة... فماذا فعلت مصر؟","cards":[{"kind":"result","title":"مصر دولة محورية فاعلة","body":"نتيجة التحولات السابقة تطورت **مكانة مصر كدولة محورية فاعلة** في العالم الإسلامي، فأصبحت **قاعدة عسكرية مهمة لحماية حدود الدولة**، و**مركزًا للإمدادات الاقتصادية والغذائية**، و**حلقة وصل بين طرق التجارة في البحر المتوسط والبحر الأحمر**."},{"kind":"result","title":"القاهرة تنافس بغداد","body":"وبذلك أصبحت مصر **مركزًا سياسيًّا وثقافيًّا مهمًّا**؛ إذ **أُنشئت مؤسسات علمية**، و**تطورت الإدارة السياسية والعسكرية**، و**ازدهرت التجارة والعمران**. وهكذا تحولت **القاهرة** إلى **عاصمة تُنافِس بغداد في النفوذ السياسي والثقافي**. ويسأل الكتاب: إلى أي مدى نجحت القاهرة في منافسة بغداد في قيادة العالم الإسلامي؟"},{"kind":"date","title":"سقوط بغداد وصعود مصر","date":"1258م","body":"بعد **سقوط بغداد على يد المغول (التتار) عام 1258م**، برزت مصر في **العصر المملوكي** كقوة جديدة **تقود العالم الإسلامي**؛ إذ **استقبلت العلماء والفقهاء الفارين من المشرق**، و**أعادت إحياء الخلافة العباسية رمزيًّا في القاهرة**، وأصبحت **مركزًا سياسيًّا وعسكريًّا لحماية العالم الإسلامي**."},{"kind":"fact","title":"معركة عين جالوت","body":"أدت مصر **دورها التاريخي في إنقاذ العالم الإسلامي من خطر المغول والصليبيين**؛ فمعركة **عين جالوت** لم تكن مجرد معركة عسكرية، بل كانت **حدثًا تاريخيًّا** ساعد على ثلاثة أمور:","points":["وقف التوسع المغولي في العالم الإسلامي","تعزيز مكانة مصر كقوة عسكرية كبرى","حماية المراكز الحضارية في المنطقة"]},{"kind":"place","title":"خريطة معركة عين جالوت","body":"تُبيِّن خريطة **معركة عين جالوت** زحف **جيش المغول** من الشمال من جهة **بعلبك** نحو الجنوب، وتقدُّم **جيش المماليك** من جهة **غزة** شمالًا بمحاذاة ساحل **البحر المتوسط** حتى قرب **عكا**، ثم اتجاهه إلى **عين جالوت** حيث التقى الجيشان، وتقع عين جالوت على الخريطة شمال **بيت المقدس**."},{"kind":"concept","title":"خلاصة الدرس: لماذا صعدت مصر؟","body":"يخلص الدرس إلى أن انتقال مصر من **ولاية تابعة** للدولة الإسلامية الكبرى إلى **مركز قيادي مؤثر** في العالم الإسلامي جاء نتيجة **تحولات سياسية واجتماعية واقتصادية وحضارية** متكاملة، لا عامل واحد فقط؛ ومن هنا ارتبطت **القوة العسكرية** لمصر في العصر المملوكي بمكانتها **كحامية للعالم الإسلامي** وللحضارة الإسلامية."}],"quiz":[{"type":"mcq","q":"تغيرت مكانة مصر بعد سقوط بغداد (1258م) على يد التتار من خلال أنها:","options":["تحولت لدولة معزولة","فقدت أهميتها","تحولت لولاية","أصبحت حامية للإسلام"],"answer":3,"explain":"بعد سقوط بغداد برزت مصر المملوكية **قوة تقود العالم الإسلامي**، فصارت **مركزًا سياسيًّا وعسكريًّا لحمايته**."},{"type":"tf","q":"لم تكن معركة عين جالوت مجرد معركة عسكرية، بل حدثًا تاريخيًّا أوقف التوسع المغولي في العالم الإسلامي.","answer":true,"explain":"يصف الكتاب **عين جالوت** بأنها **حدث تاريخي** ساعد على **وقف التوسع المغولي** وتعزيز مكانة مصر وحماية المراكز الحضارية."},{"type":"tf","q":"بعد سقوط بغداد ألغت مصر المملوكية الخلافة العباسية نهائيًّا.","answer":false,"explain":"الصواب: **أعادت مصر إحياء الخلافة العباسية رمزيًّا في القاهرة**، واستقبلت العلماء والفقهاء الفارين من المشرق."},{"type":"match","q":"صِل كل سبب بنتيجته","pairs":[["سقوط بغداد على يد المغول","قيادة مصر المملوكية للعالم الإسلامي"],["معركة عين جالوت","وقف التوسع المغولي"],["موقع مصر بين المتوسط والأحمر","حلقة وصل بين طرق التجارة"],["إنشاء المؤسسات العلمية وازدهار العمران","منافسة القاهرة لبغداد في النفوذ"]],"explain":"تضافرت **الظروف السياسية** و**الانتصار العسكري** و**الموقع** و**التطور العلمي والعمراني** في رفع مكانة مصر الإقليمية والدولية."},{"type":"sort","q":"صنّف ما يلي إلى مظاهر قيادة مصر بعد سقوط بغداد ونتائج معركة عين جالوت","buckets":["بعد سقوط بغداد","نتائج عين جالوت"],"items":[["استقبال العلماء والفقهاء الفارين من المشرق",0],["إحياء الخلافة العباسية رمزيًّا في القاهرة",0],["مركز سياسي وعسكري لحماية العالم الإسلامي",0],["وقف التوسع المغولي",1],["تعزيز مكانة مصر كقوة عسكرية كبرى",1],["حماية المراكز الحضارية في المنطقة",1]],"explain":"بعد **سقوط بغداد (1258م)** قادت مصر العالم الإسلامي باستقبال العلماء وإحياء الخلافة، ثم جاءت **عين جالوت** لتوقف المغول وتعزز مكانة مصر العسكرية."},{"type":"fill","q":"تحولت القاهرة إلى عاصمة تُنافِس ____ في النفوذ السياسي والثقافي.","options":["دمشق","الإسكندرية","بغداد","القسطنطينية"],"answer":2,"explain":"بإنشاء المؤسسات العلمية وتطور الإدارة وازدهار التجارة والعمران صارت **القاهرة** عاصمة تُنافِس **بغداد** في النفوذ السياسي والثقافي."},{"type":"who","q":"ما أنا؟","clues":["حدث تاريخي لم يكن مجرد مواجهة عسكرية عابرة","التقى فيه جيش المماليك القادم من غزة بجيش المغول القادم من الشمال","أوقف التوسع المغولي في العالم الإسلامي وعزز مكانة مصر كقوة عسكرية كبرى"],"options":["معركة عين جالوت","سقوط بغداد","الحملات الصليبية","فتح حصن بابليون"],"answer":0,"explain":"هي **معركة عين جالوت** التي أدت فيها مصر **دورها التاريخي** في إنقاذ العالم الإسلامي من خطر المغول."},{"type":"mcq","q":"«القوة العسكرية هي السبب الرئيس في صعود مكانة مصر في العصر الوسيط». أي رأي يتفق أكثر مع ما عرضه الدرس؟","options":["القوة العسكرية هي السبب الوحيد ولا أثر للاقتصاد أو الثقافة","القوة العسكرية عامل مهم ضمن تحولات سياسية واجتماعية واقتصادية وحضارية متكاملة","الثقافة وحدها صنعت مكانة مصر دون حاجة إلى جيش","مكانة مصر نتجت فقط عن ضعف الخلافة العباسية"],"answer":1,"explain":"يؤكد الدرس أن صعود مصر جاء من **تحولات سياسية واجتماعية واقتصادية وحضارية**؛ فالجيش نفسه موّلته **الزراعة والتجارة**، وأسهمت **المؤسسات العلمية** في مكانتها."},{"type":"order","q":"رتّب الأحداث التالية من الأقدم إلى الأحدث","items":["تأسيس الفاطميين للقاهرة","سقوط بغداد على يد المغول","إحياء الخلافة العباسية رمزيًّا في القاهرة","ضم الدولة العثمانية لمصر"],"explain":"أسس **الفاطميون** القاهرة أولًا، ثم سقطت **بغداد عام 1258م** فأحيت مصر المملوكية **الخلافة العباسية** رمزيًّا في القاهرة، وأخيرًا ضمها **العثمانيون عام 1517م**."}]}],"glossary":[{"term":"التحول التاريخي","def":"عملية التغيير الجذري والتدريجي في بنية المجتمعات وأنظمتها السياسية والاقتصادية، وبالتالي الانتقال من مرحلة تاريخية إلى مرحلة تاريخية أخرى مختلفة تمامًا."},{"term":"التعريب","def":"انتشار اللغة العربية في مصر تدريجيًّا بعد الفتح الإسلامي حتى صارت لغة الإدارة ثم لغة العلم والثقافة؛ ولم يكن مجرد تغيير لغوي، بل ربط مصر بالعالم الإسلامي وأسهم في تشكيل هويتها الثقافية."},{"term":"تعريب الدواوين","def":"من إصلاحات الدولة الأموية، وبه أصبحت اللغة العربية لغة الإدارة في مصر."},{"term":"الدول المستقلة في مصر","def":"دول مثل الطولونية والإخشيدية، ظهرت بسبب ضعف السلطة المركزية للخلافة العباسية، وكانت بداية الاستقلال السياسي لمصر."},{"term":"درة التاج العثماني","def":"لقب أطلقته الدولة العثمانية على مصر بعد ضمها عام 1517م؛ لمكانتها الاقتصادية والإستراتيجية."},{"term":"حلقة وصل","def":"وصف لدور العلماء والفقهاء الذين تولوا القضاء والتعليم وتنظيم الشئون الدينية، فربطوا بين الإدارة السياسية في مصر والشعب."},{"term":"الأزهر الشريف","def":"مؤسسة دينية وتعليمية لم يقتصر دورها على الصلاة، بل كانت مركزًا لتدريس الفقه واللغة والعلوم الشرعية، وأسهمت في إعداد العلماء والقضاة."},{"term":"حركة الترجمة","def":"حركة نقلت علوم الحضارات القديمة (اليونانية والفارسية والهندية) إلى الثقافة العربية، فأسهمت في تطوير الفكر العلمي والفلسفي."},{"term":"مقياس النيل","def":"منشأة يذكرها الكتاب مثالًا على تنظيم حركة الري، وهو من أسباب ازدهار الزراعة أساس الاقتصاد المصري."},{"term":"احترام التعددية الثقافية","def":"من الأمور الحتمية في عالم اليوم؛ وذلك للحفاظ على مكونات الدولة وتركيبها الديموغرافي."},{"term":"الإرث الحضاري والمادي","def":"يمثل ذاكرة الأمة التاريخية؛ لذلك من الضروري الحفاظ عليه."}],"keyDates":[{"date":"641م","event":"الفتح الإسلامي لمصر؛ خرجت من إطار الإمبراطورية الرومانية البيزنطية وصارت ولاية في الدولة الإسلامية."},{"date":"1258م","event":"سقوط بغداد على يد المغول (التتار)، وبروز مصر في العصر المملوكي قوة تقود العالم الإسلامي."},{"date":"845 هـ","event":"وفاة المؤرخ المقريزي «إمام المؤرخين»."},{"date":"1517م","event":"ضم الدولة العثمانية لمصر، وإطلاق لقب «درة التاج العثماني» عليها."},{"date":"930 هـ","event":"وفاة المؤرخ ابن إياس، الشاهد على أواخر الدولة المملوكية."}],"keyPeople":[{"name":"عمرو بن العاص","role":"أسس مدينة الفسطاط لتكون مركزًا للحكم والإدارة."},{"name":"أحمد بن طولون","role":"أنشأ مدينة القطائع مع صعود الدولة الطولونية لتكون مقرًّا للحكم ومركزًا سياسيًّا."},{"name":"ابن خلدون","role":"صاحب كتاب «المقدمة»؛ رأى أن لغات أهل الأمصار تكون بلسان الأمة الغالبة عليها."},{"name":"المقريزي","role":"مؤرخ (ت 845 هـ) لُقّب بـ«إمام المؤرخين»، صاحب «المواعظ والاعتبار بذكر الخطط والآثار»، كتب عن تاريخ مصر والدولة الإسلامية والحياة الاجتماعية والاقتصادية."},{"name":"ابن إياس","role":"مؤرخ (ت 930 هـ) شاهد على أواخر الدولة المملوكية، وكتابه مصدر أساسي لتاريخها في مصر."},{"name":"الفاطميون","role":"أسسوا القاهرة عاصمة لدولتهم، وحين صارت عاصمة لخلافتهم بلغت مكانة مصر السياسية ذروتها."},{"name":"المماليك","role":"في عصرهم قادت مصر العالم الإسلامي بعد سقوط بغداد، وانتصرت في عين جالوت، وأعادت إحياء الخلافة العباسية رمزيًّا في القاهرة."}],"bookExercises":[{"q":"(أقرأ وأتوقع) إلى أي مدى تتفق أو تختلف مع العبارة: «يُعَد العصران الأيوبي والمملوكي ذروة الدور السياسي لمصر في العالم الإسلامي»؟ برِّر إجابتك بالأدلة التاريخية.","a":"أتفق إلى حد كبير: ففي عهد الأيوبيين والمماليك صارت مصر مركزًا للحكم في المنطقة، وواجهت الحملات الصليبية وتصدت لخطر المغول، وبعد سقوط بغداد (1258م) استقبلت العلماء الفارين وأعادت إحياء الخلافة العباسية رمزيًّا في القاهرة، وأوقفت التوسع المغولي في عين جالوت. لكن الكتاب يذكر أن مكانة مصر السياسية بلغت ذروتها أولًا حين أصبحت القاهرة عاصمة للخلافة الفاطمية، ثم استمرت في العصرين الأيوبي والمملوكي."},{"q":"كيف أصبحت مصر قوة إقليمية فاعلة في المنطقة؟ وما مقومات نجاحها في ذلك؟","a":"بدأت مصر تستقل سياسيًّا بظهور الدولتين الطولونية والإخشيدية بعد ضعف الخلافة العباسية، ثم صارت القاهرة عاصمة للخلافة الفاطمية ومركزًا لصنع القرار، واستمرت مكانتها مع الأيوبيين والمماليك. ومن مقومات نجاحها: موقعها على طرق التجارة بين آسيا وإفريقيا وأوروبا، وقوة اقتصادها الزراعي والصناعي والتجاري الذي موّل الإدارة والجيش، ومؤسساتها العلمية كالأزهر، وقوتها العسكرية في مواجهة الصليبيين والمغول."},{"q":"(أقرأ وأجب) لماذا اتجهت الدولة العثمانية لضم مصر؟","a":"لأنها أدركت أهمية مصر ومكانتها الاقتصادية والإستراتيجية، فضمتها إلى حكمها عام 1517م وأطلقت عليها «درة التاج العثماني»."},{"q":"(أقرأ وأجب) في ضوء ما سبق، حدِّد ثلاث فترات تاريخية مرت بها مصر الإسلامية، ثم ضع عنوانًا مناسبًا لكل مرحلة، وحدِّد أهم حدث يميز كل مرحلة.","a":"1) «مصر ولاية تابعة»: من الفتح الإسلامي حتى العصر العباسي الأول، وأهم أحداثها الفتح الإسلامي عام 641م. 2) «بداية الاستقلال السياسي»: وأهم أحداثها ظهور الدولتين الطولونية والإخشيدية بعد ضعف الخلافة العباسية. 3) «مصر مركز لقيادة العالم الإسلامي»: من الفاطميين حتى المماليك، وأهم أحداثها أن صارت القاهرة عاصمة للخلافة الفاطمية، ثم مواجهة الصليبيين والمغول. ويمكن إضافة مرحلة «الولاية العثمانية» منذ 1517م."},{"q":"كيف تحولت مصر خلال القرون الأولى بعد الفتح الإسلامي من مجتمع متعدد اللغات والثقافات إلى مجتمع يغلب عليه الطابع العربي الإسلامي؟","a":"عن طريق عاملين: تعريب اللغة ونشرها، إذ انتشرت العربية تدريجيًّا مع إصلاحات الدولة الأموية وتعريب الدواوين فصارت لغة الإدارة ثم لغة العلم والثقافة؛ والهجرات العربية، إذ استقرت القبائل العربية في الفسطاط وبعض مناطق الدلتا والصعيد وامتزجت بالسكان المحليين، فانتشرت اللغة العربية والعادات الإسلامية."},{"q":"(أقرأ وأفكر) دلِّل على أهمية انتشار اللغة العربية في المجتمع المصري.","a":"أصبحت العربية لغة الإدارة بعد تعريب الدواوين، ثم لغة العلم والثقافة مع ازدهار المراكز العلمية في الفسطاط ثم القاهرة؛ ولم يكن التعريب مجرد تغيير لغوي، بل ربط مصر بالعالم الإسلامي وأسهم في تشكيل الهوية الثقافية للمجتمع المصري."},{"q":"(أقرأ وأجب – نص ابن خلدون) وضِّح كيف تؤثر السيطرة السياسية على تغير لغة الشعوب.","a":"يرى ابن خلدون أن لغات أهل البلاد تكون بلسان الأمة أو الجيل الغالب عليها؛ فحين تسيطر أمة سياسيًّا تصبح لغتها لغة الحكم والإدارة، فيتعلمها الناس تدريجيًّا حتى يهجروا لغاتهم ويصير لسانها لسانهم، كما صارت لغات الأمصار الإسلامية بالمشرق والمغرب عربية."},{"q":"(أقرأ وأجب – نص ابن خلدون) طبِّق النص على أوضاع مصر تحت الحكم الإسلامي، مع إعطاء أمثلة.","a":"بعد الفتح الإسلامي صار العرب هم الجيل الغالب، فانتشرت العربية في مصر تدريجيًّا: تعريب الدواوين في عهد الدولة الأموية جعلها لغة الإدارة، واستقرار القبائل العربية في الفسطاط والدلتا والصعيد وامتزاجها بالسكان نشر العربية والعادات الإسلامية، ثم صارت لغة العلم والثقافة مع ازدهار مراكز الفسطاط والقاهرة."},{"q":"(أقرأ وأناقش) «لم يكن تأثير العلماء والفقهاء في المجتمع المصري تأثيرًا دينيًّا فقط، بل كان تأثيرًا فكريًّا واجتماعيًّا أيضًا». ناقِش هذه العبارة.","a":"العبارة صحيحة: فإلى جانب تنظيم الشئون الدينية تولى العلماء القضاء والتعليم، وكانوا حلقة وصل بين الإدارة السياسية والشعب، وضمنوا استقرار المجتمع وفق مبادئ الشريعة (تأثير اجتماعي)، ونشروا التعليم وبنوا قاعدة علمية أظهرت مراكز علمية في الفسطاط والقاهرة، فأسهموا في تحويل مصر إلى مركز علمي وثقافي (تأثير فكري)."},{"q":"(أقرأ وأناقش) استنتِج: كيف أسهمت المراكز العلمية في القاهرة والفسطاط في نقل العلوم بين الحضارات؟","a":"ربطت المؤسسات العلمية مصر بالمراكز الثقافية في العالم الإسلامي وجعلتها مركزًا لتبادل العلوم والمعرفة بين العلماء والطلاب، كما ساعدت حركة الترجمة على نقل علوم الحضارات اليونانية والفارسية والهندية إلى الثقافة العربية، فتعزز دور مصر في نشر المعرفة والتفاعل الحضاري مع المناطق المجاورة كافة."},{"q":"(أقرأ وأحلل) إلى أي مدى يمكن اعتبار الأزهر نقطة تحوُّل في تاريخ التعليم في مصر؟","a":"إلى حد كبير؛ فالأزهر لم يقتصر دوره على الصلاة، بل صار مركزًا لتدريس الفقه واللغة والعلوم الشرعية، وأسهم في إعداد العلماء والقضاة، وربط مصر بالمراكز الثقافية في العالم الإسلامي، وجعلها مركزًا لتبادل العلوم بين العلماء والطلاب؛ فتطورت الحياة العلمية في مصر بعد تأسيسه وتأسيس المؤسسات المماثلة."},{"q":"(أقرأ وأحلل) كيف أسهمت حركة الترجمة في ازدهار التأليف العلمي في مصر؟","a":"نقلت حركة الترجمة علوم الحضارات القديمة (اليونانية والفارسية والهندية) إلى الثقافة العربية، فأسهمت في تطوير الفكر العلمي والفلسفي، فازدهر التأليف في مجالات الفقه والفلسفة والطب والتاريخ والعلوم الطبيعية."},{"q":"(أقرأ وأفسر) لماذا فضَّل المسلمون إنشاء عاصمة جديدة بدلًا من مدينة الإسكندرية؟","a":"لأنهم أرادوا مركزًا جديدًا للحكم والإدارة يُختار موقعه وفق اعتبارات عسكرية وإدارية واقتصادية تناسب الدولة الجديدة، وهو ما تحقق في مدينة الفسطاط التي أسسها عمرو بن العاص."},{"q":"(قول المقريزي) «كانت القاهرة مَجمَع التجار والعلماء والناس من سائر الأقطار». ماذا يكشف النص عن مكانة القاهرة؟","a":"يكشف أن القاهرة صارت مركزًا جامعًا للتجارة والعلم يقصده الناس من كل البلاد؛ فقد اجتمعت فيها السلطات السياسية والاقتصادية والثقافية، وجذبت العلماء والتجار والطلاب من مختلف أنحاء العالم الإسلامي، فكانت نموذجًا للمدينة الإسلامية الكبرى."},{"q":"(قول المقريزي) كيف يمكن اعتبار العمارة المدنية مؤشرًا على تطور المجتمع الحضري؟","a":"لأن تنوع المنشآت (المساجد والمدارس، والأسواق والخانات، والقصور والمباني الحكومية) يدل على نشاط الحياة الدينية والعلمية والاقتصادية والإدارية؛ وقد نتج عن التطور العمراني تنشيط الحياة الاقتصادية والاجتماعية والثقافية، وتعزيز التفاعل الاجتماعي، ودعم الاستقرار الحضاري."},{"q":"(أقرأ وأحلل) اربط السبب والنتيجة: كيف أسهمت الصناعات التقليدية في ازدهار التجارة في مصر؟","a":"السبب: ازدهار صناعات النسيج (من الكتان) والسكر (من قصب السكر) والزجاج (الأواني والزخارف). النتيجة: توافرت سلع مصرية دعمت التجارة الداخلية والخارجية، ووفرت فرص عمل، وعززت النشاط الاقتصادي في المدن."},{"q":"(قول المقريزي) «إن حركة الأسواق في القاهرة اعتمدت على تداول الذهب والفضة بين التجار». ما الذي يكشفه النص عن طبيعة الاقتصاد في مصر؟","a":"يكشف أن اقتصاد مصر كان نشطًا يقوم على تجارة واسعة يتعامل فيها التجار بالذهب والفضة في أسواق القاهرة، بما يتفق مع كون القاهرة مركزًا تجاريًّا يربط بين الشرق والغرب."},{"q":"(قول المقريزي) اربط بين ازدهار التجارة ونمو المدن الإسلامية في مصر.","a":"العلاقة متبادلة: فمع تطور المدن الإسلامية، خاصةً القاهرة، أصبحت مصر مركزًا تجاريًّا يربط الشرق بالغرب، وضمت المدن الأسواق والخانات التي جذبت التجار؛ وفي المقابل أسهم النشاط التجاري في تنشيط الاقتصاد وتمويل الدولة، فازدهرت المدن وعمرانها."},{"q":"(أفكر وأتوقع) إلى أي مدى نجحت القاهرة في منافسة بغداد في قيادة العالم الإسلامي؟","a":"نجحت إلى حد كبير: فقد صارت عاصمة للخلافة الفاطمية ومركزًا لصنع القرار السياسي والديني، ثم تحولت إلى عاصمة تنافس بغداد في النفوذ السياسي والثقافي بفضل المؤسسات العلمية وتطور الإدارة وازدهار التجارة والعمران، وبعد سقوط بغداد (1258م) تصدرت القيادة باستقبال العلماء وإحياء الخلافة العباسية رمزيًّا فيها."},{"q":"(أفكر وأحلل) هل كانت معركة عين جالوت نقطة تحوُّل في تاريخ العالم الإسلامي؟ ولماذا؟","a":"نعم؛ لأنها لم تكن مجرد معركة عسكرية، بل حدثًا تاريخيًّا أوقف التوسع المغولي في العالم الإسلامي، وعزز مكانة مصر كقوة عسكرية كبرى، وحمى المراكز الحضارية في المنطقة، فأصبحت مصر مركزًا لحماية العالم الإسلامي."},{"q":"(أفكر وأجيب) كيف أسهمت الظروف السياسية بعد حُكم المماليك في تغير وضع مصر الإقليمي؟","a":"في عصر المماليك سقطت بغداد على يد المغول (1258م) واشتد خطر المغول والصليبيين، فبرزت مصر قوة جديدة تقود العالم الإسلامي: استقبلت العلماء والفقهاء الفارين من المشرق، وأعادت إحياء الخلافة العباسية رمزيًّا في القاهرة، وانتصرت في عين جالوت، فصارت مركزًا سياسيًّا وعسكريًّا لحماية العالم الإسلامي. وبعد انتهاء حكم المماليك ضمتها الدولة العثمانية عام 1517م فصارت ولاية عثمانية لُقّبت بدرة التاج العثماني."},{"q":"(سؤال التفسير المدعوم بالأدلة) حلِّل أهم العوامل التي أثَّرت على إحداث تحولات اجتماعية في مصر بعد الفتح الإسلامي.","a":"1) تعريب اللغة: انتشرت العربية تدريجيًّا مع إصلاحات الدولة الأموية وتعريب الدواوين، فصارت لغة الإدارة ثم العلم والثقافة، وربطت مصر بالعالم الإسلامي وشكلت هويتها الثقافية. 2) الهجرات العربية: استقرت القبائل العربية في الفسطاط والدلتا والصعيد وامتزجت بالسكان، فانتشرت العربية والعادات الإسلامية، وبرزت نخب شاركت في إدارة الأقاليم والحياة العسكرية والسياسية. 3) دور العلماء والفقهاء في التعليم والقضاء وترسيخ الهوية الإسلامية. 4) تأسيس المدن الجديدة كالفسطاط والقطائع التي دمجت السكان المحليين مع العرب وشكلت مجتمعًا حضريًّا جديدًا."},{"q":"(تدريبات الدرس 1) حلِّل كيف تحولت مصر من ولاية تابعة إلى مركز قيادي في العالم الإسلامي.","a":"مرت مصر بمراحل: ولاية تُدار وفق نظام الخلافة بعد الفتح (641م)، ثم بداية الاستقلال بالدولتين الطولونية والإخشيدية مع ضعف الخلافة العباسية، ثم الذروة حين صارت القاهرة عاصمة للخلافة الفاطمية ومركزًا لصنع القرار، واستمرت مع الأيوبيين والمماليك في مواجهة الصليبيين والمغول، وبعد سقوط بغداد قادت العالم الإسلامي. وساندت ذلك تحولات اجتماعية (التعريب والهجرات)، وثقافية (العلماء والأزهر والترجمة)، وعمرانية (الفسطاط والقطائع والقاهرة)، واقتصادية (الزراعة والصناعة والتجارة)."},{"q":"(تدريبات الدرس 2) «القوة العسكرية هي السبب الرئيس في صعود مكانة مصر في العصر الوسيط». ناقِش.","a":"القوة العسكرية سبب مهم، فبها واجهت مصر الحملات الصليبية وأوقفت التوسع المغولي في عين جالوت وصارت قاعدة لحماية حدود الدولة. لكنها ليست السبب الوحيد؛ فالجيش نفسه موّلته الزراعة والتجارة، وأسهمت المؤسسات العلمية كالأزهر والعلماء في جعل مصر مركزًا علميًّا وثقافيًّا، وجعل الموقع والتجارة منها حلقة وصل بين الشرق والغرب؛ فالصعود نتيجة تحولات سياسية واجتماعية واقتصادية وحضارية متكاملة."},{"q":"(تدريبات الدرس 3) فسِّر العلاقة بين: الأزهر والمكانة العلمية.","a":"الأزهر درّس الفقه واللغة والعلوم الشرعية وأعدّ العلماء والقضاة، وربط مصر بالمراكز الثقافية في العالم الإسلامي، وجعلها مركزًا لتبادل العلوم بين العلماء والطلاب؛ فارتفعت مكانة مصر العلمية حتى صارت مركزًا علميًّا وثقافيًّا."},{"q":"(تدريبات الدرس 3) فسِّر العلاقة بين: التجارة والقوة السياسية.","a":"أسهم النشاط التجاري في تنشيط الاقتصاد وتمويل الدولة وتعزيز مكانة مصر في العالم الإسلامي؛ فالموارد التجارية تمول الإدارة والجيش فتقوى الدولة سياسيًّا، كما ساعد ازدهار التجارة والعمران على أن تنافس القاهرة بغداد في النفوذ السياسي."},{"q":"(تدريبات الدرس 3) فسِّر العلاقة بين: الموقع والدور الإقليمي.","a":"وقوع مصر على طرق التجارة بين آسيا وإفريقيا وأوروبا، وبين البحر المتوسط والبحر الأحمر، جعلها مركزًا تجاريًّا يربط الشرق بالغرب، وقاعدة عسكرية مهمة لحماية حدود الدولة، ومركزًا للإمدادات الاقتصادية والغذائية؛ فصار لها دور إقليمي محوري."},{"q":"(تدريبات الدرس 4) ماذا لو لم تسقط بغداد؟","a":"ربما بقيت بغداد مركزًا لقيادة الخلافة العباسية، ولما فرّ العلماء والفقهاء من المشرق إلى مصر، ولما احتاجت مصر إلى إحياء الخلافة العباسية رمزيًّا في القاهرة؛ فكانت القاهرة ستظل منافسًا لبغداد في النفوذ لا قائدًا منفردًا للعالم الإسلامي."},{"q":"(تدريبات الدرس 4) ماذا لو لم تظهر المؤسسات العلمية في مصر؟","a":"لما تطورت الحياة العلمية، ولما وُجد مكان لإعداد العلماء والقضاة، ولضعف ارتباط مصر بالمراكز الثقافية في العالم الإسلامي، ولما أصبحت مركزًا لتبادل العلوم والمعرفة؛ فتتراجع مكانتها الثقافية ولا تستطيع منافسة بغداد."},{"q":"(تدريبات الدرس 5) قارِن بين دور العلماء ودور الحكام في إدارة المجتمع.","a":"العلماء: لم يتولوا الحكم مباشرةً، وأداروا المجتمع بشكل غير مباشر عبر القضاء والتعليم وتنظيم الشئون الدينية، فكانوا حلقة وصل بين الإدارة والشعب وضمنوا الاستقرار وفق مبادئ الشريعة. الحكام: تولوا الحكم والإدارة السياسية والعسكرية مباشرةً، فأسسوا العواصم مراكز للحكم والإدارة (الفسطاط والقطائع والقاهرة)، ونظّموا الإدارة، وتولوا الدفاع عن البلاد في مواجهة الصليبيين والمغول."},{"q":"(تدريبات الدرس 6) «لم يكن ازدهار القاهرة مجرد نمو عمراني، بل تعبير عن قوة الدولة». فسِّر.","a":"لأن ازدهار القاهرة بمساجدها ومدارسها وأسواقها وخاناتها وقصورها ومبانيها الحكومية عكس اجتماع السلطات السياسية والاقتصادية والثقافية فيها، وجذبها العلماء والتجار والطلاب، وأسهم في تنشيط الاقتصاد ودعم الاستقرار الحضاري؛ حتى صارت عاصمة تنافس بغداد في النفوذ السياسي والثقافي."},{"q":"(تدريبات الدرس 7) اختر وبرِّر: العامل الأهم في قوة مصر في العصور الوسيطة: الاقتصاد، أم الجيش، أم الثقافة؟","a":"إجابة مقترحة: الاقتصاد؛ لأن الزراعة وفرت الموارد اللازمة لتمويل الإدارة والجيش، والتجارة أسهمت في تمويل الدولة وتعزيز مكانتها، فهو الأساس الذي قام عليه الجيش والمؤسسات. ويمكن اختيار عامل آخر بشرط التبرير؛ فالعوامل الثلاثة تكاملت في صنع قوة مصر."},{"q":"(تدريبات الدرس 8) اكتب تفسيرًا: كيف أسهمت العوامل المختلفة في تشكيل الدور الحضاري لمصر؟","a":"العامل السياسي جعل مصر مركزًا لصنع القرار؛ والاجتماعي (التعريب والهجرات) ربطها بالعالم الإسلامي وشكّل هويتها؛ والثقافي (العلماء والأزهر والترجمة والمؤرخون) جعلها مركزًا لتبادل المعرفة؛ والعمراني (الفسطاط والقطائع والقاهرة) أنشأ مجتمعًا حضريًّا جديدًا؛ والاقتصادي (الزراعة والصناعة والتجارة) موّل الدولة؛ والعسكري (عين جالوت) حمى المراكز الحضارية؛ فتكاملت هذه العوامل لتصنع دور مصر الحضاري."},{"q":"(تدريبات الدرس 9) يمكن وصف التحول السياسي الأبرز لمصر في العصر الوسيط بأنه تحول: (أ) من دولة إلى ولاية (ب) من ولاية إلى مركز قيادي (ج) من مركز إلى هامش (د) من استقلال إلى تبعية","a":"(ب) من ولاية إلى مركز قيادي؛ فقد انتقلت مصر من ولاية تابعة للدولة الإسلامية الكبرى إلى مركز قيادي مؤثر في العالم الإسلامي."},{"q":"(تدريبات الدرس 9) يتمثل الدور الأكثر شمولًا للأزهر في تحول مصر خلال العصر الوسيط في أنه: (أ) مسجد للصلاة والتعليم (ب) أنموذج للتطور المعماري (ج) مقر للحكم (د) مركز حضاري","a":"(د) مركز حضاري؛ لأنه جمع بين الدين والتعليم وإعداد العلماء والقضاة وربط مصر بالمراكز الثقافية في العالم الإسلامي."},{"q":"(تدريبات الدرس 9) تغيرت مكانة مصر بعد سقوط بغداد (1258م) على يد التتار من خلال أنها: (أ) أصبحت حامية للإسلام (ب) تحولت لدولة معزولة (ج) فقدت أهميتها (د) تحولت لولاية","a":"(أ) أصبحت حامية للإسلام؛ إذ صارت مركزًا سياسيًّا وعسكريًّا لحماية العالم الإسلامي، وأوقفت التوسع المغولي في عين جالوت."},{"q":"(تدريبات الدرس 9) ازدهرت التجارة في مصر خلال العصر الوسيط بسبب: (أ) انعزالها السياسي عن الصراعات (ب) موقعها الجغرافي وكثرة مواردها (ج) كثرة حروبها العسكرية خارجيًّا (د) اعتمادها على المعونات الخارجية","a":"(ب) موقعها الجغرافي وكثرة مواردها؛ فموقعها على طرق التجارة بين آسيا وإفريقيا وأوروبا، وموانئها وأسواقها، وفائض زراعتها، جعلتها مركزًا تجاريًّا يربط الشرق بالغرب."},{"q":"(تدريبات الدرس 9) يتمثل التحليل الأكثر دقة لدور العلماء في مصر خلال العصر الوسيط في أنه: (أ) حلقة وصل (ب) دور هامشي (ج) دور عسكري (د) دور اقتصادي","a":"(أ) حلقة وصل بين الإدارة السياسية في مصر والشعب، عبر توليهم القضاء والتعليم وتنظيم الشئون الدينية."},{"q":"(تدريبات الدرس 10) ضع علامة صح أو خطأ مع تفسير إجابتك: اقتصر سبب تحول مصر من ولاية إلى دولة مركزية على ضعف الخلافة العباسية.","a":"(خطأ) لأن ضعف الخلافة العباسية كان بداية الاستقلال فقط، وأسهمت عوامل أخرى: أن صارت القاهرة عاصمة للخلافة الفاطمية، وقوة الاقتصاد والموقع، والمؤسسات العلمية، والدور العسكري في مواجهة الصليبيين والمغول."},{"q":"(تدريبات الدرس 10) ضع علامة صح أو خطأ مع تفسير إجابتك: تركَّز دور العلماء في مصر خلال العصر الوسيط على الجانب الديني.","a":"(خطأ) لأن دورهم امتد إلى القضاء والتعليم وإدارة المجتمع بشكل غير مباشر، فكانوا حلقة وصل بين الإدارة والشعب، وبنوا قاعدة علمية أسهمت في تحويل مصر إلى مركز علمي وثقافي."},{"q":"(تدريبات الدرس 10) ضع علامة صح أو خطأ مع تفسير إجابتك: جعلت معركة عين جالوت مصر مركزًا للعالم الإسلامي.","a":"(صح) لأن انتصار عين جالوت أوقف التوسع المغولي وعزز مكانة مصر كقوة عسكرية كبرى تحمي العالم الإسلامي ومراكزه الحضارية، فتأكدت قيادتها بعد سقوط بغداد؛ مع ملاحظة أن المعركة عززت مكانة سبقتها منذ أن صارت القاهرة عاصمة للخلافة الفاطمية."},{"q":"(تدريبات الدرس 10) ضع علامة صح أو خطأ مع تفسير إجابتك: كلما زادت قوة الدولة داخليًّا، قلَّت أطماع القوى الخارجية فيها.","a":"(صح) لأن الدولة القوية باقتصادها وجيشها وإدارتها تستطيع حماية حدودها وردع الطامعين، كما صارت مصر قاعدة عسكرية مهمة لحماية حدود الدولة وتصدت للصليبيين والمغول."},{"q":"(تدريبات الدرس 10) ضع علامة صح أو خطأ مع تفسير إجابتك: يعكس التطور العمراني في القاهرة خلال العصر المملوكي قوة الدولة واستقرارها.","a":"(صح) لأن ازدهار المساجد والمدارس والأسواق والخانات والقصور والمباني الحكومية، واجتماع السلطات السياسية والاقتصادية والثقافية في القاهرة، دليل على قوة الدولة، وقد أسهم في دعم الاستقرار الحضاري."}],"era":"العصر الوسيط"},{"id":"l4","title":"التحولات الكبرى في مصر (العصر الحديث)","pages":"42-53","hook":"حملةٌ أيقظت مصر من «سباتها العميق»، فبنت جيشًا وقناطر وقناة؛ فكيف وقعت رغم ذلك في قبضة الاحتلال؟","bigIdea":"يمثّل تاريخ مصر في العصر الحديث رحلة طويلة ومتداخلة من التحولات السياسية والاقتصادية والاجتماعية، سعت خلالها البلاد إلى بناء دولة حديثة مستقلة، لكن هذه المحاولات واجهت تحديات داخلية وضغوطًا استعمارية.","objectives":["يتعرّف التحولات الاجتماعية في مصر خلال العصر الحديث.","يحدّد أوجه الاختلاف والتشابه بين التيارات الفكرية الكبرى التي شكّلت الوعي المصري الحديث.","يلخّص بعض المشروعات الحضارية بمصر في العصر الحديث.","يقدّم أمثلة لبعض قيادات حركة التغيير في مصر بالعصر الحديث.","يفسّر أسباب تحوّل المكانة الإقليمية لمصر من دولة فاعلة إلى ساحة نفوذ دولي.","يعبّر عن تقديره لأهمية التمسك بالهوية الوطنية وتحقيق الانتماء."],"sections":[{"id":"l4s1","title":"التحول السياسي في مصر بالعصر الحديث","pages":"43-45","intro":"رحلة شائكة تبدأ بصدمة حملة أجنبية وتنتهي بسؤال كبير: من يملك القرار في مصر؟ تابعها محطة بعد محطة.","cards":[{"kind":"concept","title":"رحلة طويلة للبحث عن الاستقلالية","body":"يمثّل تاريخ مصر الحديث **مسارًا شائكًا من التحولات السياسية** يمكن وصفه بأنه **رحلة طويلة للبحث عن الاستقلالية**. وترصد هذه الرحلة أبرز المحطات منذ صدمة **الحملة الفرنسية** وصعود **محمد علي** إلى السلطة، حتى وقوع مصر تحت **الاحتلال البريطاني عام 1882م**. ومن القيم التي نتعلمها أن **المسؤولية التاريخية** تقع على الجميع في الحفاظ على كيان الدولة وهويتها.","points":["الحملة الفرنسية (1798–1801)م","محمد علي (1805–1848)","لقب الخديو لإسماعيل 1867م","الثورة العرابية (1881–1882م)","الاحتلال البريطاني 1882م"]},{"kind":"date","title":"الحملة الفرنسية: الصدمة الحضارية","date":"1798–1801م","body":"جاءت **الحملة الفرنسية** على مصر في الفترة من **(1798–1801)م**، فاكتشف المصريون حجم **الفجوة الحضارية** بينهم وبين أوروبا في ثلاثة مجالات. وكان ذلك بمنزلة **صدمة كبيرة** دفعتهم إلى **إعادة التفكير في أسباب التقدم الأوروبي**؛ لذلك توصف بأنها «الصدمة الحضارية التي كشفت الفجوة».","points":["التنظيم العسكري","الإدارة الحديثة","العلوم والتقنيات"]},{"kind":"quote","title":"الطهطاوي: أيقظتنا الحملة من سباتنا","body":"قال **رفاعة الطهطاوي**: «إن مصر اليوم ليست هي مصر الأمس، لقد أيقظتنا الحملة الفرنسية من **سباتنا العميق**، ورأينا بعيوننا كيف تكون المدنية، وكيف يكون النظام، ومنذ ذلك الحين ونحن نسعى لأن نكون شيئًا مذكورًا بين الأمم». ويختلف المؤرخون: فبعضهم يرى الحملة **«صدمة حضارية»** أيقظت المصريين، وآخرون يرونها مجرد **«غزو مؤقت»** لم يترك آثارًا عميقة."},{"kind":"person","title":"محمد علي يبني دولة قوية","body":"في أعقاب خروج الحملة الفرنسية وما شهدته البلاد من اضطرابات، برزت شخصية **محمد علي (1805–1848)** الذي استطاع بناء **دولة قوية** قامت على أربع ركائز. وقد أدى ذلك إلى تحوّل مصر **تدريجيًّا** من **ولاية عثمانية** إلى **كيان سياسي أكثر استقلالًا**.","points":["إنشاء جيش نظامي حديث","إقامة إدارة مركزية قوية","تطوير الزراعة والصناعة","إرسال البعثات العلمية إلى أوروبا"]},{"kind":"person","title":"الخديو إسماعيل: لقب وفرمان","body":"لم يكن خلفاء محمد علي (**عباس** و**سعيد**) على نفس كفاءته الإصلاحية، حتى تولى **إسماعيل** الحكم. وفي عام **1867م** حصل إسماعيل باشا على **لقب الخديو**، فمنحه ذلك **وضعًا سياسيًّا أكثر استقلالًا داخل الدولة العثمانية**، كما حصل على **فرمان** من السلطان العثماني يغيّر نظام وراثة الحكم في مصر لتصبح في **أكبر أبناء إسماعيل**."},{"kind":"concept","title":"مفارقة التحديث والتبعية","body":"المفارقة في عهد إسماعيل أن **اقتراب مصر من الاستقلال السياسي** تزامن مع **تزايد النفوذ الأوروبي** لثلاثة أسباب. وبعد **عزل الخديو إسماعيل** تولى الحكم **توفيق**، فزاد في عهده **التدخل الأجنبي في شئون مصر**، وأصبحت مصر **محورًا للصراع الدولي** بعد افتتاح قناة السويس.","points":["الديون الخارجية","مشروعات التحديث","افتتاح قناة السويس عام 1869م"]},{"kind":"date","title":"الثورة العرابية ثم الاحتلال","date":"1881–1882م","body":"في نهاية القرن التاسع عشر تصاعدت **حركة مقاومة المصريين** ضد التدخل الأجنبي والحكم المطلق، فاندلعت **الثورة العرابية (1881–1882م)** رافعةً شعار **«مصر للمصريين»**. لكن **التدخل البريطاني** أدى إلى **احتلال مصر عام 1882م**، لتدخل البلاد مرحلة جديدة أصبحت فيها **السيادة الفعلية لبريطانيا**.","points":["طالبت بالدستور","طالبت بالحد من النفوذ الأجنبي","دافعت عن السيادة الوطنية"]}],"quiz":[{"type":"order","q":"رتّب هذه المحطات السياسية من الأقدم إلى الأحدث","items":["الحملة الفرنسية على مصر","تولي محمد علي الحكم","حصول إسماعيل على لقب الخديو","اندلاع الثورة العرابية","الاحتلال البريطاني لمصر"],"explain":"جاءت الحملة الفرنسية **(1798–1801)م**، ثم حكم محمد علي **(1805–1848)**، فلقب الخديو عام **1867م**، ثم الثورة العرابية **(1881–1882م)** التي انتهت بالاحتلال البريطاني عام **1882م**."},{"type":"fill","q":"كشفت الحملة الفرنسية للمصريين حجم ____ بينهم وبين أوروبا في التنظيم العسكري والإدارة الحديثة والعلوم والتقنيات.","options":["التبعية الاقتصادية","الفجوة الحضارية","المفارقة السياسية","التحولات الديموغرافية"],"answer":1,"explain":"اكتشف المصريون مع الحملة حجم **الفجوة الحضارية**، فكانت صدمة كبيرة دفعتهم إلى إعادة التفكير في أسباب التقدم الأوروبي."},{"type":"mcq","q":"لماذا قال رفاعة الطهطاوي إن الحملة الفرنسية «أيقظتنا من سباتنا العميق»؟","options":["لأنها أنشأت للمصريين جيشًا نظاميًّا حديثًا","لأنها أنهت تبعية مصر للدولة العثمانية","لأن المصريين رأوا بعيونهم كيف تكون المدنية والنظام","لأنها منحت مصر دستورًا وبرلمانًا"],"answer":2,"explain":"رأى الطهطاوي أن المصريين شاهدوا مع الحملة **كيف تكون المدنية وكيف يكون النظام**، فصاروا منذ ذلك الحين يسعون لأن يكونوا «شيئًا مذكورًا بين الأمم»."},{"type":"tf","q":"ركّز مشروع محمد علي بشكل واضح على الجانب العسكري دون الأبعاد النهضوية الأخرى.","answer":false,"explain":"خطأ؛ والصحيح أن مشروع محمد علي كان **تحديثًا شاملًا**: جيش نظامي حديث، وإدارة مركزية قوية، وتطوير الزراعة والصناعة، وإرسال البعثات العلمية إلى أوروبا."},{"type":"mcq","q":"تتمثل المفارقة التي اتسمت بها مشروعات الخديو إسماعيل بمصر في:","options":["قلتها مع وفرة الموارد المالية","نتائجها الإيجابية مع زيادة الديون","نجاحها مع تحقيق استقرار مالي","فشلها مع إرهاق ميزانية الدولة"],"answer":1,"explain":"اقتربت مصر في عهد إسماعيل من الاستقلال السياسي وأنجزت مشروعات تحديث، لكن ذلك تزامن مع **الديون الخارجية وتزايد النفوذ الأوروبي**، وهي «مفارقة التحديث والتبعية»."},{"type":"tf","q":"منح لقبُ الخديو إسماعيلَ عام 1867م استقلالًا تامًّا عن الدولة العثمانية.","answer":false,"explain":"خطأ؛ والصحيح أن اللقب منحه **وضعًا سياسيًّا أكثر استقلالًا داخل الدولة العثمانية**، أي أن مصر ظلت في إطارها."},{"type":"match","q":"صِل كل شخصية بما يناسبها","pairs":[["محمد علي","أنشأ جيشًا نظاميًّا حديثًا"],["عباس وسعيد","لم يكونا في كفاءة محمد علي الإصلاحية"],["إسماعيل","حصل على لقب الخديو عام 1867م"],["توفيق","زاد في عهده التدخل الأجنبي"],["رفاعة الطهطاوي","قال: أيقظتنا الحملة من سباتنا العميق"]],"explain":"بنى **محمد علي** الدولة الحديثة، ولم يكن خلفاؤه **عباس وسعيد** في كفاءته، ثم نال **إسماعيل** لقب الخديو، وبعد عزله زاد التدخل الأجنبي في عهد **توفيق**."},{"type":"sort","q":"صنّف ما يلي: من ركائز دولة محمد علي، أم من أسباب تزايد النفوذ الأوروبي في عهد إسماعيل؟","buckets":["ركائز دولة محمد علي","أسباب تزايد النفوذ الأوروبي"],"items":[["إنشاء جيش نظامي حديث",0],["الديون الخارجية",1],["إقامة إدارة مركزية قوية",0],["افتتاح قناة السويس عام 1869م",1],["إرسال البعثات العلمية إلى أوروبا",0],["مشروعات التحديث في عهد إسماعيل",1]],"explain":"قامت دولة محمد علي على الجيش والإدارة المركزية والزراعة والصناعة والبعثات، أما في عهد إسماعيل فتزايد النفوذ الأوروبي نتيجة **الديون الخارجية ومشروعات التحديث وافتتاح القناة**."},{"type":"who","q":"ما أنا؟","clues":["اندلعتُ في نهاية القرن التاسع عشر ضد التدخل الأجنبي والحكم المطلق","طالبتُ بالدستور والحد من النفوذ الأجنبي والدفاع عن السيادة الوطنية","رفعتُ شعار «مصر للمصريين» وانتهيتُ بتدخل بريطاني واحتلال عام 1882م"],"options":["الحملة الفرنسية","ثورة 1919م","الثورة العرابية","تيار الحركة الوطنية"],"answer":2,"explain":"**الثورة العرابية (1881–1882م)** طالبت بالدستور والسيادة الوطنية ورفعت شعار «مصر للمصريين»، لكن التدخل البريطاني أدى إلى احتلال مصر عام 1882م."}]},{"id":"l4s2","title":"التحولات الاجتماعية بمصر في العصر الحديث","pages":"45-46","intro":"من قمة الهرم الاجتماعي إلى قاعدته الواسعة، اكتشف كيف تغيّرت حياة المصريين في القرن التاسع عشر.","cards":[{"kind":"fact","title":"قمة الهرم: الطبقتان الأولى والثانية","body":"أسهم **التحول الاقتصادي** و**التدخل الأجنبي** في تشكيل المجتمع المصري، فبدا في أواخر القرن التاسع عشر **هرمًا اجتماعيًّا واضح المعالم**. ضمت **الطبقة الأولى** الحاكم ورجال الحاشية والرأسماليين وكبار ملاك الأراضي الذين كوّنوا **ثروات هائلة**، وشملت **الطبقة الثانية** كبار التجار وأصحاب المصانع والمحامين والأطباء والصحفيين والمثقفين."},{"kind":"fact","title":"قاعدة الهرم: الطبقة الثالثة والطبقة الدنيا","body":"ضمت **الطبقة الثالثة** الحرفيين وصغار التجار وصغار الملاك في الريف. أما **الطبقة الدنيا** فشملت **الفلاحين المعدمين** و**العمال الموسميين**، وهم الذين شكّلوا **أغلب المجتمع**. وهكذا اتسعت قاعدة الهرم لتضم الأغلبية بينما تركزت الثروات الهائلة في قمته، ومن القيم التي نتعلمها أن **تحقيق العدالة الاجتماعية** يسهم بشكل كبير في تحقيق استقرار المجتمع."},{"kind":"quote","title":"القطن «الذهب الأبيض»","body":"تلخص هذه العبارة ما جرى في الريف: «تحولت **الأرض** من مجرد وسيلة للعيش إلى **سلعة يُتاجَر فيها**، أصبح **القطن هو الذهب الأبيض**، كبار الملاك يزيدون ثراءً، والفلاحون يهاجرون إلى المدن بحثًا عن لقمة العيش؛ فتكونت **العشوائيات الأولى** على أطراف القاهرة». أي أن زراعة القطن للتصدير زادت ثروة كبار الملاك ودفعت الفلاحين إلى الهجرة."},{"kind":"concept","title":"التحول الديموغرافي","body":"**التحول الديموغرافي** هو **التغير الجذري في بنية السكان**؛ من حيث حجمهم وتوزيعهم الجغرافي وتركيبهم العمري والمهني، ويشمل ظاهرتَي **النمو السكاني المتسارع** و**الهجرة من الريف إلى المدن**. وقد شهدت مصر في **القرن التاسع عشر** تغيرات سكانية كبرى من هذا النوع."},{"kind":"cause","title":"لماذا تغيّرت خريطة السكان؟","body":"تمثلت التغيرات السكانية في القرن التاسع عشر في: **نمو سكاني متسارع** نتيجة **تحسّن الأوضاع الصحية والاستقرار السياسي**، و**هجرة الفلاحين** من الريف إلى المدن الكبرى بسبب سوء أحوالهم في ظل **نظام الاحتكار**، إضافةً إلى **تغيّر التركيب المهني** للسكان وظهور **وظائف جديدة مرتبطة بالدولة الحديثة**.","points":["وجهة المهاجرين: القاهرة والإسكندرية ومدن القناة"]},{"kind":"fact","title":"تحوّل أوضاع المرأة المصرية","body":"شهدت أوضاع المرأة المصرية في القرن التاسع عشر **تغيرات بطيئة لكنها عميقة**؛ فظهرت **دعوات إلى تعليم الفتيات** على يد مفكرين أمثال **رفاعة الطهطاوي** و**قاسم أمين**، كما ظهرت **رائدات** في العمل الثقافي والاجتماعي مثل **عائشة التيمورية**. لكن هذا التحول ظل **محدودًا في المدن وبين النخبة المتعلمة**، بينما استمرت معظم نساء الريف في **ظروف اجتماعية تقليدية**."}],"quiz":[{"type":"sort","q":"صنّف الفئات التالية حسب موقعها في الهرم الاجتماعي المصري أواخر القرن التاسع عشر","buckets":["الطبقة الأولى","الطبقة الثانية","الطبقة الدنيا"],"items":[["كبار ملاك الأراضي",0],["الأطباء والمحامون",1],["الفلاحون المعدمون",2],["رجال الحاشية",0],["أصحاب المصانع",1],["العمال الموسميون",2]],"explain":"قمة الهرم للحاكم والحاشية والرأسماليين وكبار الملاك، والطبقة الثانية لكبار التجار وأصحاب المصانع والمهنيين والمثقفين، أما **الطبقة الدنيا** فللفلاحين المعدمين والعمال الموسميين."},{"type":"mcq","q":"ما الذي دفع كثيرًا من الفلاحين إلى الهجرة من الريف إلى المدن الكبرى في القرن التاسع عشر؟","options":["سوء أحوالهم نتيجة نظام الاحتكار","تحوّل نظام الري إلى ري دائم طوال العام","انتشار التعليم وعودة المبتعثين","فرض المراقبة الثنائية الأوروبية"],"answer":0,"explain":"ساءت أحوال الفلاحين نتيجة **نظام الاحتكار**، فهاجروا إلى المدن الكبرى، خاصةً القاهرة والإسكندرية ومدن القناة."},{"type":"who","q":"ما أنا؟","clues":["مصطلح يصف تغيرًا جذريًّا يصيب بنية السكان","أهتم بحجم السكان وتوزيعهم الجغرافي وتركيبهم العمري والمهني","من أبرز ظواهري النمو السكاني المتسارع والهجرة من الريف إلى المدن"],"options":["الهرم الاجتماعي","الاحتكار","الاقتصاد التصديري","التحول الديموغرافي"],"answer":3,"explain":"**التحول الديموغرافي** هو التغير الجذري في بنية السكان حجمًا وتوزيعًا وتركيبًا، ويشمل النمو السكاني المتسارع والهجرة من الريف إلى المدن."},{"type":"tf","q":"ظل التحول في أوضاع المرأة المصرية خلال القرن التاسع عشر محدودًا في المدن وبين النخبة المتعلمة.","answer":true,"explain":"صحيح؛ فرغم الدعوات إلى تعليم الفتيات وظهور رائدات مثل **عائشة التيمورية**، استمرت معظم نساء الريف في ظروف اجتماعية تقليدية."},{"type":"tf","q":"يرجع النمو السكاني المتسارع في مصر خلال القرن التاسع عشر إلى سوء أحوال الفلاحين في ظل نظام الاحتكار.","answer":false,"explain":"خطأ؛ والصحيح أن النمو السكاني المتسارع كان نتيجة **تحسّن الأوضاع الصحية والاستقرار السياسي**، أما سوء أحوال الفلاحين فكان سببًا في **هجرتهم إلى المدن**."},{"type":"match","q":"صِل كل سبب بنتيجته","pairs":[["تحسن الأوضاع الصحية والاستقرار السياسي","نمو سكاني متسارع"],["سوء أحوال الفلاحين بسبب الاحتكار","الهجرة من الريف إلى المدن"],["قيام الدولة الحديثة","ظهور وظائف جديدة"],["تحوّل القطن إلى «ذهب أبيض»","ازدياد ثراء كبار الملاك"],["هجرة الفلاحين إلى المدن","تكوّن العشوائيات الأولى حول القاهرة"]],"explain":"هذه سلسلة أسباب ونتائج تكشف كيف أعادت **التحولات الاقتصادية والديموغرافية** تشكيل المجتمع المصري في القرن التاسع عشر."},{"type":"fill","q":"شكّل ____ والعمال الموسميون أغلب المجتمع المصري في أواخر القرن التاسع عشر.","options":["صغار التجار","الحرفيون","الفلاحون المعدمون","صغار الملاك"],"answer":2,"explain":"ضمت **الطبقة الدنيا** الفلاحين المعدمين والعمال الموسميين، وهم أغلب المجتمع، أما الحرفيون وصغار التجار وصغار الملاك فكانوا في الطبقة الثالثة."},{"type":"mcq","q":"كيف أدت زراعة القطن للتصدير إلى تفاوت اجتماعي في مصر؟","options":["حوّلت الأرض إلى سلعة فاغتنى كبار الملاك وهاجر الفلاحون إلى المدن","رفعت أجور العمال الموسميين حتى صاروا من كبار الملاك","نقلت الحرفيين وصغار التجار إلى قمة الهرم الاجتماعي","ربطت الدلتا بالصعيد فتساوت أحوال الريف والمدن"],"answer":0,"explain":"صار القطن «الذهب الأبيض» فكوّن كبار الملاك **ثروات هائلة**، بينما بقي الفلاحون المعدمون أغلب المجتمع وهاجر كثير منهم إلى المدن، فاتسعت الفجوة بين قمة الهرم وقاعدته."}]},{"id":"l4s3","title":"التحولات الفكرية","pages":"46-47","intro":"ثلاثة تيارات فكرية حمل كلٌّ منها وصفته الخاصة للنهضة؛ استمع إليها وقرر: أين تختلف وأين تلتقي؟","cards":[{"kind":"cause","title":"النخبة المصرية الجديدة وولادة التيارات","body":"شهد **القرن التاسع عشر** ولادة عديد من **التيارات الفكرية**، نتيجة **انتشار التعليم** و**عودة المبتعثين** و**الاحتكاك بالحضارة الأوروبية**؛ إذ رفض المصريون **استمرار تراجع بلدهم**، وحاولوا **اللحاق بركب الحضارة الحديثة**. وكانت أهم هذه التيارات: تيار الإصلاح الديني، والتيار الليبرالي، وتيار الحركة الوطنية المصرية."},{"kind":"concept","title":"تيار الإصلاح الديني","body":"ظهر بقيادة **جمال الدين الأفغاني** وتلميذه **محمد عبده** ثم **رشيد رضا**، وانطلق من فكرة أن **النهضة تبدأ بإصلاح الفكر الديني** وتحريره من **الخرافات والجمود**، و**إعمال العقل والاجتهاد**، والاستفادة من **علوم الغرب** وتقدمه العلمي **من دون التخلي عن الهوية الإسلامية**. كما دعا إلى **مقاومة الاستبداد السياسي** وإقامة **العدل والشورى**."},{"kind":"quote","title":"نأخذ من علوم الغرب ما ينفعنا","body":"جاء في **كتابات محمد عبده**: «إن سر تخلّف المسلمين هو ابتعادهم عن دينهم الحنيف، ليس المطلوب أن نرفض علوم الغرب، بل أن نأخذ منها ما ينفعنا ونحن متمسكون بديننا وهويتنا». وقال أستاذه **جمال الدين الأفغاني** قولًا قريبًا من ذلك. فالفكرة هي **الأخذ من علوم الغرب مع التمسك بالدين والهوية**، وهو ما يميّز الإصلاح الديني بـ**الوسطية والاعتدال**."},{"kind":"concept","title":"التيار الليبرالي","body":"برز **التيار الليبرالي** مع مفكرين وزعماء سياسيين، في مقدمتهم **أحمد لطفي السيد** و**رفاعة الطهطاوي**، وركّز على بناء **الدولة الوطنية الحديثة** القائمة على **الحريات الفردية**، و**الدستور والحياة النيابية على النمط الأوروبي**. ومن القيم التي نتعلمها هنا: **المواطنة** تعني أن الجميع متساوون في الحقوق والواجبات."},{"kind":"concept","title":"تيار الحركة الوطنية المصرية","body":"رفع رموز **تيار الحركة الوطنية المصرية** شعارات تدور حول **الاستقلال** و**السيادة**، ومن أبرز رموزه **مصطفى كامل** و**محمد فريد**. وتكشف شعاراته أن قضيته الأولى كانت **التخلص من الاحتلال الأجنبي** وبناء دولة مصرية يملك شعبها قراره.","points":["تحقيق الاستقلال الوطني","إنهاء الاحتلال الأجنبي","بناء دولة مصرية ذات سيادة"]},{"kind":"quote","title":"خطبة مصطفى كامل عام 1907م","body":"قال **مصطفى كامل** في خطبة عام **1907م**: «إن **الأمة المصرية** هي صاحبة الحق في هذا الوطن، وهي وحدها التي تملك التصرف في شئونها، نريد **دستورًا** يحمي حقوقنا، و**برلمانًا** يمثل إرادتنا، لا **حكمًا فرديًّا مطلقًا**». فرؤيته **سياسية وطنية** تقوم على سيادة الأمة والدستور والبرلمان."},{"kind":"concept","title":"اختلاف التيارات ونقاط التقائها","body":"اختلفت التيارات في **نقطة البداية**: فالإصلاح الديني بدأ بإصلاح **الفكر الديني** (ورأى محمد عبده سر التخلف في الابتعاد عن الدين)، والليبرالي بـ**الحريات والدستور**، والوطني بـ**الاستقلال وإنهاء الاحتلال**. لكنها **التقت** في رفض تراجع مصر والسعي إلى اللحاق بالحضارة الحديثة، وفي رفض **الاستبداد والحكم المطلق**؛ فالإصلاح الديني دعا إلى العدل والشورى، ومصطفى كامل طالب بدستور وبرلمان."}],"quiz":[{"type":"sort","q":"صنّف هذه الشخصيات حسب التيار الفكري الذي تنتمي إليه","buckets":["تيار الإصلاح الديني","التيار الليبرالي","تيار الحركة الوطنية"],"items":[["جمال الدين الأفغاني",0],["أحمد لطفي السيد",1],["مصطفى كامل",2],["محمد عبده",0],["محمد فريد",2],["رفاعة الطهطاوي",1]],"explain":"قاد **الأفغاني** وتلميذه **محمد عبده** الإصلاح الديني، وتقدّم **أحمد لطفي السيد ورفاعة الطهطاوي** رموز التيار الليبرالي، ومن أبرز رموز الحركة الوطنية **مصطفى كامل ومحمد فريد**."},{"type":"mcq","q":"ما الذي أدى إلى ولادة عديد من التيارات الفكرية في مصر خلال القرن التاسع عشر؟","options":["تحوّل نظام الري من حوضي موسمي إلى دائم","فرض المراقبة الثنائية الأوروبية على مالية مصر","حصول إسماعيل على لقب الخديو","انتشار التعليم وعودة المبتعثين والاحتكاك بالحضارة الأوروبية"],"answer":3,"explain":"نشأت التيارات نتيجة **انتشار التعليم وعودة المبتعثين والاحتكاك بالحضارة الأوروبية**، إذ رفض المصريون استمرار تراجع بلدهم وحاولوا اللحاق بركب الحضارة الحديثة."},{"type":"mcq","q":"يميّز تيارَ الإصلاح الديني عن غيره من التيارات التي انتشرت في مصر في العصر الحديث:","options":["رفض الغرب كليًّا","الوسطية والاعتدال","التقليد المباشر للغرب","الانعزال عن العالم"],"answer":1,"explain":"دعا هذا التيار إلى **الأخذ من علوم الغرب وتقدمه العلمي مع التمسك بالهوية الإسلامية**، فلم يرفض الغرب كليًّا ولم يقلده تقليدًا مباشرًا."},{"type":"tf","q":"عكس تنوّع التيارات الفكرية في مصر في القرن التاسع عشر ضعف الوعي القومي.","answer":false,"explain":"خطأ؛ والصحيح أن تنوعها عكس **يقظة الوعي**، فقد نشأت لأن المصريين رفضوا استمرار تراجع بلدهم وحاولوا اللحاق بركب الحضارة الحديثة."},{"type":"fill","q":"قال مصطفى كامل عام 1907م: «نريد دستورًا يحمي حقوقنا، و____ يمثل إرادتنا، لا حكمًا فرديًّا مطلقًا».","options":["برلمانًا","فرمانًا سلطانيًّا","صندوقًا للدين","خديويًّا جديدًا"],"answer":0,"explain":"رأى مصطفى كامل أن **الأمة المصرية صاحبة الحق في الوطن**، فطالب بدستور يحمي الحقوق و**برلمان** يمثل الإرادة بدلًا من الحكم الفردي المطلق."},{"type":"who","q":"من أنا؟","clues":["مفكر رأيت أن النهضة تبدأ بإصلاح الفكر الديني وتحريره من الخرافات والجمود","دعوت إلى مقاومة الاستبداد السياسي وإقامة العدل والشورى","قدت تيار الإصلاح الديني، وكان محمد عبده تلميذي"],"options":["جمال الدين الأفغاني","رشيد رضا","أحمد لطفي السيد","رفاعة الطهطاوي"],"answer":0,"explain":"**جمال الدين الأفغاني** قاد تيار الإصلاح الديني مع تلميذه محمد عبده ثم رشيد رضا، وقال: «ليس المطلوب أن نرفض علوم الغرب، بل أن نأخذ منها ما ينفعنا»."},{"type":"tf","q":"اتفقت التيارات الفكرية الثلاثة في نقطة البداية؛ إذ رأت جميعها أن النهضة تبدأ بإصلاح الفكر الديني.","answer":false,"explain":"خطأ؛ والصحيح أن إصلاح الفكر الديني منطلق **تيار الإصلاح الديني** وحده، أما **الليبرالي** فركّز على الحريات الفردية والدستور، و**الوطني** على الاستقلال وإنهاء الاحتلال."},{"type":"mcq","q":"ما الفرق الأساسي بين رؤية مصطفى كامل ورؤية محمد عبده لمستقبل مصر؟","options":["كامل ركّز على إصلاح الفكر الديني، وعبده على الدستور والبرلمان","كامل ركّز على سيادة الأمة والدستور والبرلمان، وعبده على العودة إلى الدين مع الأخذ من علوم الغرب","كامل دعا إلى الحكم الفردي المطلق، وعبده إلى الشورى","كامل دعا إلى رفض علوم الغرب، وعبده إلى تقليد الغرب تقليدًا مباشرًا"],"answer":1,"explain":"رؤية **مصطفى كامل** سياسية وطنية تقوم على حق الأمة والدستور والبرلمان، ورؤية **محمد عبده** إصلاحية دينية ترى سر التخلف في الابتعاد عن الدين مع الأخذ مما ينفع من علوم الغرب."},{"type":"mcq","q":"تحوّل مفهوم الانتماء لدى المصريين في العصر الحديث من التوجه:","options":["المصري إلى العثماني","الأوروبي إلى المصري","الإسلامي إلى العلماني","العثماني إلى الوطني"],"answer":3,"explain":"تحولت مصر من **ولاية عثمانية** إلى كيان أكثر استقلالًا، ورُفع شعار «مصر للمصريين»، وأكد مصطفى كامل أن **الأمة المصرية صاحبة الحق في هذا الوطن**."}]},{"id":"l4s4","title":"المشروعات الحضارية الكبرى ومكانة مصر الإقليمية","pages":"48-50","intro":"قناطر وقطارات وقناة وعاصمة جديدة؛ لكن هل كان لكل مشروع وجه واحد فقط؟","cards":[{"kind":"place","title":"القناطر الخيرية","body":"عبّرت مصر عن نهضتها الحضارية بمشروعات طموحة، منها **القناطر الخيرية** التي شُيّدت بهدف **تنظيم مياه النيل**، فتحوّل نظام الري من **الري الحوضي الموسمي** إلى **الري الدائم طوال العام**، وزادت رقعة الأراضي الزراعية، وتوسعت زراعة **القطن**، فأصبحت مصر **جزءًا من الاقتصاد العالمي القائم على تصدير القطن**.","points":["ري دائم بدل الري الحوضي الموسمي","زيادة رقعة الأراضي الزراعية","التوسع في زراعة القطن"]},{"kind":"date","title":"السكك الحديدية","date":"1854م","body":"مع التوسع في زراعة القطن ظهرت الحاجة إلى **وسائل نقل سريعة** لنقله إلى **الموانئ**، فبدأ إنشاء **السكك الحديدية عام 1854م**. ولم تقتصر أهميتها على **الدور الاقتصادي** في النقل، بل كان لها **دور سياسي** أيضًا؛ إذ أصبحت أداة **لتعزيز سيطرة الدولة** وبسط نفوذها الإداري على مختلف الأقاليم.","points":["ربطت القاهرة بالإسكندرية والسويس","ربطت الدلتا بالصعيد","ربطت مراكز الإنتاج بالموانئ"]},{"kind":"date","title":"قناة السويس: أثران متناقضان","date":"1859–1869م","body":"بدأ **حفر قناة السويس عام 1859م**، و**افتُتحت عام 1869م**، فتحولت مصر إلى **ممر عالمي للتجارة الدولية** يربط بين البحرين الأحمر والمتوسط. وكان لهذا المشروع **أثران متناقضان**: **ربط الاقتصاد المصري بالسوق العالمية** من جهة، وزيادة **أهمية موقع مصر الجغرافي** من جهة أخرى، وهي أهمية استغلها الاحتلال **ذريعة للتدخل في شئون مصر**."},{"kind":"place","title":"القاهرة الخديوية «باريس الشرق»","body":"شهدت القاهرة في **عهد الخديو إسماعيل** تحولًا عمرانيًّا كبيرًا؛ إذ ظهرت **القاهرة الخديوية** بشوارعها وميادينها الواسعة، ومبانيها ذات **الطراز الأوروبي**، و**الإضاءة الحديثة**، حتى لُقّبت بـ**«باريس الشرق»**. وكان **حي الإسماعيلية** (وسط القاهرة حاليًّا) **رمزًا لمشروع التحديث**."},{"kind":"result","title":"الوجه الآخر للعاصمة","body":"لم يعكس الوجه الحديث للقاهرة **واقع المجتمع**؛ فعلى الجانب الآخر ظهرت على أطراف المدينة **أحياء شعبية** و**تجمعات سكنية غير مخططة** سكنها **العمال القادمون من الريف**، ما كشف عن **تباين اجتماعي واضح** داخل العاصمة. ويُطرح رأي بأن القاهرة الخديوية كانت **تحديثًا عمرانيًّا** أكثر منها **مشروعًا اجتماعيًّا شاملًا**."},{"kind":"date","title":"مكانة مصر الإقليمية وضربة 1840م","date":"1840م","body":"شهدت مصر في القرن التاسع عشر تحولات هائلة اقتصاديًّا واجتماعيًّا وفكريًّا، وتحولت إلى **قوة إقليمية** بسطت نفوذها **لحماية حدودها**، حتى كادت تثبت وجودها **كإمبراطورية مستقلة**. لكنها اصطدمت **بالنفوذ الاستعماري**، فوُجّهت لها **ضربة قاصمة عام 1840م** أعادتها إلى داخل حدودها. ومع ذلك استمرت مسيرة النهضة، وتبلور **حلم الشعب المصري** في الحرية والاستقلال في النصف الأول من القرن العشرين."},{"kind":"quote","title":"«من يملك مصر يملك المفاتيح»","body":"جاء في خطاب لـ**وزير خارجية بريطانيا** أواخر القرن التاسع عشر: «مصر هي **أهم مستعمراتنا**، هي **الطريق إلى الهند**، وهي التي **تتحكم في قناة السويس**، مَن يملك مصر يملك **المفاتيح الحقيقية للإمبراطورية**». ويكشف النص أن **موقع مصر الإستراتيجي** جعلها هدفًا للأطماع البريطانية. ومن القيم التي نتعلمها: **الانتماء الوطني** أمر حتمي مع الانفتاح الفكري والثقافي في عالم اليوم."}],"quiz":[{"type":"order","q":"رتّب ما يلي من الأقدم إلى الأحدث","items":["ضربة قاصمة تعيد مصر إلى داخل حدودها","بدء إنشاء السكك الحديدية","بدء حفر قناة السويس","افتتاح قناة السويس","الاحتلال البريطاني لمصر"],"explain":"الضربة القاصمة عام **1840م**، ثم السكك الحديدية **1854م**، فحفر القناة **1859م**، فافتتاحها **1869م**، ثم الاحتلال البريطاني **1882م**."},{"type":"sort","q":"صنّف كل نتيجة حسب المشروع الذي أدى إليها","buckets":["القناطر الخيرية","السكك الحديدية","قناة السويس"],"items":[["تحول الري إلى ري دائم طوال العام",0],["ربط الدلتا بالصعيد",1],["ربط البحرين الأحمر والمتوسط",2],["زيادة رقعة الأراضي الزراعية",0],["بسط نفوذ الدولة الإداري على الأقاليم",1],["زيادة أهمية موقع مصر الجغرافي",2]],"explain":"نظّمت **القناطر** مياه النيل فوسّعت الزراعة، وربطت **السكك الحديدية** الأقاليم وعززت سيطرة الدولة، وحوّلت **القناة** مصر إلى ممر عالمي فزادت أهمية موقعها."},{"type":"mcq","q":"يتمثل أثر افتتاح قناة السويس على السيادة المصرية في أنه:","options":["عزّز الاستقلال المالي لمصر","قطع العلاقات مع أوروبا","أنهى التدخل البريطاني","حوّل مصر لمركز صراع دولي"],"answer":3,"explain":"زادت القناة من **أهمية موقع مصر الجغرافي** فأصبحت محورًا للصراع الدولي، واستغلها الاحتلال ذريعة للتدخل في شئونها."},{"type":"tf","q":"اقتصرت أهمية السكك الحديدية في مصر على نقل القطن إلى الموانئ.","answer":false,"explain":"خطأ؛ والصحيح أنها إلى جانب دورها الاقتصادي أصبحت **أداة لتعزيز سيطرة الدولة** وبسط نفوذها الإداري على مختلف الأقاليم."},{"type":"who","q":"ما أنا؟","clues":["مشروع حضاري شُيّد بهدف تنظيم مياه النيل","بفضلي تحوّل الري من حوضي موسمي إلى دائم طوال العام","توسعت بسببي زراعة القطن، وصارت مصر جزءًا من اقتصاد عالمي يقوم على تصديره"],"options":["قناة السويس","السكك الحديدية","القناطر الخيرية","القاهرة الخديوية"],"answer":2,"explain":"شُيّدت **القناطر الخيرية** لتنظيم مياه النيل، فتحول الري إلى ري دائم، وزادت رقعة الأراضي الزراعية، وتوسعت زراعة القطن."},{"type":"fill","q":"لُقّبت القاهرة الخديوية بـ«____» لشوارعها وميادينها الواسعة ومبانيها ذات الطراز الأوروبي وإضاءتها الحديثة.","options":["الذهب الأبيض","باريس الشرق","الطريق إلى الهند","حي الإسماعيلية"],"answer":1,"explain":"شهدت القاهرة في عهد **الخديو إسماعيل** تحولًا عمرانيًّا كبيرًا حتى لُقّبت **باريس الشرق**، وكان حي الإسماعيلية رمزًا لمشروع التحديث."},{"type":"mcq","q":"ماذا كشف ظهور أحياء شعبية وتجمعات سكنية غير مخططة على أطراف القاهرة الخديوية؟","options":["تباينًا اجتماعيًّا واضحًا داخل العاصمة","نجاح التحديث في رفع مستوى معيشة الجميع","توقف هجرة العمال من الريف إلى المدن","انتقال كبار الملاك للسكن على الأطراف"],"answer":0,"explain":"لم يعكس الوجه الحديث للقاهرة واقع المجتمع؛ فقد سكن العمال القادمون من الريف أحياءً غير مخططة، ما كشف **تباينًا اجتماعيًّا واضحًا**."},{"type":"tf","q":"بعد الضربة القاصمة عام 1840م توقفت مسيرة النهضة في مصر تمامًا.","answer":false,"explain":"خطأ؛ والصحيح أن الضربة أعادت مصر إلى داخل حدودها، **ومع ذلك استمرت مسيرة النهضة** وتبلور حلم الشعب المصري في الحرية والاستقلال في النصف الأول من القرن العشرين."},{"type":"mcq","q":"وفقًا لخطاب وزير خارجية بريطانيا أواخر القرن التاسع عشر، لماذا كان من يملك مصر «يملك المفاتيح الحقيقية للإمبراطورية»؟","options":["لأن سككها الحديدية ربطت الدلتا بالصعيد","لأن القطن فيها أصبح الذهب الأبيض","لأنها الطريق إلى الهند وتتحكم في قناة السويس","لأن عاصمتها لُقّبت بباريس الشرق"],"answer":2,"explain":"رأت بريطانيا مصر **أهم مستعمراتها** لأنها **الطريق إلى الهند** وتتحكم في **قناة السويس**، وهذا يبيّن أثر الموقع الإستراتيجي في الأطماع الاستعمارية."}]},{"id":"l4s5","title":"التحول الاقتصادي في مصر في القرن التاسع عشر","pages":"50-51","intro":"اتبع خيط المال من المصانع الأولى إلى الديون المتراكمة، وانظر إلى أين يقودك.","cards":[{"kind":"concept","title":"من الاكتفاء الذاتي إلى الاقتصاد التصديري","body":"يكشف **التحول الاقتصادي** في القرن التاسع عشر كيف انتقلت مصر من **اقتصاد يعتمد على الاكتفاء الذاتي** إلى **اقتصاد تصديري مرتبط بالسوق العالمية**. وهو تحوّل حمل في طياته **فرصًا للنمو**، لكنه مهّد أيضًا لـ**أزمة الديون** و**التدخل الأوروبي**."},{"kind":"fact","title":"التصنيع المبكر في عهد محمد علي","body":"حاول **محمد علي** في **النصف الأول من القرن التاسع عشر** بناء **اقتصاد صناعي مستقل**، فأنشأ مصانع **للأسلحة** و**الغزل والنسيج** والصناعات المرتبطة **بالجيش**، ووفّر لها **الحماية الجمركية** لدعم الصناعة الوطنية. ومن القيم التي نتعلمها: **دعم الصناعة الوطنية وحمايتها** واجب على كل فرد."},{"kind":"concept","title":"الاحتكار","body":"**الاحتكار** هو **سيطرة الدولة على الإنتاج والتجارة**؛ بهدف **تنظيم الاقتصاد وزيادة الموارد**. وقد ارتبط به **سوء أحوال الفلاحين** الذي دفعهم إلى الهجرة من الريف إلى المدن، ثم ألغته **معاهدة بلطة ليمان** التي فتحت الأسواق المصرية أمام المنتجات الأوروبية."},{"kind":"date","title":"معاهدة بلطة ليمان","date":"1838م","body":"تراجع مشروع محمد علي الصناعي بسبب **معاهدة بلطة ليمان 1838م**، التي نصت على **إلغاء نظام الاحتكار** و**فتح الأسواق المصرية أمام المنتجات الأوروبية**؛ ما أدى إلى **تراجع الصناعة المحلية**، وإن كان تطبيق ذلك قد بدأ بعد **معاهدة لندن**. ويُطرح للنقاش أن تراجع الصناعة لم يكن نتيجة عامل واحد، بل نتاج تفاعل بين **ضغوط خارجية** و**سياسات اقتصادية داخلية**."},{"kind":"cause","title":"تراكم الديون والتدخل الأجنبي","body":"شهدت مصر في **النصف الثاني من القرن التاسع عشر** تصاعدًا كبيرًا في **الديون الخارجية**؛ نتيجة **مشروعات التحديث** و**زيادة الإنفاق الحكومي**. وترتب على ذلك تدخل أجنبي في شئون مصر المالية والسياسية تمثل في ثلاث خطوات.","points":["إنشاء صندوق الدَّين","فرض المراقبة الثنائية الأوروبية","تشكيل وزارة مختلطة من وزراء مصريين وأجانب"]},{"kind":"result","title":"من فقدان الاستقلال المالي إلى الاحتلال","body":"بهذه الخطوات **فقدت مصر جزءًا كبيرًا من استقلالها المالي والسياسي**، وهو ما اتخذته **بريطانيا ذريعة لاحتلال مصر** بحجة **حماية مصالح الدائنين** و**تأمين طرق التجارة عبر قناة السويس**. وهكذا كانت **أزمة الديون** إحدى مراحل استعداد إنجلترا لاحتلال مصر عام **1882م**."},{"kind":"fact","title":"اقتصاد تابع في ظل الاحتلال البريطاني","body":"اتصف الاقتصاد المصري في أثناء **الاحتلال البريطاني** بخصائص رئيسة جعلته **تابعًا للرأسمالية الأوروبية**؛ فقد وُجّه الإنتاج بشكل أساسي لتلبية احتياجات **الأسواق العالمية** بدلًا من **المجتمع المحلي**، وسيطر **رأس المال الأجنبي** على قطاعات حيوية مثل البنوك والخدمات الكبرى.","points":["الاعتماد على تصدير المواد الخام","استيراد السلع المصنعة","سيطرة رأس المال الأجنبي على البنوك والخدمات الكبرى","توجيه الإنتاج لتلبية احتياجات الأسواق العالمية"]}],"quiz":[{"type":"order","q":"رتّب حلقات هذه السلسلة الاقتصادية من الأقدم إلى الأحدث","items":["محمد علي ينشئ مصانع الأسلحة والغزل والنسيج","معاهدة بلطة ليمان تلغي نظام الاحتكار","تصاعد الديون الخارجية في النصف الثاني من القرن التاسع عشر","فرض المراقبة الثنائية الأوروبية","الاحتلال البريطاني لمصر"],"explain":"بدأ التصنيع في **النصف الأول من القرن التاسع عشر**، ثم جاءت معاهدة **1838م**، وفي النصف الثاني تصاعدت الديون ففُرضت المراقبة الثنائية، واتخذت بريطانيا ذلك ذريعة لاحتلال مصر عام **1882م**."},{"type":"who","q":"ما أنا؟","clues":["نظام اقتصادي ارتبط به سوء أحوال الفلاحين حتى هاجروا إلى المدن","ألغتني معاهدة بلطة ليمان عام 1838م","أنا سيطرة الدولة على الإنتاج والتجارة بهدف تنظيم الاقتصاد وزيادة الموارد"],"options":["الحماية الجمركية","المراقبة الثنائية","الاقتصاد التصديري","الاحتكار"],"answer":3,"explain":"**الاحتكار** هو سيطرة الدولة على الإنتاج والتجارة، وقد ألغته معاهدة بلطة ليمان 1838م ففتحت الأسواق المصرية أمام المنتجات الأوروبية."},{"type":"mcq","q":"لماذا تراجع مشروع محمد علي لبناء اقتصاد صناعي مستقل؟","options":["بسبب معاهدة بلطة ليمان التي ألغت الاحتكار وفتحت الأسواق للمنتجات الأوروبية","بسبب إنشاء صندوق الدين وتشكيل الوزارة المختلطة","بسبب افتتاح قناة السويس وربط مصر بالسوق العالمية","بسبب الثورة العرابية ومطالبتها بالدستور"],"answer":0,"explain":"نصت **معاهدة بلطة ليمان 1838م** على إلغاء الاحتكار وفتح الأسواق أمام المنتجات الأوروبية، فتراجعت الصناعة المحلية التي كانت تدعمها الحماية الجمركية."},{"type":"sort","q":"صنّف ما يلي: من أسباب تصاعد الديون الخارجية أم من نتائجها؟","buckets":["أسباب تصاعد الديون","نتائج تصاعد الديون"],"items":[["مشروعات التحديث",0],["إنشاء صندوق الدين",1],["زيادة الإنفاق الحكومي",0],["فرض المراقبة الثنائية الأوروبية",1],["تشكيل وزارة مختلطة من مصريين وأجانب",1],["فقدان جزء كبير من الاستقلال المالي والسياسي",1]],"explain":"تصاعدت الديون بسبب **مشروعات التحديث وزيادة الإنفاق الحكومي**، فترتب عليها صندوق الدين والمراقبة الثنائية والوزارة المختلطة وفقدان جزء كبير من الاستقلال."},{"type":"tf","q":"أثّرت زيادة الديون الخارجية في القرن التاسع عشر على زيادة التدخل الأجنبي في مصر.","answer":true,"explain":"صحيح؛ فقد ترتب على الديون **صندوق الدين والمراقبة الثنائية والوزارة المختلطة**، ثم اتخذتها بريطانيا ذريعة لاحتلال مصر."},{"type":"tf","q":"كان التحول الزراعي نحو القطن في القرن التاسع عشر مفيدًا بالكامل من دون آثار سلبية.","answer":false,"explain":"خطأ؛ والصحيح أنه حمل فرصًا للنمو وربط مصر بالسوق العالمية، لكنه **زاد ثراء كبار الملاك ودفع الفلاحين إلى الهجرة** ومهّد لأزمة الديون والتدخل الأوروبي."},{"type":"match","q":"صِل كل سبب بنتيجته","pairs":[["معاهدة بلطة ليمان 1838م","تراجع الصناعة المحلية"],["الحماية الجمركية","دعم الصناعة الوطنية"],["فقدان الاستقلال المالي والسياسي","ذريعة بريطانية لاحتلال مصر"],["توجيه الإنتاج للأسواق العالمية","اقتصاد تابع للرأسمالية الأوروبية"]],"explain":"فتحت المعاهدة الأسواق فتراجعت الصناعة، ودعمتها الحماية الجمركية من قبل، ووفّر فقدان الاستقلال **ذريعة الاحتلال**، وجعل توجيه الإنتاج للخارج الاقتصاد **تابعًا**."},{"type":"fill","q":"اتخذت بريطانيا من أزمة الديون ذريعة لاحتلال مصر بحجة حماية مصالح ____ وتأمين طرق التجارة عبر قناة السويس.","options":["الفلاحين","الدائنين","المبتعثين","الحرفيين"],"answer":1,"explain":"بعد أن فقدت مصر جزءًا كبيرًا من استقلالها المالي والسياسي، احتلتها بريطانيا بحجة **حماية مصالح الدائنين** وتأمين التجارة عبر القناة."},{"type":"mcq","q":"أي مما يلي لا يُعد من خصائص الاقتصاد المصري في أثناء الاحتلال البريطاني؟","options":["الاعتماد على تصدير المواد الخام","استيراد السلع المصنعة","توفير الحماية الجمركية للصناعة الوطنية","سيطرة رأس المال الأجنبي على البنوك والخدمات الكبرى"],"answer":2,"explain":"**الحماية الجمركية** من سياسات محمد علي في النصف الأول من القرن التاسع عشر، أما اقتصاد الاحتلال فكان **تابعًا للرأسمالية الأوروبية** يصدّر الخام ويستورد المصنّع."}]}],"glossary":[{"term":"الصدمة الحضارية","def":"ما أحدثته الحملة الفرنسية (1798–1801)م حين كشفت للمصريين حجم الفجوة الحضارية بينهم وبين أوروبا، فدفعتهم إلى إعادة التفكير في أسباب التقدم الأوروبي."},{"term":"الخديو","def":"لقب حصل عليه إسماعيل باشا عام 1867م، ومنحه وضعًا سياسيًّا أكثر استقلالًا داخل الدولة العثمانية."},{"term":"مفارقة التحديث والتبعية","def":"اقتراب مصر من الاستقلال السياسي في عهد إسماعيل في الوقت نفسه الذي تزايد فيه النفوذ الأوروبي بسبب الديون الخارجية ومشروعات التحديث وافتتاح قناة السويس."},{"term":"التحول الديموغرافي","def":"التغير الجذري في بنية السكان؛ من حيث حجمهم وتوزيعهم الجغرافي وتركيبهم العمري والمهني، ويشمل ظاهرتي النمو السكاني المتسارع والهجرة من الريف إلى المدن."},{"term":"الاحتكار","def":"سيطرة الدولة على الإنتاج والتجارة؛ بهدف تنظيم الاقتصاد وزيادة الموارد."},{"term":"المواطنة","def":"أن الجميع متساوون في الحقوق والواجبات."},{"term":"الذهب الأبيض","def":"وصف للقطن بعد أن صار سلعة التصدير التي زادت كبار الملاك ثراءً."},{"term":"العشوائيات","def":"تجمعات سكنية غير مخططة ظهرت على أطراف القاهرة، سكنها الفلاحون والعمال القادمون من الريف."},{"term":"الري الدائم","def":"ري الأرض طوال العام بعد أن نظّمت القناطر الخيرية مياه النيل، بدلًا من الري الحوضي الموسمي."},{"term":"باريس الشرق","def":"لقب القاهرة الخديوية في عهد الخديو إسماعيل؛ لشوارعها وميادينها الواسعة ومبانيها ذات الطراز الأوروبي وإضاءتها الحديثة."},{"term":"الاقتصاد التصديري","def":"اقتصاد مرتبط بالسوق العالمية يقوم على التصدير، انتقلت إليه مصر في القرن التاسع عشر من اقتصاد يعتمد على الاكتفاء الذاتي."},{"term":"الوزارة المختلطة","def":"وزارة ضمت وزراء مصريين وأجانب، شُكّلت نتيجة تصاعد الديون الخارجية."},{"term":"الاقتصاد التابع","def":"اقتصاد يعتمد على تصدير المواد الخام واستيراد السلع المصنعة، ويسيطر رأس المال الأجنبي على قطاعاته الحيوية، ويوجَّه إنتاجه لخدمة الأسواق العالمية؛ كاقتصاد مصر في أثناء الاحتلال البريطاني."}],"keyDates":[{"date":"1798–1801م","event":"الحملة الفرنسية على مصر تكشف الفجوة الحضارية مع أوروبا"},{"date":"1805–1848م","event":"حكم محمد علي وبناء الدولة الحديثة"},{"date":"1838م","event":"معاهدة بلطة ليمان تلغي نظام الاحتكار وتفتح الأسواق أمام المنتجات الأوروبية"},{"date":"1840م","event":"ضربة قاصمة تعيد مصر إلى داخل حدودها"},{"date":"1854م","event":"بدء إنشاء السكك الحديدية"},{"date":"1859م","event":"بدء حفر قناة السويس"},{"date":"1867م","event":"حصول إسماعيل على لقب الخديو"},{"date":"1869م","event":"افتتاح قناة السويس"},{"date":"1881–1882م","event":"الثورة العرابية ترفع شعار «مصر للمصريين»"},{"date":"1882م","event":"الاحتلال البريطاني لمصر"},{"date":"1907م","event":"خطبة مصطفى كامل عن حق الأمة والدستور والبرلمان"}],"keyPeople":[{"name":"محمد علي","role":"حكم مصر (1805–1848)، وبنى دولة قوية بجيش نظامي وإدارة مركزية وبعثات علمية، وحاول بناء اقتصاد صناعي مستقل"},{"name":"رفاعة الطهطاوي","role":"رأى أن الحملة الفرنسية أيقظت المصريين من «سباتهم العميق»، ودعا إلى تعليم الفتيات، ومن رموز التيار الليبرالي"},{"name":"عباس وسعيد","role":"خلفاء محمد علي، ولم يكونوا على نفس كفاءته الإصلاحية"},{"name":"الخديو إسماعيل","role":"نال لقب الخديو عام 1867م، وشهد عهده القاهرة الخديوية وافتتاح قناة السويس وتراكم الديون"},{"name":"توفيق","role":"تولى الحكم بعد عزل الخديو إسماعيل، وزاد في عهده التدخل الأجنبي في شئون مصر"},{"name":"قاسم أمين","role":"مفكر دعا إلى تعليم الفتيات"},{"name":"عائشة التيمورية","role":"من رائدات العمل الثقافي والاجتماعي في القرن التاسع عشر"},{"name":"جمال الدين الأفغاني","role":"قائد تيار الإصلاح الديني، دعا إلى الأخذ من علوم الغرب مع التمسك بالدين"},{"name":"محمد عبده","role":"تلميذ الأفغاني ومن قادة تيار الإصلاح الديني"},{"name":"رشيد رضا","role":"من قادة تيار الإصلاح الديني بعد محمد عبده"},{"name":"أحمد لطفي السيد","role":"في مقدمة رموز التيار الليبرالي"},{"name":"مصطفى كامل","role":"من أبرز رموز الحركة الوطنية، خطب عام 1907م مطالبًا بالدستور والبرلمان"},{"name":"محمد فريد","role":"من أبرز رموز تيار الحركة الوطنية المصرية"}],"bookExercises":[{"q":"سؤال يدفعنا للتعلم: كيف تشكّل الوعي المصري في التاريخ الحديث؟","a":"تشكّل عبر محطات متتابعة: صدمة الحملة الفرنسية التي كشفت الفجوة الحضارية مع أوروبا، ثم مشروع محمد علي وبعثاته العلمية، ثم انتشار التعليم وعودة المبتعثين والاحتكاك بأوروبا الذي ولّد تيارات الإصلاح الديني والليبرالي والوطني، ثم مقاومة التدخل الأجنبي في الثورة العرابية وشعار «مصر للمصريين»، حتى تبلور حلم الحرية والاستقلال في النصف الأول من القرن العشرين."},{"q":"في رأيك، إلى أي مدى يمكن اعتبار الحملة الفرنسية نقطة تحوّل في تاريخ مصر الحديث؟","a":"إلى حد كبير؛ لأنها كشفت للمصريين حجم الفجوة الحضارية بينهم وبين أوروبا في التنظيم العسكري والإدارة الحديثة والعلوم والتقنيات، فكانت صدمة دفعتهم إلى إعادة التفكير في أسباب التقدم الأوروبي، وأعقبها صعود محمد علي وبناء الدولة الحديثة."},{"q":"قال رفاعة الطهطاوي: «لقد أيقظتنا الحملة الفرنسية من سباتنا العميق». ما المقصود بـ«السبات العميق» في تقديرك؟","a":"المقصود حالة الركود والتأخر التي عاشها المصريون قبل الحملة دون إدراك لحجم الفجوة الحضارية بينهم وبين أوروبا، حتى رأوا بعيونهم «كيف تكون المدنية، وكيف يكون النظام»."},{"q":"يرى بعض المؤرخين أن الحملة الفرنسية كانت «صدمة حضارية» أيقظت المصريين، ويرى آخرون أنها مجرد «غزو مؤقت» لم يترك آثارًا عميقة. أيهما تميل إلى ترجيحه؟ ولماذا؟","a":"يمكن ترجيح أنها «صدمة حضارية»؛ فقد كشفت الفجوة في التنظيم العسكري والإدارة والعلوم، ودفعت المصريين إلى التفكير في أسباب التقدم الأوروبي، وشهد الطهطاوي بأنهم منذ ذلك الحين يسعون لأن يكونوا «شيئًا مذكورًا بين الأمم»، ثم جاء مشروع محمد علي للتحديث بعد خروجها."},{"q":"ما الدور الذي لعبه محمد علي في بناء مصر الحديثة؟","a":"بنى دولة قوية قائمة على إنشاء جيش نظامي حديث، وإقامة إدارة مركزية قوية، وتطوير الزراعة والصناعة، وإرسال البعثات العلمية إلى أوروبا، فتحولت مصر تدريجيًّا من ولاية عثمانية إلى كيان سياسي أكثر استقلالًا."},{"q":"أفكّر وأتوقّع: في رأيك، هل كانت سياسات محمد علي الأكثر تأثيرًا في بناء قوة الدولة؟","a":"كانت شديدة التأثير؛ لأنها شملت الجيش والإدارة والزراعة والصناعة والتعليم معًا، فنقلت مصر تدريجيًّا من ولاية عثمانية إلى كيان أكثر استقلالًا، حتى صارت قوة إقليمية كادت تثبت وجودها كإمبراطورية مستقلة قبل ضربة 1840م."},{"q":"أفكّر وأتوقّع: هل كان مشروع محمد علي مشروع استقلال حقيقيًّا أم مشروع تحديث داخل إطار الدولة العثمانية؟ ناقش في ضوء علاقته بالسلطان العثماني، وسياسته العسكرية، وطموحه التوسعي.","a":"حقق المشروع تحديثًا واسعًا، لكنه نقل مصر «تدريجيًّا» إلى كيان «أكثر استقلالًا» لا مستقل تمامًا، فظلت داخل إطار الدولة العثمانية. وقد جعل الجيش الحديث والطموح التوسعي مصر قوة إقليمية كادت تصبح إمبراطورية مستقلة، لكن اصطدامها بالنفوذ الاستعماري وضربة 1840م أعاداها إلى داخل حدودها؛ لذا يبدو أقرب إلى مشروع تحديث يتطلع إلى الاستقلال."},{"q":"أفكّر وأفسّر: لماذا أصبحت مصر محورًا للصراع الدولي بعد افتتاح قناة السويس؟","a":"لأن القناة حولت مصر إلى ممر عالمي للتجارة الدولية يربط البحرين الأحمر والمتوسط، فزادت أهمية موقعها الجغرافي، وصارت في نظر بريطانيا «الطريق إلى الهند» ومفتاح الإمبراطورية، فاستغل الاحتلال ذلك ذريعة للتدخل في شئونها."},{"q":"كيف كانت أزمة الديون إحدى مراحل استعداد إنجلترا لاحتلال مصر؟","a":"تراكمت الديون الخارجية بسبب مشروعات التحديث وزيادة الإنفاق الحكومي، فأُنشئ صندوق الدين وفُرضت المراقبة الثنائية الأوروبية وشُكّلت وزارة مختلطة، ففقدت مصر جزءًا كبيرًا من استقلالها المالي والسياسي، واتخذت بريطانيا ذلك ذريعة لاحتلالها عام 1882م بحجة حماية مصالح الدائنين وتأمين طرق التجارة عبر قناة السويس."},{"q":"أقرأ وأحلّل: في رأيك، هل كان الاحتلال البريطاني نتيجة ضعف داخلي أم أطماع استعمارية؟ ادعم رأيك بالأدلة التاريخية.","a":"كان نتيجة العاملين معًا: فمن الضعف الداخلي تراكم الديون وما تبعه من صندوق الدين والمراقبة الثنائية والوزارة المختلطة وفقدان الاستقلال المالي والسياسي، ومن الأطماع الاستعمارية أن بريطانيا رأت مصر «أهم مستعمراتها» و«الطريق إلى الهند»، فتدخلت ضد الثورة العرابية واحتلت مصر عام 1882م."},{"q":"حدِّد العلاقات السببية بين زراعة القطن للتصدير وتكوين طبقة كبار الملاك.","a":"توسعت زراعة القطن بعد القناطر الخيرية والري الدائم، وأصبح القطن «الذهب الأبيض» وتحولت الأرض إلى سلعة يُتاجر فيها، فاغتنى من يملكون الأرض وتكونت طبقة كبار الملاك ذات الثروات الهائلة في قمة الهرم، بينما هاجر الفلاحون إلى المدن بحثًا عن لقمة العيش."},{"q":"أقرأ وأحلّل: «التحولات الاقتصادية والديموغرافية في القرن التاسع عشر أسهمت في إعادة تشكيل المجتمع المصري». ناقش العبارة موضحًا أوجه الترابط بين الاقتصاد والسكان والمجتمع.","a":"العبارة صحيحة: فالاقتصاد التصديري القائم على القطن زاد ثراء كبار الملاك، وسوء أحوال الفلاحين في ظل الاحتكار دفعهم إلى الهجرة نحو القاهرة والإسكندرية ومدن القناة فتكونت العشوائيات، وظهرت وظائف جديدة مرتبطة بالدولة الحديثة فتغيّر التركيب المهني، وتشكّل هرم اجتماعي من أربع طبقات واضحة."},{"q":"أفكّر وأناقش: بالاستعانة بشبكة المعلومات الدولية (الإنترنت)، قارن بين وضع المرأة المصرية قبل العصر الحديث ووضعها في نهايته.","a":"يحتاج النشاط إلى بحث خارجي، ومن الدرس: شهد القرن التاسع عشر تغيرات بطيئة لكنها عميقة؛ إذ ظهرت دعوات إلى تعليم الفتيات على يد الطهطاوي وقاسم أمين، وبرزت رائدات مثل عائشة التيمورية، لكن التحول ظل محدودًا في المدن وبين النخبة المتعلمة، واستمرت معظم نساء الريف في ظروف اجتماعية تقليدية."},{"q":"قال جمال الدين الأفغاني: «ليس المطلوب أن نرفض علوم الغرب، بل أن نأخذ منها ما ينفعنا ونحن متمسكون بديننا». ما الفكرة الأساسية التي يعبّر عنها النص؟","a":"الاستفادة من علوم الغرب وتقدمه العلمي في حدود ما ينفع، مع التمسك بالدين والهوية الإسلامية؛ أي لا رفض كلي للغرب ولا تقليد له."},{"q":"كيف تعكس هذه الفكرة منهج الإصلاح الديني؟","a":"تعكس منهجه القائم على أن النهضة تبدأ بإصلاح الفكر الديني وتحريره من الخرافات والجمود، وإعمال العقل والاجتهاد، والاستفادة من علوم الغرب دون التخلي عن الهوية الإسلامية، وهو منهج يتسم بالوسطية والاعتدال."},{"q":"قيِّم العبارة: «مثَّل التيار الليبرالي بداية التحول نحو الفكر الديمقراطي في مصر».","a":"عبارة لها ما يؤيدها؛ فقد ركّز التيار الليبرالي، ومن رموزه أحمد لطفي السيد ورفاعة الطهطاوي، على بناء الدولة الوطنية الحديثة القائمة على الحريات الفردية والدستور والحياة النيابية على النمط الأوروبي، وهي أسس يقوم عليها الحكم الديمقراطي والمواطنة التي تعني المساواة في الحقوق والواجبات."},{"q":"في ضوء خطبة مصطفى كامل (1907م) وكتابات محمد عبده: حدِّد أوجه الاختلاف بين رؤية مصطفى كامل ورؤية محمد عبده لمستقبل مصر.","a":"رؤية مصطفى كامل سياسية وطنية: الأمة المصرية صاحبة الحق في الوطن وتملك التصرف في شئونها، والمطلوب دستور يحمي الحقوق وبرلمان يمثل الإرادة لا حكم فردي مطلق. أما رؤية محمد عبده فإصلاحية دينية: سر تخلف المسلمين ابتعادهم عن دينهم، والحل الأخذ من علوم الغرب ما ينفع مع التمسك بالدين والهوية."},{"q":"هل ترى أن هذه التيارات كانت متناقضة تمامًا أم كان بينها نقاط التقاء؟","a":"لم تكن متناقضة تمامًا؛ فقد اختلفت في نقطة البداية (إصلاح الفكر الديني، أو الحريات والدستور، أو الاستقلال وإنهاء الاحتلال)، لكنها نشأت من الأسباب نفسها، ورفضت جميعها استمرار تراجع مصر وسعت إلى اللحاق بالحضارة الحديثة، والتقت في رفض الاستبداد والحكم المطلق."},{"q":"إلى أي مدى يمكن اعتبار إنشاء القناطر الخيرية نقطة تحوّل في الاقتصاد المصري؟","a":"إلى حد كبير؛ فقد نظمت مياه النيل وحوّلت الري من حوضي موسمي إلى دائم طوال العام، وزادت رقعة الأراضي الزراعية، ووسّعت زراعة القطن، فأصبحت مصر جزءًا من الاقتصاد العالمي القائم على تصدير القطن."},{"q":"أفكّر وأجب: ما الفارق بين الدور الاقتصادي والدور السياسي للسكك الحديدية في مصر؟","a":"الدور الاقتصادي: نقل القطن بسرعة إلى الموانئ وربط مراكز الإنتاج بالموانئ والقاهرة بالإسكندرية والسويس. والدور السياسي: أنها صارت أداة لتعزيز سيطرة الدولة وبسط نفوذها الإداري على مختلف الأقاليم، كربط الدلتا بالصعيد."},{"q":"أفكّر وأحلّل: هل كانت قناة السويس مشروعًا للتحديث أم بوابة للنفوذ الأجنبي؟","a":"كانت الاثنين معًا؛ فهي مشروع تحديث حوّل مصر إلى ممر عالمي للتجارة وربط اقتصادها بالسوق العالمية، لكنها زادت أهمية موقع مصر فأصبحت محورًا للصراع الدولي، وكانت من أسباب تزايد النفوذ الأوروبي، واستغلها الاحتلال ذريعة للتدخل في شئون مصر."},{"q":"أفكّر وأجيب: قارن بين مشهدي القاهرة الخديوية والأحياء الشعبية على أطرافها، ماذا يعكس كل منهما؟","a":"يعكس مشهد القاهرة الخديوية بشوارعها وميادينها الواسعة ومبانيها الأوروبية وإضاءتها الحديثة طموح التحديث العمراني حتى لُقبت بباريس الشرق، أما الأحياء الشعبية والتجمعات غير المخططة التي سكنها العمال القادمون من الريف فتعكس واقع المجتمع والتباين الاجتماعي الواضح داخل العاصمة."},{"q":"«القاهرة الخديوية كانت تعبيرًا عن مشروع تحديث عمراني أكثر منها مشروعًا اجتماعيًّا شاملًا». إلى أي مدى تتفق مع هذا الرأي؟","a":"أتفق إلى حد كبير؛ لأن الوجه الحديث للمدينة لم يعكس واقع المجتمع، إذ ظهرت على أطرافها أحياء شعبية وتجمعات سكنية غير مخططة للعمال القادمين من الريف، فكشفت عن تباين اجتماعي واضح؛ أي أن التحديث شمل العمران أكثر مما شمل أحوال الناس."},{"q":"أقرأ وأفسّر: «يرى البعض أن موقع مصر الإستراتيجي كان سببًا رئيسًا للاحتلال البريطاني أكثر من ضعف الدولة نفسها». إلى أي مدى تتفق؟ ادعم إجابتك بأمثلة.","a":"أتفق جزئيًّا؛ فالموقع سبب رئيس: بريطانيا رأت مصر «الطريق إلى الهند» والمتحكمة في قناة السويس، واتخذت تأمين طرق التجارة عبر القناة حجة للاحتلال. لكن ضعف الدولة المالي أسهم أيضًا: فالديون جلبت صندوق الدين والمراقبة الثنائية والوزارة المختلطة وأفقدت مصر جزءًا كبيرًا من استقلالها، فوفرت الذريعة."},{"q":"من خطاب لوزير خارجية بريطانيا أواخر القرن التاسع عشر: ما أهمية مصر الإستراتيجية من وجهة النظر البريطانية وفقًا للنص؟","a":"مصر أهم مستعمرات بريطانيا؛ فهي الطريق إلى الهند، وهي التي تتحكم في قناة السويس، ومن يملكها يملك المفاتيح الحقيقية للإمبراطورية."},{"q":"كيف تفسّر هذه الأهمية الإستراتيجية استمرار الضغوط الدولية على مصر حتى اليوم؟","a":"لأن موقع مصر وتحكمها في قناة السويس التي تربط البحرين الأحمر والمتوسط يجعلانها ممرًّا للتجارة الدولية ومحورًا لمصالح القوى الكبرى، وهذه الأهمية الجغرافية باقية، فتبقى مصر محط اهتمام القوى الدولية وضغوطها."},{"q":"هل كان الاحتلال البريطاني نتيجة حتمية لهذه الأهمية الإستراتيجية أم كان هناك بدائل أخرى؟","a":"لم يكن حتميًّا تمامًا؛ فالأهمية الإستراتيجية أوجدت الأطماع، لكن تراكم الديون وفقدان الاستقلال المالي والسياسي هو ما منح بريطانيا الذريعة، ولو لم تتراكم الديون ونجحت مطالب الثورة العرابية بالدستور والحد من النفوذ الأجنبي لربما اختلف المسار."},{"q":"أفكّر وأناقش: «لم يكن تراجع الصناعة في مصر خلال القرن التاسع عشر نتيجة عامل واحد، بل نتاج تفاعل بين ضغوط خارجية وسياسات اقتصادية داخلية». ناقش العبارة.","a":"العبارة صحيحة: فمن الضغوط الخارجية معاهدة بلطة ليمان 1838م التي ألغت الاحتكار وفتحت الأسواق أمام المنتجات الأوروبية، ومن السياسات الداخلية التحول إلى اقتصاد تصديري قائم على القطن، ثم تراكم الديون بسبب مشروعات التحديث والإنفاق الحكومي، حتى صار الاقتصاد في عهد الاحتلال يصدّر الخام ويستورد المصنّع."},{"q":"أفكّر وأفسّر: في رأيك، ما العامل الأكثر تأثيرًا في أزمة الديون المصرية: (السياسات المالية – التوسع العمراني – التدخل الأوروبي)؟","a":"يمكن ترجيح السياسات المالية؛ لأن الدرس يرجع تصاعد الديون إلى مشروعات التحديث وزيادة الإنفاق الحكومي، ومنها التوسع العمراني في
