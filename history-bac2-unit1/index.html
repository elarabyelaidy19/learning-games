د القطرين حدثًا مهمًّا في تاريخ الدولة المصرية؟","a":"لأنه الانطلاقة الحقيقية للدولة المصرية؛ إذ أدى إلى قيام دولة موحدة ذات سلطة مركزية تدير شؤون المجتمع، وحوّل التجمعات الصغيرة إلى دولة منظمة ذات سلطة واحدة ونظام إداري موحد."},{"q":"فسر أسباب خروج الجيش المصري ليعمل خارج حدوده.","a":"اضطرت مصر في العصور القديمة لمواجهة أخطار خارجية، خاصة من جهاتها الشمالية الشرقية، فتوسعت وكوّنت إمبراطورية كبيرة لحماية أمنها القومي، كما ظهر بوضوح في عهد الملك تحتمس الثالث."},{"q":"كيف يمكن تفسير قدرة مصر على إعادة بناء ذاتها بعد الأزمات؟","a":"بوعي شعبها وتماسكه وتكامل مقوماتها؛ فبعد الحكم العثماني والحملة الفرنسية والفوضى السياسية نجح الشعب في اختيار محمد علي واليًا، فبدأ مشروعًا إصلاحيًّا شاملًا يعتمد على القوة العسكرية والمؤسسات الاقتصادية والإدارية والتعليمية لبناء دولة حديثة."},{"q":"تذكر وسجل: في ضوء دراستك السابقة، اختر أحد مجالات الإصلاح التي قام بها محمد علي، وناقشه موضحًا أهم إنجازاته في هذا المجال.","a":"يذكر الدرس أن مشروع محمد علي شمل مختلف المجالات: العسكري ببناء قوة عسكرية، والاقتصادي والإداري والتعليمي بتأسيس مؤسسات متطورة تسهم في الاستقرار والتقدم؛ وكان الهدف إقامة دولة حديثة قادرة على حماية مصالحها وتعزيز مكانتها وتحقيق التنمية. ويمكن التوسع في إنجازات المجال المختار من دراستك السابقة."},{"q":"فكر وناقش: لماذا اعتُبرت ثورة 1952م نقطة تحول في تاريخ الدولة المصرية؟","a":"لأنها أحدثت تحولًا سياسيًّا واجتماعيًّا واقتصاديًّا؛ فأنهت النظام الملكي وحكم أسرة محمد علي، وأعلنت الجمهورية عام 1953م، وبدأت بناء الدولة على أسس وطنية تستهدف ترسيخ السيادة الوطنية والتحرر من النفوذ الأجنبي، وبناء مؤسسات قادرة على إدارة شؤون البلاد بكفاءة، وتحقيق العدالة الاجتماعية، وتعزيز التعليم والصناعة والإصلاح الزراعي."},{"q":"استنتج العلاقة بين إعلان الجمهورية وتعزيز السيادة الوطنية.","a":"إعلان الجمهورية بعد إنهاء النظام الملكي جعل بناء الدولة يقوم على أسس وطنية تستهدف ترسيخ مبدأ السيادة الوطنية والتحرر من النفوذ الأجنبي، فصار القرار المصري مستقلًّا نابعًا من مؤسسات وطنية قادرة على إدارة شؤون البلاد."},{"q":"تذكر وصمم: سجل على الخط الزمني مراحل تطور الدولة المصرية منذ توحيد البلاد وحتى الوقت الحاضر.","a":"مرحلة توحيد البلاد (3200 ق.م)، ثم التوسع وتكوين الإمبراطورية في عهد تحتمس الثالث، ثم الأطماع الخارجية (الغزو اليوناني والروماني) والحقبة القبطية، ثم العصر الإسلامي منذ 641م (ولاية تابعة للخلافة، فدولة مستقلة، فالحكم العثماني)، ثم بناء الدولة الحديثة في عصر محمد علي (1805م)، ثم ثورة 23 يوليو 1952م وإعلان الجمهورية 1953م، ثم الدولة المصرية المعاصرة."},{"q":"سؤال التفسير المدعوم بالأدلة: فسر أهمية السلطة والسيادة في استقلالية الدولة المصرية في اتخاذ قراراتها.","a":"السلطة بمؤسساتها التشريعية والتنفيذية والقضائية تضع القوانين وتنفذها وتحفظ النظام والأمن وتمكّن الدولة من ممارسة سيادتها، والسيادة تعني استقلال الدولة في قراراتها الداخلية (سن القوانين وحفظ الأمن) والخارجية (إبرام المعاهدات وإقامة العلاقات الدبلوماسية) دون خضوع لسلطة خارجية. ومن الأدلة أن مصر تشترط تصريحًا رسميًّا لدخول مجالها الجوي، وتحمي قناة السويس، وتعيّن حدودها البحرية لحماية ثرواتها."},{"q":"تدريبات الدرس (1): «نشأة الدولة المصرية لم تكن نتيجة عامل واحد، بل نتاج تفاعل مجموعة من العوامل». حلل العبارة في ضوء: الموقع الجغرافي، والموارد الطبيعية، والتجانس السكاني، والحكومة المركزية، ثم حدد العامل الأكثر تأثيرًا مع التبرير.","a":"الموقع جعل مصر قلب العالم القديم ومنحها حدودًا طبيعية حمت الوادي والدلتا فاستقر المجتمع، والموارد وفي مقدمتها النيل حوّلت المصري إلى مزارع مستقر ودعمت الاقتصاد، والتجانس جعل الشعب كتلة صلبة والوحدة السياسية أمرًا طبيعيًّا، والحكومة المركزية بعد توحيد القطرين حوّلت التجمعات إلى دولة منظمة. إجابة مقترحة للعامل الأكثر تأثيرًا: الحكومة المركزية، لأن الدرس يعدها الأساس الحقيقي لظهور الدولة ولأنها نظّمت الاستفادة من باقي العوامل، مع أن العوامل متكاملة لا يغني أحدها عن الآخر."},{"q":"تدريبات الدرس (2): «نهر النيل هو العامل الحاسم في قيام الدولة المصرية». ناقش العبارة مؤيدًا ومعارضًا، ثم قدم حكمًا نهائيًّا مدعمًا.","a":"مؤيدًا: النيل أهم مورد طبيعي، حوّل المصري إلى مزارع مستقر، وفرض تنظيم الري والعمل الجماعي والإدارة المركزية فنشأت الحكومة، وربط الشمال بالجنوب. معارضًا: النيل وحده لم يكن كافيًا، فقد أسهم الموقع والحدود الطبيعية والتجانس البشري والحكومة المركزية والجيش، بل رأى جمال حمدان أنه لو لم يكن النيل لفرض الموقع نفسه. الحكم: النيل عامل أساسي لكنه ليس العامل الأوحد، فالدولة نتاج تفاعل عدة عوامل."},{"q":"تدريبات الدرس (3): فسر العلاقة بين: الشعب واستقرار الدولة، والسلطة وتحقيق النظام، والسيادة واستقلال القرار، والقوة العسكرية واستمرارية الدولة.","a":"الشعب الواعي بحقوقه وواجباته يلتزم بالقانون وينبذ العنف ولا ينشر الشائعات فتستقر الدولة. والسلطة تضع القوانين وتنفذها فتحافظ على النظام والقانون. والسيادة تعني استقلال الدولة في قراراتها دون خضوع لسلطة خارجية، فلا استقلال للقرار بدونها. والقوة العسكرية تحمي الحدود وتصون الإنجازات وتضمن الاستقرار السياسي فتستمر الدولة."},{"q":"تدريبات الدرس (4): ماذا لو لم تتوافر حدود طبيعية لمصر؟","a":"لفقد قلب الدولة (الوادي والدلتا) الحواجز التي حمته، فيصبح أكثر عرضة للأخطار الخارجية، ويضعف استقرار المجتمع، فلا يتمكن المصريون من التركيز على البناء والزراعة، وتتأثر نشأة الدولة واستقرارها."},{"q":"تدريبات الدرس (4): ماذا لو غابت السلطة المركزية؟","a":"لبقيت مصر تجمعات صغيرة مشتتة، ولغاب تنظيم الري وتوزيع المياه وحل النزاعات بين الأقاليم، ولانتشرت الفوضى وضاعت الحقوق، ولعجزت الدولة عن ممارسة سيادتها وحماية حدودها."},{"q":"تدريبات الدرس (5): قارن بين دور الشعب في نشأة الدولة ودوره في استمراريتها.","a":"في النشأة: استقر المصريون مزارعين على ضفاف النيل، وتعاونوا في العمل الجماعي لتنظيم الري وبناء السدود، وانصهروا في بوتقة ثقافية واحدة جعلت الوحدة السياسية أمرًا طبيعيًّا. وفي الاستمرارية: يشارك الشعب سياسيًّا، ويدعم الأمن، ويسهم في التنمية، ويحافظ على الهوية، ويدافع عن الوطن، كما فعل في ثورة 1919م وفي اختيار محمد علي واليًا."},{"q":"تدريبات الدرس (6): «الدولة التي تفقد أحد أركانها تصبح مهددة بالانهيار». حلل العبارة موضحًا أثر غياب كل ركن.","a":"بغياب الشعب لا يوجد من يبني الدولة ويحميها، وبغياب الحيز الجغرافي لا توجد رقعة تمارس عليها الدولة سيادتها، فلا دولة بلا حدود معترف بها، وبغياب السلطة تعم الفوضى ويغيب النظام والقانون، وبغياب السيادة تفقد الدولة قدرتها على اتخاذ القرار وتخضع لسلطة خارجية. فالأركان مترابطة؛ إذا اختل أحدها تأثر الكيان كله."},{"q":"تدريبات الدرس (7): أي العوامل التالية كان الأكثر تأثيرًا في استمرار الدولة المصرية: الموقع الجغرافي، أم الحكومة المركزية، أم الجيش؟ اختر مع تبرير اختيارك.","a":"إجابة مقترحة: الحكومة المركزية؛ لأنها الأساس الحقيقي لظهور الدولة منذ توحيد القطرين، وتنظم الموارد وتدير شؤون الدولة، ويرتكز النظام السياسي القوي اليوم على الشفافية والحوكمة الرشيدة فيحفظ الأمن والاستقرار. ومع ذلك فالموقع والجيش مكملان لها: الموقع يمنح الحماية والتواصل، والجيش يحمي الحدود ويصون الإنجازات."},{"q":"تدريبات الدرس (8): اكتب فقرة تفسر فيها كيف أسهم تكامل أركان الدولة في استمراريتها.","a":"تقوم الدولة المصرية على أربعة أركان مترابطة: شعب متجانس واعٍ بحقوقه وواجباته يشارك في بنائها وحمايتها، وحيز جغرافي من أكثر الحدود ثباتًا عبر التاريخ تمارس عليه الدولة سيادتها برًّا وبحرًا وجوًّا، وسلطة منظمة بمؤسساتها التشريعية والتنفيذية والقضائية تحفظ النظام والقانون، وسيادة تضمن استقلال القرار الوطني. وقد تساندت هذه الأركان عبر العصور، فكلما تعرضت مصر لغزو أو أزمة صمدت بوحدة شعبها وقوة مؤسساتها واستقلال قرارها، فاستمرت الدولة آلاف السنين."},{"q":"تدريبات الدرس (9) اختر: يمكن تفسير استمرار الدولة المصرية عبر التاريخ رغم الغزوات المتكررة عليها من خلال: (أ) نظرة أحادية لمقومات قيام الدولة (ب) حتمية وجود قوة عسكرية دائمة (ج) تكامل مقومات قيام الدولة (د) الموقع الجغرافي الحصين ضد الغزو.","a":"(ج) تكامل مقومات قيام الدولة؛ لأن الدولة نتاج تفاعل مجموعة من العوامل لا عامل واحد."},{"q":"تدريبات الدرس (9) اختر: يتضح من دراسة نشأة الدولة المصرية أن العامل الحاسم في التحول من تجمعات سكانية إلى دولة مركزية هو: (أ) وجود جيش قوي (ب) الموقع الجغرافي (ج) زيادة عدد السكان (د) التوسع الزراعي.","a":"(د) التوسع الزراعي؛ لأن توسع القرى الزراعية على ضفاف النيل وزيادة علاقاتها أظهر الحاجة إلى تنظيم الري وتوزيع المياه وحل النزاعات وحماية الموارد المشتركة، فنشأت سلطة مركزية."},{"q":"تدريبات الدرس (9) اختر: يمكن تفسير العلاقة بين التجانس السكاني والاستقرار السياسي في مصر عبر تاريخها بأن: (أ) التجانس يقلل من الصراعات الداخلية (ب) التجانس يؤدي لزيادة السكان (ج) التجانس يمنع الغزو الخارجي (د) التجانس يحقق التنمية الاقتصادية.","a":"(أ) التجانس يقلل من الصراعات الداخلية؛ فقد جعل الشعب كتلة صلبة يصعب تفتيتها والوحدة السياسية أمرًا طبيعيًّا."},{"q":"تدريبات الدرس (9) اختر: يمكن استنتاج أن الدولة التي تفقد سيادتها: (أ) تنقص لديها الموارد الطبيعية (ب) تفقد قدرتها على اتخاذ القرار (ج) لا تمتلك موقعًا جغرافيًّا متميزًا (د) ينقص عدد سكانها بشكل ملحوظ.","a":"(ب) تفقد قدرتها على اتخاذ القرار؛ لأن السيادة هي استقلال الدولة في اتخاذ قراراتها دون خضوع لسلطة خارجية."},{"q":"تدريبات الدرس (10) ضع علامة صح أو خطأ مع التفسير: يلزم قيام أي دولة توافر جميع أركانها ومقوماتها.","a":"صح؛ لأن أركان الدولة مترابطة، إذا اختل أحدها تأثر كيان الدولة بأكمله، ولا يكتمل وجود الدولة إلا بتوافر مقومات تدعم نشأتها وتحافظ على استقرارها."},{"q":"تدريبات الدرس (10) ضع علامة صح أو خطأ مع التفسير: نهر النيل كان العامل الأوحد في نشأة الدولة المصرية.","a":"خطأ؛ فالنيل عامل أساسي، لكن نشأة الدولة نتاج تفاعل عوامل عدة كالموقع الجغرافي والموارد الطبيعية الأخرى والتجانس السكاني والحكومة المركزية."},{"q":"تدريبات الدرس (10) ضع علامة صح أو خطأ مع التفسير: وجود سلطة حاكمة وقوية يؤدي إلى حدوث الفوضى وعدم الاستقرار.","a":"خطأ؛ فالسلطة القوية تحافظ على النظام والقانون وتحقق الاستقرار السياسي والاجتماعي، واستقرار الدولة مرتبط بقوة مؤسساتها."},{"q":"تدريبات الدرس (10) ضع علامة صح أو خطأ مع التفسير: التجانس السكاني يرتبط بشكل طردي مع استقرار الدولة.","a":"صح؛ فكلما زاد التجانس قويت الوحدة الوطنية وقلت الصراعات الداخلية فزاد استقرار الدولة."},{"q":"تدريبات الدرس (10) ضع علامة صح أو خطأ مع التفسير: السيادة شرط أساسي لاستقلال القرار السياسي.","a":"صح؛ لأن السيادة تعني استقلال الدولة في قراراتها الداخلية والخارجية دون خضوع لسلطة خارجية."}],"era":"نشأة الدولة"},{"id":"l2","title":"الدولة المصرية القديمة ومقاومة الاحتلال","pages":"20-29","hook":"موقع فريد وخيرات وفيرة جعلا مصر مطمعًا للغزاة من الهكسوس إلى الرومان، فكيف واجهتهم؟","bigIdea":"إن الموقع الجغرافي المتميز لمصر ومواردها الاقتصادية الضخمة جعلاها مركزًا مهمًّا في العالم القديم، لكن فترات ضعف الدولة جعلتها هدفًا للأطماع الخارجية.","objectives":["يُحدِّد العلاقة التفاعلية بين الموقع الجغرافي لمصر والتنافس الدولي عليها عبر العصور.","يُفسِّر كيفية تحوُّل الموارد الاقتصادية من مصدر قوة إلى سبب للصراع.","يستنتج العلاقة بين قوة الدولة الداخلية وقدرتها على صد الأطماع الخارجية.","يُحدِّد أهم العوامل الداخلية والخارجية التي أثَّرت في تاريخ مصر القديم.","يستنتج أهمية الوحدة الوطنية والتماسك الداخلي كركيزة أساسية للأمن القومي."],"sections":[{"id":"l2s1","title":"دوافع احتلال مصر عبر التاريخ","pages":"21-22","intro":"انظر إلى موقع مصر على الخريطة، ثم اسأل نفسك: هل كان هذا الموقع نعمة أم نقمة؟","cards":[{"kind":"place","title":"موقع مصر: سلاح ذو حدين","body":"يفتتح الدرس بسؤال: كيف كان **الموقع الجغرافي لمصر** سلاحًا ذا حدين؟ تُظهر خريطة الكتاب مصر في ملتقى **قارات آسيا وإفريقيا وأوروبا**، تطل على **البحر المتوسط** ويجاورها **البحر الأحمر**. هذا الموقع مع مواردها الضخمة جعلها **مركزًا مهمًّا في العالم القديم**، لكنه جعلها أيضًا **هدفًا للأطماع الخارجية** في فترات ضعف الدولة."},{"kind":"concept","title":"الاحتلال","body":"**الاحتلال** هو سيطرة دولة قوية على أراضي دولة أخرى، وفرض **نفوذها السياسي والإداري** عليها **من دون موافقة شعبها**؛ ما يؤدي إلى **تقييد سيادة الدولة المحتلة**. أي أن المحتل لا يكتفي بدخول الأرض، بل يتحكم في قرارها وإدارتها رغمًا عن أهلها."},{"kind":"concept","title":"التنافس الدولي","body":"**التنافس الدولي** صراع بين **القوى الكبرى** للسيطرة على **مناطق النفوذ والمصالح**، سعيًا لتوسيع هيمنتها وتحقيق مكاسب سياسية واقتصادية على حساب الآخرين. وقد شكّلت مصر عبر تاريخها الطويل **محورًا إستراتيجيًّا** في السياسة الإقليمية والدولية؛ لذلك كانت دائمًا في قلب هذا التنافس."},{"kind":"cause","title":"لماذا طمعت الدول في مصر؟","body":"أدركت دول الاحتلال أن السيطرة على مصر تمنحها **تفوقًا سياسيًّا واقتصاديًّا**، ويرجع ذلك إلى **موقعها ومواردها**. ويعرض الكتاب دوافع الدول لاحتلال مصر عبر العصور، ومنها: **التوسع والتنافس الدولي**، و**الرغبة في السيطرة على موازين القوى بالمنطقة**، إلى جانب دوافع الموقع والموارد الآتية:","points":["الموقع على مفترق طرق ثلاث قارات","الإشراف على طرق التجارة العالمية","بوابة الشرق وبوابة إفريقيا","خصوبة الأرض ووفرة المحاصيل","مخزن الحبوب للدول الكبرى (مثل روما)"]},{"kind":"fact","title":"مصر هدف دائم للقوى الكبرى","body":"كيف أصبحت مصر محورًا للتنافس بين القوى الكبرى في العصور القديمة؟ لقد صارت **هدفًا دائمًا لقوى الاحتلال** التي سعت إلى توسيع نفوذها؛ ولذلك تعددت محاولات إخضاعها من قوى متعددة في المنطقة، مثل **الهكسوس والفرس واليونان والرومان**، الأمر الذي **هدد أمنها القومي** بشكل مباشر."},{"kind":"concept","title":"الأمن القومي","body":"**الأمن القومي** هو قدرة الدولة على حماية كيانها واستقرارها من **التهديدات الخارجية والداخلية**، ويتحقق من خلال **التماسك الداخلي**، ودعم **القوة الذاتية** عسكريًّا واقتصاديًّا، والحفاظ على **الهوية الوطنية**. لذلك يربط الدرس بين **قوة الدولة الداخلية** وقدرتها على صد الأطماع الخارجية."},{"kind":"quote","title":"ضحية أم مركز قوة؟","body":"يطلب الكتاب مناقشة عبارة: **«لم تكن مصر ضحية موقعها الجغرافي، بل كانت مركز قوة جعل القوى الكبرى تتنافس للسيطرة عليها»**. والفكرة أن الموقع والموارد **مصدر قوة** في الأصل، لكنهما يتحولان إلى **سبب للصراع** حين تتنافس عليهما القوى الكبرى، خاصة في **فترات ضعف الدولة**."}],"quiz":[{"type":"mcq","q":"ما التحليل الأكثر دقة لأسباب احتلال مصر في العصور القديمة؟","options":["ضعف مستمر للجيش المصري","ضعف داخلي وموقع متميز","كثرة السكان ونقص الموارد","غياب التراث الحضاري المؤثر"],"answer":1,"explain":"الموقع المتميز والموارد الضخمة جعلا مصر مطمعًا دائمًا، لكن **فترات ضعف الدولة** هي التي حوّلتها إلى هدف للأطماع الخارجية."},{"type":"tf","q":"يُعرِّف الكتاب الاحتلال بأنه سيطرة دولة قوية على أراضي دولة أخرى بموافقة شعبها.","answer":false,"explain":"الصواب: الاحتلال سيطرة دولة قوية على أراضي دولة وفرض نفوذها السياسي والإداري عليها **من دون موافقة شعبها**؛ ما يقيّد سيادة الدولة المحتلة."},{"type":"match","q":"صِل كل مصطلح بتعريفه","pairs":[["الاحتلال","فرض النفوذ على دولة دون موافقة شعبها"],["التنافس الدولي","صراع القوى الكبرى على مناطق النفوذ والمصالح"],["الأمن القومي","قدرة الدولة على حماية كيانها واستقرارها"]],"explain":"**الاحتلال** يقيّد سيادة الدولة، و**التنافس الدولي** صراع على النفوذ والمصالح، و**الأمن القومي** يقوم على التماسك الداخلي والقوة الذاتية والهوية الوطنية."},{"type":"sort","q":"صنّف دوافع احتلال مصر حسب مصدرها","buckets":["دوافع مرتبطة بالموقع","دوافع مرتبطة بالموارد"],"items":[["الموقع على مفترق طرق ثلاث قارات",0],["خصوبة الأرض ووفرة المحاصيل",1],["بوابة الشرق وبوابة إفريقيا",0],["مخزن الحبوب للدول الكبرى مثل روما",1],["الإشراف على طرق التجارة العالمية",0]],"explain":"أرجع الكتاب أطماع الدول في مصر إلى **موقعها ومواردها**: فالموقع جعلها ملتقى القارات ومشرفة على طرق التجارة، والموارد جعلتها مصدرًا للمحاصيل والحبوب."},{"type":"fill","q":"شكّلت مصر عبر تاريخها الطويل ____ في السياسة الإقليمية والدولية.","options":["طرفًا محايدًا","قوة استعمارية","محورًا إستراتيجيًّا","منطقة معزولة"],"answer":2,"explain":"كانت مصر **محورًا إستراتيجيًّا**، فأدركت دول الاحتلال أن السيطرة عليها تمنحها **تفوقًا سياسيًّا واقتصاديًّا** بسبب موقعها ومواردها."},{"type":"mcq","q":"تحوَّل الموقع الجغرافي لمصر من نعمة إلى نقمة من خلال:","options":["ثبات نظام الحكم","قلة الموارد الاقتصادية","زيادة عدد السكان","ضعف الجبهة الداخلية"],"answer":3,"explain":"الموقع نعمة تمنح مصر مكانة وقوة، لكنه يصبح نقمة حين **تضعف الجبهة الداخلية**، فتجد القوى الطامعة فرصتها للاحتلال."},{"type":"who","q":"ما أنا؟","clues":["تهددني محاولات القوى الأجنبية المتكررة لإخضاع الدولة","أقوم على التماسك الداخلي والحفاظ على الهوية الوطنية","أنا قدرة الدولة على حماية كيانها واستقرارها من التهديدات الخارجية والداخلية"],"options":["الأمن القومي","التنافس الدولي","الاحتلال","الاستقلال الذاتي"],"answer":0,"explain":"**الأمن القومي** قدرة الدولة على حماية كيانها واستقرارها، ويتحقق بالتماسك الداخلي ودعم القوة الذاتية عسكريًّا واقتصاديًّا والحفاظ على الهوية الوطنية."},{"type":"tf","q":"لم تتعرض مصر في العصور القديمة إلا لمحاولة احتلال واحدة جاءت من الفرس.","answer":false,"explain":"الصواب: أصبحت مصر **هدفًا دائمًا لقوى الاحتلال**، فتعددت محاولات إخضاعها من قوى متعددة مثل **الهكسوس والفرس واليونان والرومان**."}]},{"id":"l2s2","title":"مصر والهكسوس","pages":"22","intro":"حين تهتز قوة الدولة من الداخل تنفتح الأبواب أمام الغرباء... فكيف دخل الهكسوس مصر؟","cards":[{"kind":"cause","title":"الضعف يفتح الباب","body":"هل يمكن أن يؤدي ضعف الدولة إلى احتلالها؟ مع **نهاية عصر الدولة الوسطى** في مصر القديمة بدأت سلطة **الدولة المركزية** في الضعف، وعجزت عن حماية **حدودها الشرقية** التي كانت تمثل **بوابة مصر نحو آسيا**. وفي ظل هذه الاضطرابات تمكّن **الهكسوس** من التسلل منها **تدريجيًّا** إلى **دلتا النيل**."},{"kind":"cause","title":"تفوق عسكري لم تعرفه مصر","body":"لم يكن نجاح الهكسوس في السيطرة على مصر بسبب **ضعف الدولة المصرية** في تلك الفترة فقط، بل لامتلاكهم **أسلحة منحتهم التفوق العسكري** والقدرة على **الحركة والمناورة** في ميدان القتال، ولم تكن هذه الأسلحة متوافرة لدى مصر. ويعرض الكتاب صورة **العجلات الحربية** التي استخدمها الهكسوس."},{"kind":"place","title":"دلتا النيل: النبض الاقتصادي","body":"اختار الهكسوس **دلتا النيل** مركزًا لتمركزهم في مصر؛ لأنها تمثل **النبض الاقتصادي لمصر**، وهي **أقرب مناطقها اتصالًا بطرق التجارة القادمة من آسيا**. وبالسيطرة عليها نجح الهكسوس في **التحكم في جزء كبير من الموارد الاقتصادية** للبلاد."},{"kind":"place","title":"أواريس وخريطة تمركز الهكسوس","body":"اتخذ الهكسوس من مدينة **أواريس** عاصمة **سياسية وعسكرية** لبسط نفوذهم في **شمال البلاد**. وتُظهر خريطة «تمركز الهكسوس في مصر» منطقة تمركزهم في الدلتا وفيها أواريس، ثم تمتد على النيل جنوبًا مدن **منف** و**القوصية** و**أبيدوس** و**طيبة**، بينما يشير سهم في أقصى الجنوب إلى **خطر مملكة كوش**."},{"kind":"place","title":"طيبة تُشعل المقاومة","body":"هل تبدأ حروب التحرير بالسلاح أم بالفكرة؟ بدأت مقاومة الهكسوس مع **أمراء طيبة** في **الأسرة السابعة عشرة** عندما **أعلنوا استقلالهم السياسي** وسيطروا على **المناطق الجنوبية** في مصر، وقد مثّلت مدينة **طيبة** منطقة تمركزهم السياسي والعسكري. فكانت البداية **قرارًا سياسيًّا بالاستقلال** تلته المواجهة المسلحة."}],"quiz":[{"type":"mcq","q":"متى بدأت سلطة الدولة المركزية في مصر القديمة تضعف بما سمح بتسلل الهكسوس؟","options":["مع نهاية عصر الدولة الوسطى","في العصر المتأخر","مع بداية الأسرة السابعة عشرة","بعد وفاة الإسكندر الأكبر"],"answer":0,"explain":"مع **نهاية عصر الدولة الوسطى** ضعفت الدولة المركزية وعجزت عن حماية حدودها الشرقية، فتسلل الهكسوس منها تدريجيًّا إلى الدلتا."},{"type":"tf","q":"كان التفوق العسكري هو السبب الوحيد لنجاح الهكسوس في احتلال مصر.","answer":false,"explain":"الصواب: نجح الهكسوس بسبب **ضعف الدولة المصرية** في تلك الفترة، إلى جانب امتلاكهم **أسلحة منحتهم التفوق العسكري** والقدرة على الحركة والمناورة."},{"type":"mcq","q":"لماذا اختار الهكسوس دلتا النيل مركزًا لتمركزهم في مصر؟","options":["لأنها كانت منطقة تمركز أمراء طيبة","لأنها تقع على حدود مملكة كوش","لأنها النبض الاقتصادي لمصر وأقرب مناطقها لطرق التجارة الآسيوية","لأنها كانت أبعد المناطق عن البحر المتوسط"],"answer":2,"explain":"الدلتا **النبض الاقتصادي لمصر** وأقرب مناطقها اتصالًا بطرق التجارة القادمة من آسيا، وبالسيطرة عليها تحكّم الهكسوس في جزء كبير من الموارد."},{"type":"who","q":"ما أنا؟","clues":["مدينة في شمال مصر","أظهر على خريطة الكتاب داخل منطقة تمركز الهكسوس في الدلتا","اتخذني الهكسوس عاصمة سياسية وعسكرية لبسط نفوذهم"],"options":["منف","طيبة","القوصية","أواريس"],"answer":3,"explain":"**أواريس** عاصمة الهكسوس السياسية والعسكرية في شمال البلاد، وقد حاصرهم فيها أحمس الأول لاحقًا مع منف."},{"type":"sort","q":"صنّف العوامل التي مكّنت الهكسوس من السيطرة على مصر","buckets":["ظروف داخل مصر","مصادر قوة الهكسوس"],"items":[["ضعف سلطة الدولة المركزية",0],["امتلاك أسلحة تمنح التفوق العسكري",1],["العجز عن حماية الحدود الشرقية",0],["القدرة على الحركة والمناورة في القتال",1],["الاضطرابات في نهاية الدولة الوسطى",0],["التحكم في موارد الدلتا الاقتصادية",1]],"explain":"نجح الهكسوس حين التقى **ضعف الدولة المصرية من الداخل** مع **تفوقهم العسكري** وسيطرتهم على موارد الدلتا."},{"type":"order","q":"رتّب الأحداث الآتية من الأقدم إلى الأحدث","items":["ضعف الدولة المركزية مع نهاية الدولة الوسطى","تسلل الهكسوس تدريجيًّا إلى دلتا النيل","تمركز الهكسوس في الدلتا واتخاذ أواريس عاصمة","إعلان أمراء طيبة استقلالهم السياسي"],"explain":"الضعف الداخلي فتح الحدود الشرقية، فتسلل الهكسوس ثم رسّخوا نفوذهم في الدلتا، وبعدها بدأت المقاومة من **طيبة** في الأسرة السابعة عشرة."},{"type":"fill","q":"بدأت مقاومة الهكسوس مع أمراء ____ في الأسرة السابعة عشرة عندما أعلنوا استقلالهم السياسي.","options":["منف","طيبة","أواريس","أبيدوس"],"answer":1,"explain":"أعلن **أمراء طيبة** استقلالهم السياسي وسيطروا على المناطق الجنوبية، وكانت طيبة منطقة تمركزهم السياسي والعسكري."},{"type":"tf","q":"كلما زادت قوة الدولة داخليًّا، قلَّت أطماع القوى الخارجية فيها.","answer":true,"explain":"تجربة الهكسوس دليل على ذلك؛ فقد تسللوا إلى مصر حين **ضعفت الدولة المركزية** وعجزت عن حماية حدودها الشرقية."}]},{"id":"l2s3","title":"مراحل حرب الهكسوس: من التحدي إلى الحسم والنصر","pages":"22-23","intro":"ثلاثة قادة، وثلاث مراحل، وهدف واحد هو تحرير مصر... تابع كيف انتقلت الراية من يد إلى يد.","cards":[{"kind":"person","title":"سقنن رع: من التحدي إلى المواجهة","body":"في **المرحلة الأولى** تولى **سقنن رع** قيادة **طيبة** التي كانت تتمتع **بالاستقلال الذاتي**، فوسّع نفوذه حتى **أبيدوس (سوهاج حاليًّا)**، ودفع نفوذ الهكسوس شمالًا حتى حدود **القوصية (أسيوط حاليًّا)**. ومن ثَمّ بدأت مرحلة صراع حقيقي أدرك معها الهكسوس **الخطر الفعلي لصحوة الجيش المصري**. وانتهت المرحلة **بمقتل سقنن رع**، لكن **شرارة المقاومة المسلحة** لم تنطفئ."},{"kind":"person","title":"كامس: من المقاومة إلى التخطيط","body":"في **المرحلة الثانية** تولى **كامس** الحكم بعد وفاة والده، ولم يكتفِ **بالمواجهة الدفاعية**، بل **أعاد تنظيم الجيش بروح هجومية** واضحة، فبدأ بمحاربة الهكسوس في **مصر الوسطى** وانتصر عليهم، ثم **اتجه شمالًا** للأسباب الآتية:","points":["لنقل المعركة إلى مناطق نفوذ العدو","لتضييق الخناق على الهكسوس","لمنعهم من إعادة التمركز"]},{"kind":"cause","title":"خطة كامس: عزل العدو قبل ضربه","body":"اعتمد الملك كامس **سياسة عسكرية** تقوم على **قطع طرق الإمدادات القادمة من مملكة كوش**، بهدف **عزل الهكسوس** و**استنزاف قدراتهم الاقتصادية** تمهيدًا للمعركة الحاسمة. وقد **تُوفِّي كامس قبل المعركة الفاصلة**، لكن خطته **مهدت الطريق لأحمس** لمواجهة الهكسوس؛ لذلك يسأل الكتاب: هل يمكن اعتباره **مهندس النصر** رغم أنه لم يشهد المعركة الفاصلة؟"},{"kind":"person","title":"أحمس الأول: الحسم والنصر","body":"في **المرحلة الثالثة** استكمل الملك **أحمس الأول** مسيرة أخيه **كامس** ووالده **سقنن رع**، وبدأ **حملة شاملة** ضد الهكسوس؛ فحاصرهم في **منف وأواريس**، وطاردهم **خارج حدود مصر**، وحاصرهم حتى **القضاء عليهم نهائيًّا**، ممهِّدًا الطريق **لاستقلال مصر**. وتُصوِّر لوحة في الكتاب الملك أحمس مستخدمًا **العجلات الحربية**."},{"kind":"fact","title":"أحمس يضمن استقرار الداخل","body":"لم يكتفِ أحمس الأول بطرد الهكسوس، بل **أخضع حكام الأقاليم** تحت نفوذ الدولة، مع **السماح لهم بالاحتفاظ بألقابهم وامتيازاتهم**؛ وذلك لضمان **الاستقرار** واستمرار **ولائهم له**. وبذلك جمع بين فرض سلطة الدولة وكسب ولاء الحكام."},{"kind":"result","title":"من الأزمة إلى أول إمبراطورية","body":"هكذا تتحول **الأزمات الكبرى** إلى **نقطة انطلاق لمرحلة جديدة**؛ فقد أدرك المصريون بعد تجربة الهكسوس **ضرورة تطوير الجيش وتأمين حدودهم**، وهو ما أسهم في **بناء أول إمبراطورية في التاريخ المصري القديم**."},{"kind":"quote","title":"قيمة أتعلمها","body":"يلخص الكتاب درس حرب التحرير في قيمة مهمة: **«بناء القوة العسكرية لا يتم بالعشوائية، بل بالتخطيط والتدرج»**. ويظهر ذلك في انتقال المقاومة عبر ثلاث مراحل: **المواجهة** مع سقنن رع، ثم **التخطيط** مع كامس، ثم **الحسم والنصر** مع أحمس الأول."}],"quiz":[{"type":"order","q":"رتّب أحداث حرب التحرير ضد الهكسوس من الأقدم إلى الأحدث","items":["إعلان أمراء طيبة استقلالهم السياسي","سقنن رع يدفع الهكسوس حتى حدود القوصية","كامس يقطع إمدادات الهكسوس القادمة من كوش","أحمس الأول يحاصر الهكسوس في منف وأواريس","بناء أول إمبراطورية في التاريخ المصري القديم"],"explain":"بدأت المقاومة بإعلان **أمراء طيبة** استقلالهم، ثم المواجهة مع **سقنن رع**، فالتخطيط مع **كامس**، فالحسم مع **أحمس الأول**، ثم أدرك المصريون ضرورة تطوير الجيش فبنوا أول إمبراطورية."},{"type":"match","q":"صِل كل قائد بعنوان المرحلة التي قادها","pairs":[["سقنن رع","من التحدي إلى المواجهة"],["كامس","من المقاومة إلى التخطيط"],["أحمس الأول","الحسم والنصر"]],"explain":"قسّم الكتاب حرب الهكسوس إلى ثلاث مراحل متدرجة، لكل منها قائد وهدف: **المواجهة** ثم **التخطيط** ثم **الحسم**."},{"type":"mcq","q":"لماذا توجه الملك كامس شمالًا بعد انتصاره على الهكسوس في مصر الوسطى؟","options":["لتأمين حدود مصر الجنوبية من خطر مملكة كوش","لنقل المعركة إلى مناطق نفوذ العدو وتضييق الخناق عليه","للتفاوض مع الهكسوس على تقسيم البلاد","لنقل مركز حكمه من طيبة إلى أواريس"],"answer":1,"explain":"توجه كامس شمالًا **لنقل المعركة إلى مناطق نفوذ العدو**، و**لتضييق الخناق** على الهكسوس، و**لمنعهم من إعادة التمركز**."},{"type":"mcq","q":"يتمثل أهم درس استفادته مصر من تجربة الهكسوس في:","options":["أهمية الانعزال عن قارة آسيا","ضرورة الاعتماد على المرتزقة","تدعيم الأنشطة الاقتصادية المختلفة","تطوير الجيش وتأمين الحدود"],"answer":3,"explain":"بعد طرد الهكسوس أدرك المصريون **ضرورة تطوير الجيش وتأمين حدودهم**، وهو ما أسهم في بناء **أول إمبراطورية** في التاريخ المصري القديم."},{"type":"tf","q":"شارك الملك كامس في المعركة الفاصلة التي قضت على الهكسوس نهائيًّا.","answer":false,"explain":"الصواب: **تُوفِّي كامس قبل المعركة الفاصلة**، لكن خطته مهدت الطريق لأحمس الأول الذي قضى على الهكسوس نهائيًّا."},{"type":"tf","q":"سمح أحمس الأول لحكام الأقاليم بالاحتفاظ بألقابهم وامتيازاتهم بعد إخضاعهم لنفوذ الدولة.","answer":true,"explain":"فعل ذلك **لضمان الاستقرار** واستمرار **ولائهم له**، مع إخضاعهم تحت نفوذ الدولة."},{"type":"who","q":"من أنا؟","clues":["تولّيت قيادة مدينة كانت تتمتع بالاستقلال الذاتي","وسّعت نفوذي حتى أبيدوس ودفعت الهكسوس حتى حدود القوصية","انتهت المرحلة الأولى من حرب الهكسوس بمقتلي"],"options":["سقنن رع","كامس","أحمس الأول","أبسماتيك الثالث"],"answer":0,"explain":"**سقنن رع** قاد المرحلة الأولى (من التحدي إلى المواجهة)، وبمقتله انتهت المرحلة لكن شرارة المقاومة لم تنطفئ."},{"type":"fill","q":"اعتمد الملك كامس سياسة عسكرية تقوم على قطع طرق الإمدادات القادمة من ____ بهدف عزل الهكسوس واستنزاف قدراتهم الاقتصادية.","options":["بلاد فارس","مقدونيا","بلاد الشام","مملكة كوش"],"answer":3,"explain":"قطع كامس الإمدادات القادمة من **مملكة كوش** لعزل الهكسوس واستنزافهم اقتصاديًّا تمهيدًا للمعركة الحاسمة."},{"type":"sort","q":"صنّف الأعمال الآتية حسب القائد الذي قام بها","buckets":["كامس","أحمس الأول"],"items":[["أعاد تنظيم الجيش بروح هجومية",0],["حاصر الهكسوس في منف وأواريس",1],["انتصر على الهكسوس في مصر الوسطى",0],["طارد الهكسوس خارج حدود مصر",1],["قطع طرق الإمدادات القادمة من كوش",0],["أخضع حكام الأقاليم لنفوذ الدولة",1]],"explain":"**كامس** خطط ومهّد بإعادة تنظيم الجيش وعزل العدو، و**أحمس الأول** حسم المعركة وطرد الهكسوس ثم ثبّت الاستقرار الداخلي."}]},{"id":"l2s4","title":"الغزو الفارسي وغزو الإسكندر الأكبر لمصر","pages":"24-26","intro":"إمبراطورية عظمى من الشرق، ثم قائد طموح من مقدونيا... كلاهما دخل مصر، لكن بطريقتين مختلفتين.","cards":[{"kind":"cause","title":"مصر في العصر المتأخر","body":"هل سقطت مصر بسبب قوة الفرس فقط، أم بسبب ظروف داخلية أضعفتها؟ في **العصر المتأخر** كانت مصر تمر بحالة من **الاضطراب السياسي والصراع الداخلي**، فأصبحت **هدفًا للأطماع الخارجية**، خاصة من **الإمبراطورية الفارسية** التي تُظهرها خريطة الكتاب ممتدة على مساحة واسعة تضم مصر والشام وآشور وميديا."},{"kind":"date","title":"الفرس يدخلون مصر","date":"525 ق.م","body":"في عام **525 ق.م** التقى الجيشان **المصري والفارسي** في **شرق الدلتا**، وانتهت المواجهة **بهزيمة المصريين** بقيادة الملك **أبسماتيك الثالث**، ودخول الفرس مصر بقيادة الملك **قمبيز الثاني**؛ فأخضعوها لسلطتهم وأسسوا **الأسرة السابعة والعشرين**."},{"kind":"fact","title":"المصريون يرفضون الاحتلال الفارسي","body":"لم يتقبل **الشعب المصري** الاحتلال الفارسي، فظهرت **حركات المقاومة والثورات** لاستعادة **الاستقلال الوطني**؛ ما عكس **تمسُّك المصريين بهويتهم** ورفضهم للسيطرة الأجنبية. ويطرح الكتاب للنقاش عبارة: «سقوط مصر أمام الفرس كان نتيجة **ضعف داخلي** أكثر منه قوة خارجية»."},{"kind":"date","title":"الإسكندر الأكبر يتجه إلى مصر","date":"332 ق.م","body":"دخلت العلاقات الدولية مرحلة جديدة بصعود **الإسكندر الأكبر المقدوني** إلى عرش مقدونيا؛ إذ عزم على **الانتقام من الفرس** وطردهم من **آسيا الصغرى** بعد ما لحق ببلاد اليونان من مهانة على أيديهم. فاصطدم بالنفوذ الفارسي وانتصر في عدة معارك حاسمة، ثم وصل مصر عام **332 ق.م** وهي تعاني **وطأة الحكم الفارسي والضرائب المثقلة**، فكانت مهيأة لتقبُّل قوة قادرة على القضاء على الفرس."},{"kind":"fact","title":"دخول بلا مقاومة وسياسة مختلفة","body":"دخل الإسكندر مصر **من دون مقاومة تُذكَر**؛ لأن المصريين وجدوا فيه **فرصة للتخلص من الحكم الفارسي**، واتبع معهم سياسة مختلفة عن الغزاة الآخرين **باحترام عاداتهم وتقاليدهم**؛ فتوجه إلى **منف** وقدّم **القرابين للآلهة المصرية**، ثم إلى موقع المدينة التي قرر بناءها ووضع **تخطيط الإسكندرية**، ومنها إلى **واحة سيوة** حيث أعلن الكهنة **«بنوته لآمون»**."},{"kind":"place","title":"الإسكندرية وتثبيت النفوذ","body":"لأهمية مصر **الإستراتيجية** ومركزها **الاقتصادي** حرص الإسكندر على تثبيت نفوذه فيها **بأقل قدر من الصراع**؛ فحصل على **اعتراف ديني بسلطته**، وأسس مدينة **الإسكندرية** لتصبح **مركزًا تجاريًّا وثقافيًّا وعسكريًّا**، فبدأت **مرحلة جديدة في العلاقات بين مصر والإغريق**. ثم مكث في مصر بعض الوقت لينظم إدارتها، وعاد إلى مدينة **صور** ليبدأ مرحلة جديدة من حملته، فانتصر في جميع معاركه وامتدت إمبراطوريته **بين شواطئ مقدونيا وشواطئ السند**.","points":["خريطة الكتاب: إمبراطورية الإسكندر الأكبر (334 - 323 ق.م)","امتدت من مقدونيا واليونان حتى شمال غرب الهند","ضمّت آسيا الصغرى وبلاد الشام وبلاد الرافدين وفارس ومصر"]},{"kind":"quote","title":"رأيان في استقبال المصريين للإسكندر","body":"تعددت الآراء حول مدى قبول المصريين لدخول الإسكندر: **الرأي الأول** يرى أنه لم يجد مقاومة إذ **اعتبره المصريون مُحرِّرًا**، واحترم تقاليدهم الدينية ليظهر **حاكمًا شرعيًّا** مع الحفاظ على جاهزية جيشه. أما **الرأي الثاني** فيرى أنهم **استقبلوه بحذر**، وشكك **الكهنة ورجال النخبة** في نيته، لكنه نجح في تقديم نفسه **حاميًا للمعابد** ومستعيدًا للنظام، موازنًا بين **القوة العسكرية والسياسة الذكية**."}],"quiz":[{"type":"mcq","q":"ماذا حدث في عام 525 ق.م؟","options":["وصل الإسكندر الأكبر إلى مصر","هُزم المصريون أمام الفرس في شرق الدلتا ودخل الفرس مصر","تُوفِّي الإسكندر الأكبر وتصارع قادته على إمبراطوريته","انتهت معركة أكتيوم البحرية بوفاة كليوباترا السابعة"],"answer":1,"explain":"في عام **525 ق.م** هُزم المصريون بقيادة **أبسماتيك الثالث**، ودخل الفرس بقيادة **قمبيز الثاني** وأسسوا الأسرة السابعة والعشرين."},{"type":"mcq","q":"تتمثل الحقيقة الأبرز التي كشفها الغزو الفارسي لمصر في:","options":["التماسك الداخلي أهم عناصر قوة الدولة","قوة الحضارة وحدها تحمي الدولة من الخطر","الموقع نقمة مستمرة على تاريخ مصر","الجيش لا يحتاج إلى تطوير إلا وقت الضرورة"],"answer":0,"explain":"سقطت مصر أمام الفرس وهي تعاني **الاضطراب السياسي والصراع الداخلي**؛ ما يكشف أن **التماسك الداخلي** أهم عناصر قوة الدولة."},{"type":"tf","q":"تقبَّل المصريون الاحتلال الفارسي من دون مقاومة.","answer":false,"explain":"الصواب: **لم يتقبل الشعب المصري الاحتلال الفارسي**، وظهرت حركات المقاومة والثورات لاستعادة الاستقلال الوطني تمسكًا بهويتهم."},{"type":"mcq","q":"نجح الإسكندر في دخول مصر من دون مقاومة تُذكَر، ويرجع ذلك إلى:","options":["قوته العسكرية","تحالفه مع الرومان","استمالة الفرس لجانبه","احترامه للمصريين"],"answer":3,"explain":"وجد المصريون في الإسكندر **فرصة للتخلص من الحكم الفارسي**، واتبع معهم سياسة مختلفة عن الغزاة الآخرين **باحترام عاداتهم وتقاليدهم**."},{"type":"match","q":"صِل كل شخصية أو جماعة بدورها","pairs":[["أبسماتيك الثالث","ملك مصري هُزم أمام الفرس"],["قمبيز الثاني","قاد دخول الفرس إلى مصر"],["الإسكندر الأكبر","وضع تخطيط مدينة الإسكندرية"],["كهنة سيوة","أعلنوا بنوة الإسكندر لآمون"]],"explain":"هُزم **أبسماتيك الثالث** أمام **قمبيز الثاني** عام 525 ق.م، أما **الإسكندر** فخطط الإسكندرية ونال اعترافًا دينيًّا حين أعلن **كهنة سيوة** بنوته لآمون."},{"type":"order","q":"رتّب الأحداث الآتية من الأقدم إلى الأحدث","items":["دخول الفرس مصر وتأسيس الأسرة السابعة والعشرين","وصول الإسكندر الأكبر إلى مصر","تقديم الإسكندر القرابين للآلهة المصرية في منف","إعلان كهنة سيوة بنوة الإسكندر لآمون","عودة الإسكندر إلى مدينة صور"],"explain":"دخل الفرس عام **525 ق.م**، ووصل الإسكندر عام **332 ق.م** فزار منف ثم خطط الإسكندرية ثم سيوة، وبعد تنظيم إدارة مصر عاد إلى صور."},{"type":"who","q":"ما أنا؟","clues":["مدينة ارتبطت بمرحلة جديدة في العلاقات بين مصر والإغريق","أراد مؤسسي أن أكون مركزًا تجاريًّا وثقافيًّا وعسكريًّا","وضع تخطيطي القائد المقدوني الذي وصل مصر عام 332 ق.م"],"options":["منف","صور","الإسكندرية","أواريس"],"answer":2,"explain":"أسس الإسكندر الأكبر **الإسكندرية** لتصبح مركزًا تجاريًّا وثقافيًّا وعسكريًّا، ضمن سعيه لتثبيت نفوذه في مصر بأقل قدر من الصراع."},{"type":"fill","q":"حرص الإسكندر على تثبيت نفوذه في مصر بأقل قدر من الصراع حين حصل على ____ بسلطته.","options":["اعتراف ديني","تفويض عسكري","تحالف تجاري","استقلال إداري"],"answer":0,"explain":"أعلن كهنة سيوة **«بنوته لآمون»**، فنال **اعترافًا دينيًّا** بسلطته جعله يبدو حاكمًا شرعيًّا في نظر المصريين."},{"type":"sort","q":"صنّف العبارات حسب الرأي الذي تنتمي إليه حول استقبال المصريين للإسكندر","buckets":["الرأي الأول","الرأي الثاني"],"items":[["اعتبره المصريون مُحرِّرًا",0],["استقبله المصريون بحذر",1],["لم يجد مقاومة بعد أن أنهك الفرس سلطتهم",0],["شكك الكهنة ورجال النخبة في نيته",1],["احترم تقاليدهم الدينية ليظهر حاكمًا شرعيًّا",0],["قدّم نفسه حاميًا للمعابد ومستعيدًا للنظام",1]],"explain":"الرأي الأول يرى الإسكندر **مُحرِّرًا** لقي القبول، والثاني يرى أن المصريين **استقبلوه بحذر** لكنه كسب ثقتهم بالموازنة بين القوة العسكرية والسياسة الذكية."}]},{"id":"l2s5","title":"دولة البطالمة ومصر تحت حكم الرومان","pages":"26-27","intro":"إمبراطورية يتقاسمها القادة، ثم قوة جديدة تطرق الباب من روما... كيف عاشت مصر هذه التحولات؟","cards":[{"kind":"date","title":"صراع على إرث الإسكندر","date":"323 ق.م","body":"بعد **وفاة الإسكندر الأكبر عام 323 ق.م** واجهت إمبراطوريته **أزمة كبيرة**؛ إذ دخل **قادة جيشه** في صراع امتد بينهم من أجل فرض سيطرتهم على أكبر قدر من أراضيها. وتُظهر «خريطة توزيع إمبراطورية الإسكندر على قواده» ممالك خلفائه، ومنها:","points":["بطلميوس: مصر","كاسندر: مقدونيا","ليسيماخوس: تراقيا","سلوقس: بلاد ما بين النهرين وبلاد فارس"]},{"kind":"person","title":"بطلميوس بن لاجوس ودولة البطالمة","body":"وسط صراع قادة الإسكندر على إمبراطوريته برزت شخصية القائد **بطلميوس بن لاجوس**، الذي **فرض سيطرته على مصر** وجعلها **قاعدة لحكمه**. وهنا بدأت **مرحلة جديدة في تاريخ مصر**، هي **دولة البطالمة**."},{"kind":"cause","title":"ضعف البطالمة وصعود روما","body":"في الوقت الذي شهدت فيه **روما** تحولات **سياسية وعسكرية كبرى**، كانت **دولة البطالمة** في مصر تعاني **اضطرابات داخلية** و**صراعات على السلطة** أضعفت قدرتها على **حماية استقلالها**. ويطلب الكتاب تحليل عبارة: «سقوط مصر في يد الرومان لم يكن مجرد نتيجة لهزيمة عسكرية، بل كان نتيجة **تفاعل بين ضعف دولة البطالمة وصعود إمبراطورية جديدة**»."},{"kind":"cause","title":"لماذا أراد الرومان مصر؟","body":"مثَّلت مصر بالنسبة **للرومان** مركزًا **اقتصاديًّا وإستراتيجيًّا** مهمًّا؛ فهي من **أهم مصادر الحبوب في العالم القديم**، كما أن **موقعها الجغرافي** منحها القدرة على **التحكم في طرق التجارة بين الشرق والغرب**، وذلك أدى إلى **سعي الرومان للسيطرة على مصر**."},{"kind":"result","title":"أكتيوم: مصر ولاية رومانية","body":"تمت سيطرة الرومان على مصر بعد **معركة أكتيوم البحرية**، التي انتهت **بوفاة كليوباترا السابعة** و**سيطرة أكتافيوس على مصر**، لتصبح مصر **إحدى أهم الولايات الرومانية** تميزًا آنذاك. ويتساءل الكتاب: إلى أي مدى كانت سيطرة الرومان على مصر **امتلاكًا لمفتاح القوة الاقتصادية في البحر المتوسط**؟ ويحدد «مفتاح التواريخ» في بداية الوحدة عام **30 ق.م** لدخول مصر تحت الحكم الروماني.","date":"30 ق.م"},{"kind":"fact","title":"المقاومة المصرية للحكم الروماني","body":"لم يتقبل المصريون **الحكم الروماني**، وشهدت البلاد في عهد الرومان **ثورات** بسبب **الضرائب** وسياسات الرومان في مصر، وحاول المصريون **استعادة حكمهم للبلاد**. لكن الرومان **تعاملوا بشدة** مع هذه الاضطرابات؛ لأن **فقدان السيطرة على مصر يهدد استقرار دولتهم**."},{"kind":"result","title":"حقيقة تاريخية: الهوية لا تُهزم","body":"تكشف مقاومة المصريين للرومان عن **حقيقة تاريخية**: أن المصريين، رغم **خضوعهم للحكم الروماني**، ظلوا **متمسكين بهويتهم الحضارية** و**رافضين للسيطرة الأجنبية**. ويسأل الكتاب: هل كانت هذه المقاومة **امتدادًا للتقاليد المصرية** في الدفاع عن استقلال البلاد؟ وقد سبقتها مقاومة الهكسوس والثورات على الفرس، وفيها يتضح أن **الوحدة الوطنية والتماسك الداخلي** ركيزة أساسية **للأمن القومي**."}],"quiz":[{"type":"mcq","q":"من القائد الذي برز وسط صراع قادة الإسكندر، وفرض سيطرته على مصر وجعلها قاعدة لحكمه؟","options":["سلوقس","كاسندر","ليسيماخوس","بطلميوس بن لاجوس"],"answer":3,"explain":"فرض **بطلميوس بن لاجوس** سيطرته على مصر وجعلها قاعدة لحكمه، فبدأت **دولة البطالمة** مرحلة جديدة في تاريخ مصر."},{"type":"tf","q":"سقوط دولة البطالمة كان بسبب قوة الرومان وحدها من دون تأثير للصراعات الداخلية.","answer":false,"explain":"الصواب: كانت دولة البطالمة تعاني **اضطرابات داخلية وصراعات على السلطة** أضعفت قدرتها على حماية استقلالها، في وقت شهدت فيه روما تحولات كبرى."},{"type":"order","q":"رتّب الأحداث الآتية من الأقدم إلى الأحدث","items":["وفاة الإسكندر الأكبر","صراع قادة الإسكندر على أراضي إمبراطوريته","قيام دولة البطالمة في مصر","معركة أكتيوم البحرية","تحول مصر إلى ولاية رومانية"],"explain":"بعد وفاة الإسكندر عام **323 ق.م** تصارع قادته، فأسس **بطلميوس بن لاجوس** دولة البطالمة، ثم ضعفت حتى انتهت **معركة أكتيوم** بسيطرة أكتافيوس وصارت مصر ولاية رومانية."},{"type":"sort","q":"صنّف العوامل التي أدت إلى سيطرة الرومان على مصر","buckets":["ضعف داخلي في دولة البطالمة","دوافع روما وصعودها"],"items":[["اضطرابات داخلية في مصر",0],["تحولات سياسية وعسكرية كبرى في روما",1],["صراعات على السلطة",0],["مصر من أهم مصادر الحبوب",1],["ضعف القدرة على حماية الاستقلال",0],["التحكم في طرق التجارة بين الشرق والغرب",1]],"explain":"سقطت مصر في يد الرومان نتيجة **تفاعل** بين ضعف دولة البطالمة من الداخل وصعود روما الطامعة في **حبوب مصر وطرق تجارتها**."},{"type":"fill","q":"مثَّلت مصر للرومان مركزًا مهمًّا؛ لأنها من أهم مصادر الحبوب، ولأن ____ منحها القدرة على التحكم في طرق التجارة بين الشرق والغرب.","options":["موقعها الجغرافي","أسطولها البحري","تحالفها مع الإغريق","جيشها القوي"],"answer":0,"explain":"جمعت مصر بين **الموارد** (الحبوب) و**الموقع الجغرافي** الذي يتحكم في طرق التجارة، فسعى الرومان إلى السيطرة عليها."},{"type":"who","q":"من أنا؟","clues":["ارتبطت وفاتي بتحول كبير في تاريخ مصر القديمة","انتهت معركة أكتيوم البحرية بوفاتي","بعد وفاتي سيطر أكتافيوس على مصر فأصبحت ولاية رومانية"],"options":["بطلميوس بن لاجوس","الإسكندر الأكبر","كليوباترا السابعة","أبسماتيك الثالث"],"answer":2,"explain":"انتهت **معركة أكتيوم البحرية** بوفاة **كليوباترا السابعة** وسيطرة أكتافيوس على مصر، لتصبح إحدى أهم الولايات الرومانية."},{"type":"mcq","q":"لماذا تعامل الرومان بشدة مع ثورات المصريين؟","options":["لأن الثورات كانت تطالب بعودة حكم البطالمة","لأن المصريين تحالفوا مع الفرس ضدهم","لأن فقدان السيطرة على مصر يهدد استقرار دولتهم","لأنهم أرادوا نقل عاصمتهم إلى الإسكندرية"],"answer":2,"explain":"كانت مصر مركزًا اقتصاديًّا وإستراتيجيًّا مهمًّا لروما، لذلك رأى الرومان أن **فقدان السيطرة عليها يهدد استقرار دولتهم**."},{"type":"tf","q":"أثبتت المقاومة المصرية للرومان أن الهوية أقوى من الاحتلال.","answer":true,"explain":"رغم خضوعهم للحكم الروماني، ظل المصريون **متمسكين بهويتهم الحضارية** ورافضين للسيطرة الأجنبية."},{"type":"match","q":"صِل كل سبب بنتيجته","pairs":[["وفاة الإسكندر الأكبر","صراع قادته على الإمبراطورية"],["صراعات السلطة في دولة البطالمة","ضعف قدرتها على حماية استقلالها"],["معركة أكتيوم البحرية","سيطرة أكتافيوس على مصر"],["ضرائب الرومان وسياساتهم","ثورات المصريين"]],"explain":"يربط الدرس الأحداث بأسبابها: **الصراع** بعد وفاة الإسكندر، و**الضعف** بسبب صراعات البطالمة، و**السيطرة الرومانية** بعد أكتيوم، و**الثورات** ردًّا على الضرائب."}]}],"glossary":[{"term":"الاحتلال","def":"سيطرة دولة قوية على أراضي دولة وفرض نفوذها السياسي والإداري عليها من دون موافقة شعبها؛ ما يؤدي إلى تقييد سيادة الدولة المحتلة."},{"term":"التنافس الدولي","def":"صراع بين القوى الكبرى للسيطرة على مناطق النفوذ والمصالح، سعيًا لتوسيع هيمنتها وتحقيق مكاسب سياسية واقتصادية على حساب الآخرين."},{"term":"الأمن القومي","def":"قدرة الدولة على حماية كيانها واستقرارها من التهديدات الخارجية والداخلية، من خلال التماسك الداخلي ودعم القوة الذاتية عسكريًّا واقتصاديًّا، والحفاظ على الهوية الوطنية."},{"term":"الأسرة السابعة والعشرون","def":"الأسرة التي أسسها الفرس بعد دخولهم مصر بقيادة الملك قمبيز الثاني عام 525 ق.م وإخضاعها لسلطتهم."},{"term":"دولة البطالمة","def":"مرحلة جديدة في تاريخ مصر بدأت حين فرض القائد بطلميوس بن لاجوس سيطرته على مصر وجعلها قاعدة لحكمه بعد وفاة الإسكندر الأكبر."}],"keyDates":[{"date":"نهاية عصر الدولة الوسطى","event":"ضعف سلطة الدولة المركزية وتسلل الهكسوس تدريجيًّا إلى دلتا النيل"},{"date":"الأسرة السابعة عشرة","event":"بدء مقاومة الهكسوس بإعلان أمراء طيبة استقلالهم السياسي وسيطرتهم على المناطق الجنوبية"},{"date":"العصر المتأخر","event":"اضطراب سياسي وصراع داخلي جعلا مصر هدفًا للأطماع الخارجية، خاصة من الإمبراطورية الفارسية"},{"date":"525 ق.م","event":"هزيمة المصريين بقيادة أبسماتيك الثالث أمام الفرس في شرق الدلتا، ودخول قمبيز الثاني مصر وتأسيس الأسرة السابعة والعشرين"},{"date":"334 - 323 ق.م","event":"فترة إمبراطورية الإسكندر الأكبر كما تحددها خريطة الكتاب"},{"date":"332 ق.م","event":"وصول الإسكندر الأكبر إلى مصر ودخولها من دون مقاومة تُذكر"},{"date":"323 ق.م","event":"وفاة الإسكندر الأكبر وصراع قادة جيشه على إمبراطوريته، وبروز بطلميوس بن لاجوس في مصر"},{"date":"معركة أكتيوم البحرية","event":"وفاة كليوباترا السابعة وسيطرة أكتافيوس على مصر لتصبح إحدى أهم الولايات الرومانية"}],"keyPeople":[{"name":"أمراء طيبة","role":"بدأت معهم مقاومة الهكسوس في الأسرة السابعة عشرة حين أعلنوا استقلالهم السياسي وسيطروا على المناطق الجنوبية"},{"name":"سقنن رع","role":"قاد المرحلة الأولى من حرب الهكسوس (من التحدي إلى المواجهة)؛ وسّع نفوذ طيبة حتى أبيدوس ودفع الهكسوس حتى القوصية، وانتهت المرحلة بمقتله"},{"name":"كامس","role":"قاد المرحلة الثانية (من المقاومة إلى التخطيط)؛ أعاد تنظيم الجيش بروح هجومية وقطع إمدادات الهكسوس القادمة من كوش، وتُوفِّي قبل المعركة الفاصلة"},{"name":"أحمس الأول","role":"قاد المرحلة الثالثة (الحسم والنصر)؛ حاصر الهكسوس في منف وأواريس وطاردهم خارج مصر حتى قضى عليهم، وأخضع حكام الأقاليم لنفوذ الدولة"},{"name":"أبسماتيك الثالث","role":"ملك مصر الذي هُزم أمام الفرس في شرق الدلتا عام 525 ق.م"},{"name":"قمبيز الثاني","role":"ملك الفرس الذي قاد دخولهم مصر عام 525 ق.م، فأخضعوها لسلطتهم وأسسوا الأسرة السابعة والعشرين"},{"name":"الإسكندر الأكبر","role":"ملك مقدونيا الذي دخل مصر عام 332 ق.م من دون مقاومة تُذكر، واحترم تقاليد المصريين، وأسس الإسكندرية، وتُوفِّي عام 323 ق.م"},{"name":"بطلميوس بن لاجوس","role":"قائد من قادة الإسكندر فرض سيطرته على مصر وجعلها قاعدة لحكمه، فبدأت دولة البطالمة"},{"name":"كليوباترا السابعة","role":"انتهت معركة أكتيوم البحرية بوفاتها، فسيطر أكتافيوس على مصر"},{"name":"أكتافيوس","role":"سيطر على مصر بعد معركة أكتيوم البحرية فأصبحت إحدى أهم الولايات الرومانية"}],"bookExercises":[{"q":"سؤال يدفعنا للتعلم: كيف كان الموقع الجغرافي لمصر سلاحًا ذا حدين؟","a":"كان الموقع مصدر قوة؛ إذ جعل مصر على مفترق طرق ثلاث قارات ومشرفة على طرق التجارة، فصارت مركزًا مهمًّا في العالم القديم يمنح من يسيطر عليه تفوقًا سياسيًّا واقتصاديًّا. لكنه في الوقت نفسه جعلها هدفًا دائمًا لأطماع القوى الكبرى، خاصة في فترات ضعف الدولة، فتعرضت لمحاولات إخضاع من الهكسوس والفرس واليونان والرومان."},{"q":"ناقش زملاءك: «لم تكن مصر ضحية موقعها الجغرافي، بل كانت مركز قوة جعل القوى الكبرى تتنافس للسيطرة عليها».","a":"العبارة صحيحة إلى حد كبير؛ فالموقع والموارد جعلا مصر محورًا إستراتيجيًّا ومركز قوة يمنح من يسيطر عليه تفوقًا سياسيًّا واقتصاديًّا، ولذلك تنافست عليها القوى الكبرى. لكن هذا التنافس لم يتحول إلى احتلال فعلي إلا في فترات ضعف الدولة، مثل نهاية الدولة الوسطى مع الهكسوس، والعصر المتأخر مع الفرس، وضعف البطالمة مع الرومان."},{"q":"اقرأ وأجب: صنِّف دوافع الدول لاحتلال مصر عبر العصور إلى دوافع (سياسية ـ عسكرية ـ اقتصادية ـ إستراتيجية): الموقع على مفترق طرق ثلاث قارات، الإشراف على طرق التجارة العالمية، بوابة الشرق وبوابة إفريقيا، خصوبة الأرض ووفرة المحاصيل، مخزن الحبوب للدول الكبرى (مثل روما)، التوسع والتنافس الدولي، الرغبة في السيطرة على موازين القوى بالمنطقة.","a":"إجابة مقترحة: سياسية: التوسع والتنافس الدولي، والرغبة في السيطرة على موازين القوى بالمنطقة. عسكرية: بوابة الشرق وبوابة إفريقيا. اقتصادية: خصوبة الأرض ووفرة المحاصيل، ومخزن الحبوب للدول الكبرى (مثل روما)، والإشراف على طرق التجارة العالمية. إستراتيجية: الموقع على مفترق طرق ثلاث قارات. ويمكن أن يندرج بعض الدوافع تحت أكثر من فئة؛ فالإشراف على طرق التجارة مثلًا دافع اقتصادي وإستراتيجي معًا."},{"q":"كيف أصبحت مصر محورًا للتنافس بين القوى الكبرى في العصور القديمة؟","a":"أصبحت مصر هدفًا دائمًا لقوى الاحتلال التي سعت إلى توسيع نفوذها بسبب موقعها ومواردها؛ ولذلك تعددت محاولات إخضاعها من قوى متعددة في المنطقة، مثل الهكسوس والفرس واليونان والرومان، الأمر الذي هدد أمنها القومي بشكل مباشر."},{"q":"هل يمكن أن يؤدي ضعف الدولة إلى احتلالها؟","a":"نعم؛ فمع نهاية عصر الدولة الوسطى ضعفت سلطة الدولة المركزية وعجزت عن حماية حدودها الشرقية التي كانت تمثل بوابة مصر نحو آسيا، فتمكن الهكسوس في ظل هذه الاضطرابات من التسلل منها تدريجيًّا إلى دلتا النيل."},{"q":"ما العوامل التي مكنت الهكسوس من ترسيخ نفوذهم داخل مصر؟","a":"ضعف الدولة المصرية في تلك الفترة، وامتلاكهم أسلحة منحتهم التفوق العسكري والقدرة على الحركة والمناورة ولم تكن متوافرة لدى مصر، واختيارهم دلتا النيل مركزًا لتمركزهم لأنها النبض الاقتصادي لمصر وأقرب مناطقها لطرق التجارة القادمة من آسيا فتحكموا في جزء كبير من الموارد، واتخاذهم أواريس عاصمة سياسية وعسكرية لبسط نفوذهم في الشمال."},{"q":"هل تبدأ حروب التحرير بالسلاح أم بالفكرة؟","a":"بدأت حرب التحرير ضد الهكسوس بالفكرة والإرادة السياسية؛ إذ أعلن أمراء طيبة في الأسرة السابعة عشرة استقلالهم السياسي وسيطروا على المناطق الجنوبية، ثم تحولت الفكرة إلى مواجهة مسلحة مع سقنن رع، فتخطيط مع كامس، فحسم ونصر مع أحمس الأول."},{"q":"لماذا توجه الملك كامس شمالًا؟","a":"لنقل المعركة إلى مناطق نفوذ العدو، ولتضييق الخناق على الهكسوس، ولمنعهم من إعادة التمركز."},{"q":"أفهم وأجيب: هل يمكن اعتبار الملك كامس مهندس النصر رغم أنه لم يشهد المعركة الفاصلة؟ برِّر إجابتك.","a":"نعم إلى حد كبير؛ فقد تحول من المواجهة الدفاعية إلى الهجوم وأعاد تنظيم الجيش، وانتصر على الهكسوس في مصر الوسطى، ثم نقل المعركة شمالًا، واعتمد سياسة قطع الإمدادات القادمة من مملكة كوش لعزل الهكسوس واستنزاف قدراتهم الاقتصادية. وهذه الخطة مهدت الطريق لأحمس الأول لتحقيق النصر، وإن كان النصر حصيلة جهود سقنن رع وكامس وأحمس معًا."},{"q":"تخيل نفسك قائدًا أمام عدو استمر لسنوات في السيطرة على بلادك... ما أول قرار تتخذه؟ ولماذا؟ (الهجوم المباشر على العدو ـ تأمين الحدود ـ توطيد الحكم الداخلي)","a":"إجابة مقترحة: لا يكفي قرار واحد؛ فتجربة حرب الهكسوس تبين أن النجاح جاء بالتخطيط والتدرج: إعادة تنظيم الجيش وعزل العدو بقطع إمداداته (كامس)، ثم الهجوم الشامل حتى طرده (أحمس الأول)، ثم توطيد الحكم الداخلي بإخضاع حكام الأقاليم مع الإبقاء على ألقابهم وامتيازاتهم، وأخيرًا تطوير الجيش وتأمين الحدود حتى لا يتكرر الغزو."},{"q":"هل كان سقوط مصر نتيجة قوة الفرس فقط أم بسبب ظروف داخلية أضعفت الدولة المصرية؟","a":"لم يكن بسبب قوة الفرس فقط؛ ففي العصر المتأخر كانت مصر تمر بحالة من الاضطراب السياسي والصراع الداخلي جعلتها هدفًا للأطماع الخارجية، فلما التقى الجيشان في شرق الدلتا عام 525 ق.م هُزم المصريون بقيادة أبسماتيك الثالث، ودخل الفرس بقيادة قمبيز الثاني."},{"q":"أفكِّر وأناقِش: «سقوط مصر أمام الفرس كان نتيجة ضعف داخلي أكثر منه قوة خارجية». ناقِش العبارة في ضوء النص.","a":"العبارة صحيحة إلى حد كبير؛ فالنص يبدأ بحالة الاضطراب السياسي والصراع الداخلي التي كانت تمر بها مصر في العصر المتأخر وجعلتها هدفًا للأطماع، ثم يذكر المواجهة والهزيمة عام 525 ق.م. ومع ذلك لا يمكن إغفال قوة الإمبراطورية الفارسية الواسعة؛ فالسقوط جاء من التقاء ضعف الداخل بقوة الخارج، وكان الضعف الداخلي هو الذي فتح الباب."},{"q":"هل تقبَّل المصريون الاحتلال الفارسي من دون مقاومة؟","a":"لا؛ لم يتقبل الشعب المصري الاحتلال الفارسي، وظهرت حركات المقاومة والثورات لاستعادة الاستقلال الوطني؛ ما عكس تمسُّك المصريين بهويتهم ورفضهم للسيطرة الأجنبية."},{"q":"أفكِّر وأحلِّل: ما القضية التاريخية التي يمكن التأكيد عليها من مقاومة المصريين للفرس؟","a":"تمسُّك المصريين بهويتهم ورفضهم الدائم للسيطرة الأجنبية، وسعيهم المستمر لاستعادة استقلالهم الوطني مهما كانت قوة المحتل."},{"q":"أقرأ وأجيب: حلِّل العلاقة بين العوامل الآتية في تفسير نجاح الإسكندر في السيطرة على مصر: ضعف النفوذ الفارسي ـ السياسة الدينية للإسكندر ـ الموقع الإستراتيجي لمصر.","a":"تكاملت العوامل الثلاثة: فوطأة الحكم الفارسي وضرائبه المثقلة، وهزيمة الفرس أمام الإسكندر في معارك حاسمة، هيأت المصريين لتقبُّل قوة قادرة على القضاء عليهم. والسياسة الدينية (تقديم القرابين في منف، وإعلان كهنة سيوة بنوته لآمون، واحترام العادات والتقاليد) منحته اعترافًا دينيًّا فدخل من دون مقاومة تُذكر. أما الموقع الإستراتيجي ومركز مصر الاقتصادي فدفعاه إلى تثبيت نفوذه بأقل قدر من الصراع وتأسيس الإسكندرية مركزًا تجاريًّا وثقافيًّا وعسكريًّا."},{"q":"كيف سعى الإسكندر إلى تثبيت نفوذه في مصر؟","a":"لأهمية مصر الإستراتيجية ومركزها الاقتصادي حرص على تثبيت نفوذه بأقل قدر من الصراع: فاحترم عادات المصريين وتقاليدهم، وقدّم القرابين للآلهة المصرية في منف، وحصل على اعتراف ديني بسلطته حين أعلن كهنة سيوة بنوته لآمون، وأسس الإسكندرية لتصبح مركزًا تجاريًّا وثقافيًّا وعسكريًّا، ومكث بعض الوقت لينظم إدارة مصر."},{"q":"حلِّل النصين السابقين: قارِن بين طريقة استقبال المصريين للإسكندر في كلٍّ من النصين (1-2)، موضحًا أسباب الاختلاف.","a":"في النص الأول استقبله المصريون محرِّرًا من دون مقاومة لأن الفرس أنهكوا سلطتهم، واحترم تقاليدهم الدينية ليظهر حاكمًا شرعيًّا. وفي النص الثاني استقبلوه بحذر، وشكك الكهنة ورجال النخبة في نيته بعد السيطرة الفارسية الطويلة، لكنه كسب ثقتهم بتقديم نفسه حاميًا للمعابد ومستعيدًا للنظام. ويرجع الاختلاف إلى زاوية النظر: الأول يركز على رغبة المصريين في التخلص من الفرس، والثاني على خشيتهم من حاكم أجنبي جديد بعد احتلال طويل، ويتفق النصان على أن احترامه للدين وموازنته بين القوة والسياسة كسباه القبول."},{"q":"أفكِّر وأحلِّل: إلى أي مدى يمكن اعتبار سيطرة الرومان على مصر امتلاكًا لمفتاح القوة الاقتصادية في البحر المتوسط؟","a":"إلى حد كبير؛ فمصر من أهم مصادر الحبوب في العالم القديم، وموقعها الجغرافي يمنحها القدرة على التحكم في طرق التجارة بين الشرق والغرب؛ لذلك أصبحت إحدى أهم الولايات الرومانية، وتعامل الرومان بشدة مع ثورات المصريين لأن فقدان السيطرة عليها يهدد استقرار دولتهم."},{"q":"أفكِّر وأحلِّل: «سقوط مصر في يد الرومان لم يكن مجرد نتيجة لهزيمة عسكرية، بل كان نتيجة تفاعل بين ضعف دولة البطالمة وصعود إمبراطورية جديدة». حلِّل العبارة السابقة.","a":"العبارة صحيحة؛ فمن جهة كانت دولة البطالمة تعاني اضطرابات داخلية وصراعات على السلطة أضعفت قدرتها على حماية استقلالها، ومن جهة أخرى شهدت روما تحولات سياسية وعسكرية كبرى وسعت للسيطرة على مصر لأهميتها الاقتصادية والإستراتيجية. ثم جاءت معركة أكتيوم البحرية لتحسم الأمر بوفاة كليوباترا السابعة وسيطرة أكتافيوس على مصر."},{"q":"هل يمكن اعتبار المقاومة التي شهدتها مصر في مواجهة الرومان امتدادًا للتقاليد المصرية في الدفاع عن استقلال بلادهم؟","a":"نعم؛ فقد قاوم المصريون الهكسوس منذ أعلن أمراء طيبة استقلالهم حتى طردهم أحمس الأول، وثاروا على الفرس لاستعادة استقلالهم الوطني، ثم ثاروا على الرومان بسبب الضرائب والسياسات محاولين استعادة حكم بلادهم؛ فالمقاومة سلسلة متصلة تعكس رفض السيطرة الأجنبية."},{"q":"كيف استطاعت الحضارة المصرية أن تحافظ على استمرارها رغم خضوع البلاد للحكم الروماني؟","a":"بتمسك المصريين بهويتهم الحضارية ورفضهم للسيطرة الأجنبية رغم خضوعهم للحكم الروماني، واستمرار مقاومتهم وثوراتهم ومحاولاتهم استعادة حكم بلادهم."},{"q":"استنتِج العلاقة بين أهمية مصر الاقتصادية ومحاولات الرومان إحكام السيطرة عليها.","a":"علاقة طردية؛ فكلما زادت أهمية مصر الاقتصادية بوصفها من أهم مصادر الحبوب ومتحكمة في طرق التجارة بين الشرق والغرب، زاد حرص الرومان على إحكام السيطرة عليها؛ لذلك تعاملوا بشدة مع ثورات المصريين لأن فقدانها يهدد استقرار دولتهم."},{"q":"سؤال التفسير المدعوم بالأدلة: حلِّل قرارات القيادة المصرية (كامس ـ سقنن رع ـ أحمس) في مواجهة الهكسوس.","a":"سقنن رع: قرر الانتقال بطيبة من الاستقلال الذاتي إلى المواجهة، فوسع نفوذه حتى أبيدوس ودفع الهكسوس حتى القوصية، فأدرك الهكسوس خطر صحوة الجيش المصري. كامس: قرر التحول من الدفاع إلى الهجوم، فأعاد تنظيم الجيش وانتصر في مصر الوسطى واتجه شمالًا، وقطع إمدادات كوش لعزل الهكسوس واستنزافهم. أحمس الأول: قرر الحسم بحملة شاملة حاصر فيها منف وأواريس وطارد الهكسوس خارج الحدود حتى قضى عليهم، ثم أخضع حكام الأقاليم مع الإبقاء على ألقابهم وامتيازاتهم لضمان الاستقرار. والدليل على نجاح هذه القرارات أنها كانت متدرجة ومخططة؛ فبناء القوة العسكرية لا يتم بالعشوائية بل بالتخطيط والتدرج."},{"q":"تدريبات الدرس (1): حلِّل العلاقة بين: الموقع الجغرافي ـ الموارد الاقتصادية ـ التنافس الدولي، في تفسير الأطماع الخارجية على مصر.","a":"الموقع الجغرافي (مفترق طرق ثلاث قارات والإشراف على طرق التجارة) والموارد الاقتصادية (خصوبة الأرض ووفرة المحاصيل والحبوب) جعلا السيطرة على مصر تمنح تفوقًا سياسيًّا واقتصاديًّا؛ فدفع ذلك القوى الكبرى إلى التنافس الدولي للسيطرة عليها، فتعاقبت عليها محاولات الهكسوس والفرس واليونان والرومان، ونجحت هذه المحاولات خاصة في فترات ضعف الدولة."},{"q":"تدريبات الدرس (2): «احتلال مصر في العصور القديمة كان نتيجة ضعف داخلي أكثر منه قوة خارجية». ناقِش العبارة من الجانبين، ثم قدِّم حكمًا مدعمًا.","a":"تأييد العبارة: تسلل الهكسوس بعد ضعف الدولة المركزية في نهاية الدولة الوسطى، وانتصر الفرس ومصر تعاني الاضطراب السياسي والصراع الداخلي في العصر المتأخر، وسيطر الرومان ودولة البطالمة تعاني الاضطرابات وصراعات السلطة. معارضة العبارة: كان للقوة الخارجية دور واضح؛ فالهكسوس امتلكوا أسلحة منحتهم التفوق العسكري، والفرس إمبراطورية كبرى، وروما شهدت تحولات سياسية وعسكرية كبرى. الحكم: الاحتلال نتيجة تفاعل الضعف الداخلي مع قوة خارجية طامعة، لكن الضعف الداخلي كان العامل الذي فتح الباب؛ وحين توحدت الإرادة والقيادة طرد المصريون الهكسوس."},{"q":"تدريبات الدرس (3): الهكسوس ـ الفرس ـ الإسكندر: قارِن بين أسباب نجاح كلٍّ منهم في دخول مصر، ثم استنتِج العامل المشترك بينهم.","a":"الهكسوس: ضعف الدولة المركزية وعجزها عن حماية الحدود الشرقية، مع تفوقهم بأسلحة لم تكن متوافرة لدى مصر. الفرس: الاضطراب السياسي والصراع الداخلي في العصر المتأخر، مع قوة الإمبراطورية الفارسية. الإسكندر: معاناة المصريين من وطأة الحكم الفارسي وضرائبه، وسياسته في احترام عاداتهم وتقاليدهم الدينية. العامل المشترك: ضعف الأوضاع الداخلية في مصر وقت دخولهم."},{"q":"تدريبات الدرس (4): ماذا لو... لم يقاوم المصريون الهكسوس؟ ... لم يكن لمصر موقع إستراتيجي؟","a":"لو لم يقاوم المصريون الهكسوس لاستمرت سيطرتهم على الدلتا ومواردها، ولما تحقق استقلال مصر، ولما أدرك المصريون ضرورة تطوير الجيش وتأمين الحدود، فربما لم تُبنَ أول إمبراطورية في التاريخ المصري القديم. ولو لم يكن لمصر موقع إستراتيجي لقلّت أطماع القوى الكبرى فيها والتنافس الدولي عليها، لكنها كانت ستفقد أيضًا مكانتها مركزًا مهمًّا في العالم القديم وإشرافها على طرق التجارة."},{"q":"تدريبات الدرس (5): كيف تحولت مصر في العصور القديمة من نقطة جذب حضاري إلى ساحة صراع دولي؟","a":"جذب موقع مصر المتميز ومواردها الضخمة القوى الكبرى، فأصبحت محورًا إستراتيجيًّا يمنح من يسيطر عليه تفوقًا سياسيًّا واقتصاديًّا؛ ومع فترات ضعف الدولة الداخلي تحولت إلى ساحة للتنافس الدولي، فتعاقب عليها الهكسوس ثم الفرس ثم الإسكندر والبطالمة ثم الرومان."},{"q":"تدريبات الدرس (6): فسِّر: كيف يمكن أن تتحول الموارد الاقتصادية من مصدر قوة إلى سبب للصراع؟","a":"الموارد (خصوبة الأرض ووفرة المحاصيل والحبوب والتحكم في التجارة) مصدر ثراء وقوة للدولة، لكنها تجعلها مطمعًا للقوى الكبرى الساعية إلى مكاسب اقتصادية؛ فإذا ضعفت الدولة تحولت هذه الموارد إلى سبب للغزو، كما سيطر الهكسوس على الدلتا لأنها النبض الاقتصادي لمصر، وسعى الرومان للسيطرة على مصر لأنها من أهم مصادر الحبوب."},{"q":"تدريبات الدرس (7): اختر وبرِّر: العامل الأهم في طرد الهكسوس: التخطيط العسكري ـ القيادة ـ وحدة الشعب.","a":"إجابة مقترحة: التخطيط العسكري؛ لأن النصر جاء متدرجًا عبر ثلاث مراحل: المواجهة مع سقنن رع، ثم إعادة تنظيم الجيش وقطع الإمدادات مع كامس، ثم الحملة الشاملة مع أحمس الأول، وهو ما يؤكده الكتاب: بناء القوة العسكرية لا يتم بالعشوائية بل بالتخطيط والتدرج. ومع ذلك لم يكن التخطيط لينجح لولا قيادة متتابعة حافظت على شرارة المقاومة بعد مقتل سقنن رع ووفاة كامس."},{"q":"تدريبات الدرس (8): كيف يمكن أن يتكرر سيناريو أطماع دول الاحتلال في دولة معاصرة؟ اربط بالتاريخ.","a":"يتكرر إذا اجتمع لدولة ما موقع إستراتيجي وموارد مهمة مع ضعف داخلي كالاضطراب السياسي والصراع على السلطة، كما حدث لمصر مع الهكسوس والفرس والرومان. والوقاية تكون بتحقيق الأمن القومي: التماسك الداخلي، ودعم القوة الذاتية عسكريًّا واقتصاديًّا، والحفاظ على الهوية الوطنية."},{"q":"اختر: ما التحليل الأكثر دقة لأسباب احتلال مصر في العصور القديمة؟ (أ) ضعف مستمر للجيش المصري (ب) ضعف داخلي وموقع متميز (ج) كثرة السكان ونقص الموارد (د) غياب التراث الحضاري المؤثر","a":"(ب) ضعف داخلي وموقع متميز؛ فالموقع والموارد جعلا مصر مطمعًا، وفترات ضعف الدولة جعلتها هدفًا للأطماع الخارجية."},{"q":"اختر: يتمثل أهم درس استفادته مصر من تجربة الهكسوس في: (أ) أهمية الانعزال عن قارة آسيا (ب) تطوير الجيش وتأمين الحدود (ج) ضرورة الاعتماد على المرتزقة (د) تدعيم الأنشطة الاقتصادية المختلفة","a":"(ب) تطوير الجيش وتأمين الحدود؛ وهو ما أسهم في بناء أول إمبراطورية في التاريخ المصري القديم."},{"q":"اختر: نجح الإسكندر في دخول مصر من دون مقاومة تُذكَر، ويرجع ذلك إلى: (أ) قوته العسكرية (ب) تحالفه مع الرومان (ج) احترامه للمصريين (د) استمالة الفرس لجانبه","a":"(ج) احترامه للمصريين؛ إذ اتبع سياسة مختلفة عن الغزاة الآخرين باحترام عاداتهم وتقاليدهم، ووجد فيه المصريون فرصة للتخلص من الحكم الفارسي."},{"q":"اختر: تتمثل الحقيقة الأبرز التي كشفها الغزو الفارسي لمصر في: (أ) التماسك الداخلي أهم عناصر قوة الدولة (ب) قوة الحضارة وحدها تحمي الدولة من الخطر (ج) الموقع نقمة مستمرة على تاريخ مصر (د) الجيش لا يحتاج إلى تطوير إلا وقت الضرورة","a":"(أ) التماسك الداخلي أهم عناصر قوة الدولة؛ لأن مصر سقطت أمام الفرس وهي تعاني الاضطراب السياسي والصراع الداخلي."},{"q":"اختر: تحوَّل الموقع الجغرافي لمصر من نعمة إلى نقمة من خلال: (أ) ثبات نظام الحكم (ب) قلة الموارد الاقتصادية (ج) زيادة عدد السكان (د) ضعف الجبهة الداخلية","a":"(د) ضعف الجبهة الداخلية؛ ففي فترات ضعف الدولة تحوّل الموقع المتميز إلى سبب لأطماع الغزاة."},{"q":"ضع علامة صح أو خطأ مع تفسير إجابتك: اقتصر نجاح الهكسوس في احتلال مصر كنتيجة حتمية لتفوقهم العسكري.","a":"خطأ؛ لم يكن نجاح الهكسوس بسبب تفوقهم العسكري وحده، بل أيضًا بسبب ضعف الدولة المصرية في تلك الفترة وعجزها عن حماية حدودها الشرقية."},{"q":"ضع علامة صح أو خطأ مع تفسير إجابتك: رحَّب المصريون بالإسكندر؛ لأنه مُحرِّر من الفرس وليس غازيًا جديدًا.","a":"خطأ؛ فقد وجد المصريون في الإسكندر فرصة للتخلص من الحكم الفارسي، لكنه كان غازيًا جديدًا (يسمي الكتاب دخوله «غزو الإسكندر الأكبر لمصر») كسب القبول باحترام عاداتهم وتقاليدهم الدينية، بل يذكر أحد الرأيين أن المصريين استقبلوه بحذر وشكك الكهنة ورجال النخبة في نيته."},{"q":"ضع علامة صح أو خطأ مع تفسير إجابتك: أثبتت المقاومة المصرية للرومان أن الهوية أقوى من الاحتلال.","a":"صح؛ فرغم خضوع المصريين للحكم الروماني ظلوا متمسكين بهويتهم الحضارية ورافضين للسيطرة الأجنبية."},{"q":"ضع علامة صح أو خطأ مع تفسير إجابتك: كلما زادت قوة الدولة داخليًّا، قلَّت أطماع القوى الخارجية فيها.","a":"صح؛ فقوة الدولة وتماسكها الداخلي يحميان أمنها القومي، أما فترات ضعفها فجعلت مصر هدفًا للأطماع الخارجية كما حدث مع الهكسوس والفرس والرومان."},{"q":"ضع علامة صح أو خطأ مع تفسير إجابتك: سقوط دولة البطالمة كان بسبب قوة الرومان وحدها من دون تأثير للصراعات الداخلية.","a":"خطأ؛ فقد كانت دولة البطالمة تعاني اضطرابات داخلية وصراعات على السلطة أضعفت قدرتها على حماية استقلالها، في وقت شهدت فيه روما تحولات سياسية وعسكرية كبرى."}],"era":"مصر القديمة"},{"id":"l3","title":"التحولات الكبرى في مصر (العصر الوسيط)","pages":"30-41","hook":"من ولاية رومانية إلى قلبٍ يقود العالم الإسلامي ويحميه... كيف صنعت مصر هذا التحول الكبير؟","bigIdea":"شهدت مصر خلال العصر الوسيط تحولات سياسية واجتماعية واقتصادية وحضارية، أدت إلى انتقالها من ولاية تابعة للدولة الإسلامية الكبرى إلى مركز قيادي مؤثر في العالم الإسلامي.","objectives":["يحدد أبرز الأحداث التاريخية في كل مرحلة من المراحل الرئيسة التي مرت بها مصر في العصر الوسيط.","يفسر تحوُّل مصر إلى مركز سياسي وحضاري مؤثر في العالم الإسلامي.","يحلل دور العلماء والفقهاء في تشكيل الحياة الفكرية والاجتماعية في المجتمع المصري.","يعرض دور الأزهر الشريف كمؤسسة دينية وتعليمية في تحويل مصر إلى مركز علمي وثقافي عالمي.","يناقش العلاقة بين القوة العسكرية لمصر في العصر المملوكي ومكانتها كحامية للعالم الإسلامي.","يعبر عن تقديره لدور مصر في حماية الحضارة الإسلامية."],"sections":[{"id":"l3s1","title":"التحول السياسي لمصر خلال العصر الوسيط","pages":"31-32","intro":"تخيّل بلدًا ينتقل من حكم إمبراطورية إلى حكم خلافة، ثم يصبح هو نفسه صاحب القرار... هذه حكاية مصر السياسية.","cards":[{"kind":"concept","title":"التحول التاريخي","body":"**التحول التاريخي** هو عملية **التغيير الجذري والتدريجي** في بنية المجتمعات وأنظمتها السياسية والاقتصادية، وبالتالي **الانتقال من مرحلة تاريخية إلى مرحلة تاريخية أخرى مختلفة تمامًا**. وقد مرت مصر بعدة تحولات تاريخية كبرى خلال **العصر الوسيط**، ويبدأ الدرس برصد **التحول السياسي**."},{"kind":"date","title":"من الحكم البيزنطي إلى الولاية الإسلامية","date":"641م","body":"شهدت مصر تحولًا سياسيًّا مهمًّا مع **الفتح الإسلامي عام 641م**؛ إذ خرجت من إطار **الإمبراطورية الرومانية البيزنطية** لتصبح **ولاية فاعلة** في الدولة الإسلامية، تُدار وفق **النظام الإداري للخلافة**؛ ما جعلها جزءًا من **كيان سياسي واسع** يمتد عبر مناطق متعددة من العالم الإسلامي. وظل ذلك خلال عصور **الخلافة الراشدة** و**الدولة الأموية** و**العصر العباسي الأول**."},{"kind":"place","title":"خريطة فتح مصر الإسلامي","body":"تُحيط خريطة **فتح مصر الإسلامي** بدوائر حمراء مواقع: **العريش** و**الفرما** في الشمال الشرقي، و**بلبيس**، و**حصن بابليون** قرب **الفسطاط**، و**الإسكندرية** على ساحل **بحر الروم (البحر المتوسط)**. وتُظهر الأسهم دخول الفتح من الشرق مرورًا ببلبيس و**عين شمس** حتى حصن بابليون، ثم اتجاهه شمالًا نحو الإسكندرية."},{"kind":"cause","title":"بداية الاستقلال السياسي لمصر","body":"أدى **ضعف السلطة المركزية للخلافة العباسية** إلى ظهور **الدول المستقلة في مصر**، مثل **الدولة الطولونية** و**الدولة الإخشيدية**؛ فكانت هذه **بداية الاستقلال السياسي لمصر**. ويطرح الكتاب هنا سؤالًا للتفكير: كيف أصبحت مصر **قوة إقليمية فاعلة** في المنطقة؟ وما **مقومات نجاحها** في ذلك؟"},{"kind":"fact","title":"القاهرة الفاطمية: ذروة المكانة السياسية","body":"بلغت مكانة مصر السياسية **ذروتها** عندما أصبحت **القاهرة عاصمة للخلافة الفاطمية**، فتحولت إلى **مركز رئيس لصُنع القرار السياسي والديني** في العالم الإسلامي. واستمرت هذه المكانة في عهد **الأيوبيين** و**المماليك**؛ إذ أصبحت مصر **مركزًا للحكم في المنطقة**، خاصةً مع **مواجهة الحملات الصليبية** و**التصدي لخطر المغول**، وهو ما منحها **دورًا محوريًّا في الدفاع عن العالم الإسلامي**."},{"kind":"date","title":"مصر ولاية عثمانية","date":"1517م","body":"أدركت **الدولة العثمانية** أهمية مصر، وسرعان ما **ضمتها إلى حكمها عام 1517م**، فتحولت مصر إلى **ولاية عثمانية**. ونظرًا لمكانة مصر **الاقتصادية والإستراتيجية** أطلق عليها العثمانيون لقب **«درة التاج العثماني»**."},{"kind":"fact","title":"مراحل التحول السياسي باختصار","body":"يمكن تلخيص التحول السياسي لمصر في العصر الوسيط في مراحل متتابعة كما يعرضها الدرس: من **ولاية تابعة** للخلافة، إلى **بداية الاستقلال**، ثم **مركز قيادي** للعالم الإسلامي، وأخيرًا **ولاية عثمانية**. وهذا التلخيص يساعدك على حل نشاط: حدِّد ثلاث فترات تاريخية مرت بها مصر الإسلامية.","points":["ولاية تابعة: من الفتح 641م حتى العصر العباسي الأول","بداية الاستقلال: الطولونيون والإخشيديون","مركز قيادي: الفاطميون ثم الأيوبيون والمماليك","ولاية عثمانية: منذ 1517م"]}],"quiz":[{"type":"order","q":"رتّب مراحل التحول السياسي لمصر في العصر الوسيط من الأقدم إلى الأحدث","items":["الفتح الإسلامي وتحول مصر إلى ولاية","ظهور الدولتين الطولونية والإخشيدية","القاهرة عاصمة للخلافة الفاطمية","مواجهة الصليبيين والمغول في عهد الأيوبيين والمماليك","ضم الدولة العثمانية لمصر"],"explain":"بدأت مصر **ولاية** بعد الفتح عام **641م**، ثم ظهرت **الدول المستقلة** مع ضعف الخلافة العباسية، وبلغت الذروة بـ**القاهرة الفاطمية** واستمرت مكانتها مع **الأيوبيين والمماليك**، حتى ضمها **العثمانيون عام 1517م**."},{"type":"mcq","q":"ما السبب الذي أدى إلى ظهور دول مستقلة في مصر مثل الدولة الطولونية والدولة الإخشيدية؟","options":["سقوط بغداد على يد المغول","ضعف السلطة المركزية للخلافة العباسية","إصلاحات الدولة الأموية وتعريب الدواوين","ضم الدولة العثمانية لمصر"],"answer":1,"explain":"أدى **ضعف السلطة المركزية للخلافة العباسية** إلى ظهور الدول المستقلة في مصر، وكانت هذه **بداية الاستقلال السياسي** لها."},{"type":"tf","q":"ظلت مصر ولاية تُدار وفق النظام الإداري للخلافة خلال عصور الخلافة الراشدة والدولة الأموية والعصر العباسي الأول.","answer":true,"explain":"بعد الفتح الإسلامي عام **641م** أصبحت مصر ولاية في الدولة الإسلامية، وظل ذلك خلال **الخلافة الراشدة** و**الدولة الأموية** و**العصر العباسي الأول**."},{"type":"mcq","q":"يمكن وصف التحول السياسي الأبرز لمصر في العصر الوسيط بأنه تحول:","options":["من دولة إلى ولاية","من مركز إلى هامش","من ولاية إلى مركز قيادي","من استقلال إلى تبعية"],"answer":2,"explain":"انتقلت مصر من **ولاية تابعة** للدولة الإسلامية الكبرى إلى **مركز قيادي مؤثر** في العالم الإسلامي، وهذه هي الفكرة الرئيسة للدرس."},{"type":"tf","q":"اقتصر سبب تحول مصر من ولاية إلى دولة مركزية على ضعف الخلافة العباسية.","answer":false,"explain":"الصواب: **لم يقتصر** السبب على ضعف الخلافة العباسية؛ فقد أسهمت أيضًا مكانة **القاهرة عاصمةً للخلافة الفاطمية** و**مواجهة الصليبيين والمغول**، إلى جانب تحولات **اجتماعية واقتصادية وحضارية**."},{"type":"match","q":"صِل كل مرحلة من تاريخ مصر السياسي بما يميزها","pairs":[["ولاية في الدولة الإسلامية","تُدار وفق النظام الإداري للخلافة"],["الدولتان الطولونية والإخشيدية","بداية الاستقلال السياسي لمصر"],["القاهرة الفاطمية","مركز صنع القرار السياسي والديني"],["الأيوبيون والمماليك","مواجهة الصليبيين والتصدي للمغول"],["الحكم العثماني","لقب «درة التاج العثماني»"]],"explain":"لكل مرحلة سمة: **الولاية** تتبع إدارة الخلافة، و**الاستقلال** بدأ بالطولونيين والإخشيديين، و**الذروة** مع القاهرة الفاطمية، ثم **الدور الدفاعي** مع الأيوبيين والمماليك، وأخيرًا **درة التاج العثماني**."},{"type":"fill","q":"بلغت مكانة مصر السياسية ذروتها عندما أصبحت القاهرة عاصمة للخلافة ____.","options":["الأموية","الفاطمية","العباسية","الراشدة"],"answer":1,"explain":"عندما صارت **القاهرة عاصمة للخلافة الفاطمية** تحولت إلى **مركز رئيس لصنع القرار السياسي والديني** في العالم الإسلامي."},{"type":"mcq","q":"لماذا اتجهت الدولة العثمانية لضم مصر؟","options":["لوقف التوسع المغولي في العالم الإسلامي","لإحياء الخلافة العباسية في القاهرة","لأن مصر كانت تابعة للإمبراطورية البيزنطية","لإدراكها أهمية مصر ومكانتها الاقتصادية والإستراتيجية"],"answer":3,"explain":"أدركت الدولة العثمانية **أهمية مصر** فضمتها عام **1517م**، ولمكانتها **الاقتصادية والإستراتيجية** لقبتها بـ**«درة التاج العثماني»**."},{"type":"sort","q":"صنّف كل عبارة حسب المرحلة التي تصفها","buckets":["مصر ولاية تابعة","مصر مركز قيادي"],"items":[["تُدار وفق النظام الإداري للخلافة",0],["جزء من كيان سياسي واسع",0],["عصر الخلافة الراشدة والدولة الأموية",0],["القاهرة مركز لصنع القرار السياسي والديني",1],["مواجهة الحملات الصليبية",1],["دور محوري في الدفاع عن العالم الإسلامي",1]],"explain":"في مرحلة **الولاية** كانت مصر جزءًا من كيان واسع تديره الخلافة، أما في مرحلة **المركز القيادي** فصارت القاهرة تصنع القرار وتدافع عن العالم الإسلامي."}]},{"id":"l3s2","title":"التحول الاجتماعي بعد الفتح الإسلامي","pages":"32-33","intro":"لغة تنتشر، وقبائل تستقر، وجيران يمتزجون... كيف تغيّر وجه المجتمع المصري؟","cards":[{"kind":"concept","title":"من مجتمع متعدد إلى طابع عربي إسلامي","body":"يطرح الكتاب سؤالًا محوريًّا: كيف تحولت مصر خلال **القرون الأولى بعد الفتح الإسلامي** من **مجتمع متعدد اللغات والثقافات** إلى **مجتمع يغلب عليه الطابع العربي الإسلامي**؟ ويعرض الدرس عاملين رئيسين لهذا التحول الاجتماعي: **تعريب اللغة ونشرها**، و**الهجرات العربية إلى مصر**."},{"kind":"cause","title":"تعريب اللغة ونشرها","body":"انتشرت **اللغة العربية** في مصر **تدريجيًّا** بعد الفتح الإسلامي، خاصةً مع **إصلاحات الدولة الأموية** و**تعريب الدواوين**؛ فأصبحت العربية **لغة الإدارة**، ومع مرور الزمن تحولت إلى **لغة العلم والثقافة**، خصوصًا مع **ازدهار المراكز العلمية في الفسطاط ثم القاهرة**."},{"kind":"result","title":"التعريب أكبر من تغيير لغوي","body":"لم يكن **التعريب** مجرد تغيير لغوي، بل كان **عاملًا مهمًّا في ربط مصر بالعالم الإسلامي**، وأسهم في **تشكيل الهوية الثقافية للمجتمع المصري**. ومن القيم التي يعلّمها الدرس: **احترام التعددية الثقافية** من الأمور الحتمية في عالم اليوم؛ وذلك **للحفاظ على مكونات الدولة وتركيبها الديموغرافي**."},{"kind":"quote","title":"ابن خلدون: لغة الشعوب تتبع الغالب","body":"يقول **ابن خلدون** في كتابه **«المقدمة»**: «اعلم أن لغات أهل الأمصار إنما تكون **بلسان الأمة أو الجيل الغالبين عليها**، ولذلك كانت لغات الأمصار الإسلامية كلها بالمشرق والمغرب لهذا العهد عربية، وهجرت الأمم لغاتهم وألسنتهم في جميع الأمصار والممالك، وصار **اللسان العربي لسانهم**».","points":["الفكرة: السيطرة السياسية تؤثر في تغيّر لغة الشعوب","في مصر: صارت العربية لغة الإدارة ثم لغة العلم والثقافة"]},{"kind":"fact","title":"الهجرات العربية إلى مصر","body":"شهدت مصر **حركة هجرات عربية** أسهمت في **إعادة تشكيل المجتمع المصري**؛ فقد **استقرت القبائل العربية** في **الفسطاط** وبعض مناطق **الدلتا** و**الصعيد**، و**امتزجت بالسكان المحليين**؛ ما أدى إلى **انتشار اللغة العربية والعادات الإسلامية**."},{"kind":"result","title":"نُخب قَبَلية وإدارية","body":"ومع مرور الزمن **برزت من بين الجماعات العربية** المهاجرة **نُخب قَبَلية وإدارية** شاركت في **إدارة الأقاليم** وفي **الحياة العسكرية والسياسية**، وهو ما ساعد على **إبراز مصر بصورة أعمق** في **المجال الحضاري والثقافي** للدولة الإسلامية."}],"quiz":[{"type":"mcq","q":"ما الإجراء الذي جعل اللغة العربية لغة الإدارة في مصر؟","options":["إنشاء الأزهر الشريف","تعريب الدواوين ضمن إصلاحات الدولة الأموية","تأسيس مدينة القطائع","ازدهار حركة الترجمة"],"answer":1,"explain":"مع **إصلاحات الدولة الأموية** و**تعريب الدواوين** أصبحت العربية **لغة الإدارة**، ثم تحولت مع الزمن إلى لغة العلم والثقافة."},{"type":"order","q":"رتّب مراحل انتشار اللغة العربية في مصر كما عرضها الكتاب من الأقدم إلى الأحدث","items":["الفتح الإسلامي لمصر","تعريب الدواوين في عهد الدولة الأموية","العربية لغة الإدارة","العربية لغة العلم والثقافة"],"explain":"انتشرت العربية **تدريجيًّا** بعد الفتح، فصارت **لغة الإدارة** بتعريب الدواوين، ثم **لغة العلم والثقافة** مع ازدهار مراكز **الفسطاط ثم القاهرة**."},{"type":"tf","q":"لم يكن التعريب مجرد تغيير لغوي، بل أسهم في ربط مصر بالعالم الإسلامي وتشكيل هويتها الثقافية.","answer":true,"explain":"يؤكد الكتاب أن التعريب كان **عاملًا مهمًّا في ربط مصر بالعالم الإسلامي**، وأسهم في **تشكيل الهوية الثقافية** للمجتمع المصري."},{"type":"tf","q":"استقرت القبائل العربية المهاجرة في الإسكندرية وحدها، وعاشت منعزلة عن السكان المحليين.","answer":false,"explain":"الصواب: استقرت القبائل العربية في **الفسطاط وبعض مناطق الدلتا والصعيد**، و**امتزجت بالسكان المحليين**؛ فانتشرت اللغة العربية والعادات الإسلامية."},{"type":"fill","q":"يرى ابن خلدون أن لغات أهل الأمصار إنما تكون بلسان الأمة أو الجيل ____ عليها.","options":["الوافدين","المغلوبين","المجاورين","الغالبين"],"answer":3,"explain":"يقول ابن خلدون في **«المقدمة»** إن لغات الأمصار تكون **بلسان الأمة الغالبة**، ولذلك صارت لغات الأمصار الإسلامية عربية."},{"type":"match","q":"صِل كل عنصر بما يرتبط به","pairs":[["ابن خلدون","كتاب «المقدمة»"],["تعريب الدواوين","العربية لغة الإدارة"],["القبائل العربية","الفسطاط والدلتا والصعيد"],["النخب القبلية والإدارية","المشاركة في إدارة الأقاليم"]],"explain":"**ابن خلدون** فسّر انتشار العربية في «المقدمة»، و**تعريب الدواوين** جعلها لغة الإدارة، و**القبائل العربية** استقرت في الفسطاط والدلتا والصعيد، وبرزت منها **نخب** شاركت في إدارة الأقاليم."},{"type":"sort","q":"صنّف ما يلي إلى أسباب التحول الاجتماعي ونتائجه","buckets":["أسباب","نتائج"],"items":[["تعريب الدواوين",0],["استقرار القبائل العربية في مصر",0],["امتزاج العرب بالسكان المحليين",0],["انتشار اللغة العربية والعادات الإسلامية",1],["ربط مصر بالعالم الإسلامي",1],["تشكيل الهوية الثقافية للمجتمع المصري",1]],"explain":"**التعريب** و**الهجرات العربية** وامتزاج العرب بالمصريين كانت أسبابًا، نتج عنها **انتشار العربية والعادات الإسلامية** وربط مصر بالعالم الإسلامي وتشكيل هويتها الثقافية."},{"type":"who","q":"من أنا؟","clues":["مفكر رأى أن لغة الشعوب تتأثر بالسيطرة السياسية عليها","لاحظت أن لغات الأمصار الإسلامية بالمشرق والمغرب صارت عربية في عهدي","صاحب كتاب «المقدمة»"],"options":["المقريزي","ابن خلدون","ابن إياس","عمرو بن العاص"],"answer":1,"explain":"هو **ابن خلدون** صاحب **«المقدمة»**، الذي قرر أن لغات أهل الأمصار تكون **بلسان الأمة الغالبة عليها**."},{"type":"mcq","q":"في ضوء نص ابن خلدون، كيف تؤثر السيطرة السياسية في لغة الشعوب؟","options":["تنتشر لغة الأمة الغالبة حتى تصبح لسان الشعوب","تنتشر لغة الشعوب المحلية بين الحكام الوافدين","تنشأ لغة جديدة مختلطة تحل محل اللغتين","تبقى لغة الإدارة مختلفة دائمًا عن لغة الناس"],"answer":0,"explain":"يرى ابن خلدون أن الأمم **هجرت لغاتها** وصار **اللسان العربي لسانها** لأن اللغة تتبع الأمة الغالبة، وهو ما حدث في مصر حين صارت العربية لغة الإدارة ثم العلم."}]},{"id":"l3s3","title":"التحول الثقافي والفكري","pages":"33-35","intro":"لم يجلسوا على العروش، لكنهم صنعوا عقل الأمة... تعرّف على علماء مصر ومؤسساتها ومؤرخيها.","cards":[{"kind":"concept","title":"العلماء والفقهاء: حلقة وصل","body":"رغم **عدم توليهم الحكم مباشرةً**، كان للعلماء والفقهاء **دور كبير في إدارة المجتمع والسياسة بشكل غير مباشر**؛ فقد تولوا **القضاء** و**التعليم** و**تنظيم الشئون الدينية**، ليكونوا **حلقة وصل بين الإدارة السياسية في مصر والشعب**، ويضمنوا **استقرار المجتمع وفق مبادئ الشريعة**.","points":["القضاء","التعليم","تنظيم الشئون الدينية"]},{"kind":"result","title":"العلماء ركائز المجتمع المصري","body":"لعب العلماء دورًا كبيرًا في **نشر التعليم الديني والفقهي** و**ترسيخ الهوية والثقافة الإسلامية**، وفي **بناء قاعدة علمية** ساعدت على **ظهور مراكز علمية في الفسطاط والقاهرة**. وهكذا أصبحوا **ركائز أساسية في المجتمع المصري** بعد الفتح الإسلامي، وأسهموا في **تحويل مصر إلى مركز علمي وثقافي** في العالم الإسلامي."},{"kind":"place","title":"الأزهر الشريف","body":"تطورت الحياة العلمية في مصر بعد تأسيس **مؤسسات دينية وتعليمية**، على رأسها **الأزهر الشريف**، الذي **لم يقتصر دوره على الصلاة**، بل كان **مركزًا لتدريس الفقه واللغة والعلوم الشرعية**، وأسهم في **إعداد العلماء والقضاة**. كما ساعدت هذه المؤسسات على **ربط مصر بالمراكز الثقافية في العالم الإسلامي**، وجعلتها **مركزًا لتبادل العلوم والمعرفة بين العلماء والطلاب**."},{"kind":"fact","title":"ازدهار التأليف والترجمة","body":"شهدت مصر **نشاطًا علميًّا واسعًا** في مجالات متعددة، مثل **الفقه** و**الفلسفة** و**الطب** و**التاريخ** و**العلوم الطبيعية**. كما ساعدت **حركة الترجمة** في نقل علوم **الحضارات القديمة (اليونانية والفارسية والهندية)** إلى **الثقافة العربية**؛ ما أسهم في **تطوير الفكر العلمي والفلسفي**، وربط مصر بالحضارة الإسلامية، وتعزيز دورها في **نشر المعرفة** و**التفاعل الحضاري** مع المناطق المجاورة كافة."},{"kind":"person","title":"المقريزي: إمام المؤرخين","body":"برز في مصر مؤرخون أسهموا في **تدوين تاريخ المجتمع المصري** وتحليل أحداثه السياسية والاجتماعية، ومن أشهرهم **المقريزي (ت 845 هـ)** المعروف بـ**«إمام المؤرخين»**، صاحب المؤلفات القيمة مثل **«المواعظ والاعتبار بذكر الخطط والآثار»** و**«الخطط المقريزية»**، وقد تناول في كتاباته **تاريخ مصر والدولة الإسلامية** و**الحياة الاجتماعية والاقتصادية** في عصره."},{"kind":"person","title":"ابن إياس: شاهد على عصره","body":"**ابن إياس (ت 930 هـ)** مؤرخ **شاهد على عصره في أواخر الدولة المملوكية**، وهو صاحب كتاب **«بداية الدهر في محاسن أهل العصر»** الذي يُعَد **مصدرًا أساسيًّا لتاريخ الدولة المملوكية** في مصر. وتميزت كتاباته **بالدقة** لأنه كان **شاهدًا على الأحداث التي سجلها**. ومن قيم الدرس: يُسهم **التاريخ** في **تعزيز الهوية الوطنية** للدول والحفاظ على ذاكرتها التاريخية لتبقى خالدة."}],"quiz":[{"type":"mcq","q":"ما التحليل الأكثر دقة لدور العلماء في مصر خلال العصر الوسيط؟","options":["دور هامشي","دور عسكري","دور اقتصادي","حلقة وصل"],"answer":3,"explain":"تولى العلماء **القضاء والتعليم وتنظيم الشئون الدينية**، فكانوا **حلقة وصل بين الإدارة السياسية والشعب** وضمنوا استقرار المجتمع."},{"type":"tf","q":"تولى العلماء والفقهاء الحكم في مصر بشكل مباشر.","answer":false,"explain":"الصواب: **لم يتولَّ** العلماء الحكم مباشرةً، لكنهم أسهموا في **إدارة المجتمع والسياسة بشكل غير مباشر** عبر القضاء والتعليم وتنظيم الشئون الدينية."},{"type":"tf","q":"تركّز دور العلماء في مصر خلال العصر الوسيط على الجانب الديني فقط.","answer":false,"explain":"الصواب: امتد دورهم إلى **القضاء والتعليم** والربط بين **الإدارة والشعب** وبناء **قاعدة علمية**، فكان تأثيرهم **فكريًّا واجتماعيًّا** أيضًا لا دينيًّا فقط."},{"type":"mcq","q":"يتمثل الدور الأكثر شمولًا للأزهر في تحول مصر خلال العصر الوسيط في أنه:","options":["مسجد للصلاة والتعليم","مركز حضاري","أنموذج للتطور المعماري","مقر للحكم"],"answer":1,"explain":"لم يقتصر دور **الأزهر** على الصلاة، بل درّس **الفقه واللغة والعلوم الشرعية**، وأعدّ **العلماء والقضاة**، وربط مصر بالمراكز الثقافية؛ فهو **مركز حضاري** شامل."},{"type":"fill","q":"ساعدت حركة الترجمة في نقل علوم الحضارات القديمة: اليونانية والفارسية و____ إلى الثقافة العربية.","options":["الرومانية","الفرعونية","الهندية","البيزنطية"],"answer":2,"explain":"نقلت **حركة الترجمة** علوم الحضارات **اليونانية والفارسية والهندية** إلى العربية، فأسهمت في تطوير **الفكر العلمي والفلسفي**."},{"type":"mcq","q":"كيف أسهمت حركة الترجمة في ازدهار التأليف العلمي في مصر؟","options":["نقلت علوم الحضارات القديمة إلى العربية فطوّرت الفكر العلمي والفلسفي","حصرت التأليف في الفقه والعلوم الشرعية","جعلت العربية لغة الإدارة بعد تعريب الدواوين","أتاحت للعلماء تولي الحكم مباشرةً"],"answer":0,"explain":"بنقل علوم **اليونان والفرس والهند** إلى الثقافة العربية تطور **الفكر العلمي والفلسفي**، فازدهر التأليف في **الفقه والفلسفة والطب والتاريخ والعلوم الطبيعية**."},{"type":"who","q":"من أنا؟","clues":["مؤرخ برز في مصر، وكانت وفاتي سنة 845 هـ","تناولت في كتاباتي تاريخ مصر والدولة الإسلامية والحياة الاجتماعية والاقتصادية في عصري","لُقّبت بـ«إمام المؤرخين»، ومن مؤلفاتي «المواعظ والاعتبار بذكر الخطط والآثار»"],"options":["ابن إياس","ابن خلدون","المقريزي","أحمد بن طولون"],"answer":2,"explain":"هو **المقريزي (ت 845 هـ)** «إمام المؤرخين»، صاحب **«المواعظ والاعتبار بذكر الخطط والآثار»** و**«الخطط المقريزية»**."},{"type":"sort","q":"صنّف كل وصف إلى المؤرخ الذي يناسبه","buckets":["المقريزي","ابن إياس"],"items":[["لُقّب بـ«إمام المؤرخين»",0],["صاحب «المواعظ والاعتبار بذكر الخطط والآثار»",0],["توفي سنة 845 هـ",0],["شاهد على أواخر الدولة المملوكية",1],["مصدر أساسي لتاريخ الدولة المملوكية",1],["توفي سنة 930 هـ",1]],"explain":"**المقريزي** «إمام المؤرخين» كتب عن تاريخ مصر والدولة الإسلامية، أما **ابن إياس** فعاش أواخر **الدولة المملوكية** وسجّل أحداثها بدقة لأنه كان شاهدًا عليها."},{"type":"match","q":"صِل كل مؤسسة أو فئة بدورها","pairs":[["الأزهر الشريف","تدريس الفقه واللغة والعلوم الشرعية"],["حركة الترجمة","نقل علوم الحضارات القديمة إلى العربية"],["العلماء والفقهاء","تولي القضاء وتنظيم الشئون الدينية"],["المؤرخون","تدوين تاريخ المجتمع المصري"]],"explain":"تكاملت أدوار **الأزهر** و**حركة الترجمة** و**العلماء** و**المؤرخين** في تحويل مصر إلى **مركز علمي وثقافي** في العالم الإسلامي."}]},{"id":"l3s4","title":"التحول العمراني والحضاري في مصر","pages":"35-36","intro":"للمدن ذاكرة أيضًا... تجوّل بين عواصم مصر الإسلامية واقرأ ما تقوله أسواقها ومساجدها عن قوة الدولة.","cards":[{"kind":"place","title":"الفسطاط: مدينة عمرو بن العاص","body":"أسس **عمرو بن العاص** مدينة **الفسطاط** لتكون **مركزًا للحكم والإدارة**، وقد **اختير موقعها لاعتبارات عسكرية وإدارية واقتصادية**. ويطرح الكتاب سؤالًا للتفكير: لماذا فضَّل المسلمون **إنشاء عاصمة جديدة** بدلًا من مدينة **الإسكندرية**؟ فكّر في الإجابة في ضوء أسباب اختيار موقع الفسطاط."},{"kind":"place","title":"القطائع وأثر العواصم الجديدة","body":"مع **صعود الدولة الطولونية** أنشأ **أحمد بن طولون** مدينة **القطائع** لتكون **مقرًّا للحكم ومركزًا سياسيًّا**. وقد أسهمت هذه العواصم الإسلامية (**الفسطاط** و**القطائع**) في تنظيم الحكم وتنشيط التجارة ودمج السكان، كما توضح النقاط:","points":["تنظيم الإدارة والحكم","تطوير النشاط التجاري","دمج السكان المحليين مع العرب","تشكيل مجتمع حضري جديد في مصر الإسلامية"]},{"kind":"concept","title":"ملامح عمران المدن الإسلامية","body":"تشترك **المدن الإسلامية في مصر** في ملامح عمرانية تجمع بين العبادة والدفاع والتجارة والعلم، وهي: **وجود مسجد وسط المدينة**، و**بناء مساكن للجند**، و**إنشاء أسواق وخانات**، و**إنشاء مؤسسات علمية وثقافية**، و**بناء قلاع وحصون**. ومن القيم المهمة: **الحفاظ على الإرث الحضاري والمادي للدولة**؛ لأنه **يُمثِّل ذاكرة الأمة التاريخية**."},{"kind":"place","title":"القاهرة الفاطمية والمملوكية","body":"أسس **الفاطميون** مدينة **القاهرة** لتكون **عاصمة لدولتهم**، ومع مرور الوقت تحولت إلى **واحدة من أهم المدن في العالم الإسلامي**. وخلال **العصر المملوكي** شهدت **ازدهارًا كبيرًا** شمل **المساجد والمدارس**، و**الأسواق والخانات**، و**القصور والمباني الحكومية**."},{"kind":"result","title":"القاهرة نموذج المدينة الإسلامية الكبرى","body":"جعل هذا التطور **القاهرة نموذجًا للمدينة الإسلامية الكبرى**؛ إذ **اجتمعت فيها السلطات السياسية والاقتصادية والثقافية**، و**جذبت العلماء والتجار والطلاب** من مختلف أنحاء العالم الإسلامي. ونتج عن هذا التطور العمراني **تنشيط الحياة الاقتصادية والاجتماعية والثقافية**؛ فقد أسهم ازدهارها في **تنشيط الاقتصاد** و**تعزيز التفاعل الاجتماعي** و**دعم الاستقرار الحضاري**."},{"kind":"quote","title":"المقريزي يصف القاهرة","body":"يقول **المقريزي**: «كانت **القاهرة مَجمَع التجار والعلماء والناس من سائر الأقطار**». ويكشف هذا النص عن **مكانة القاهرة** مدينةً جامعةً يقصدها التجار والعلماء من كل البلاد، ويدعونا الكتاب إلى التفكير في **العمارة المدنية** بوصفها **مؤشرًا على تطور المجتمع الحضري**."}],"quiz":[{"type":"mcq","q":"لماذا اختير موقع مدينة الفسطاط؟","options":["لأنها كانت مقرًّا للحكم البيزنطي","لاعتبارات عسكرية وإدارية واقتصادية","لتكون عاصمة للخلافة الفاطمية","لاعتبارات دينية فقط"],"answer":1,"explain":"أسس **عمرو بن العاص** الفسطاط لتكون **مركزًا للحكم والإدارة**، واختير موقعها **لاعتبارات عسكرية وإدارية واقتصادية**."},{"type":"match","q":"صِل كل مدينة بمؤسسها","pairs":[["الفسطاط","عمرو بن العاص"],["القطائع","أحمد بن طولون"],["القاهرة","الفاطميون"]],"explain":"أسس **عمرو بن العاص** الفسطاط، وأنشأ **أحمد بن طولون** القطائع مع صعود الدولة الطولونية، وأسس **الفاطميون** القاهرة عاصمة لدولتهم."},{"type":"order","q":"رتّب العواصم الإسلامية في مصر حسب تأسيسها من الأقدم إلى الأحدث","items":["الفسطاط","القطائع","القاهرة"],"explain":"أُسست **الفسطاط** على يد عمرو بن العاص، ثم **القطائع** مع صعود الدولة الطولونية بعد ضعف الخلافة العباسية، ثم **القاهرة** على يد الفاطميين."},{"type":"tf","q":"يعكس التطور العمراني في ا
